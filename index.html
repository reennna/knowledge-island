  /* ===================== 자동 업데이트(깃허브에 새 파일이 올라오면) ===================== */
  // 게임 파일의 '마지막 수정 시각'을 1분마다 살짝 확인 → 새 파일이면 하던 것을 마친 순간 저장하고 새 버전으로 바꿈
  const Upd = {
    on: false, base: 0, etag: '', pending: false, target: '', checking: false, waitFrom: 0, safeSince: 0,
    init() {
      try {
        if (!LS_OK || !/^https?:$/.test(location.protocol) || API.gas || (window.claude && window.claude.hot)) return;
        const lm = Date.parse(document.lastModified);
        this.base = isFinite(lm) ? lm : 0; this.on = true;
        setTimeout(() => this.check(), 8000); // 처음 한 번(ETag 기준 잡기)
        setInterval(() => this.check(), Math.max(20, CFG.UPDATE_CHECK_SEC) * 1000);
      } catch (e) { this.on = false; }
    },
    check() {
      if (!this.on || this.checking || document.visibilityState === 'hidden') return;
      this.checking = true;
      fetch(location.pathname + '?u=' + Date.now(), { method: 'HEAD', cache: 'no-store' })
        .then((r) => {
          if (!r.ok) return;
          const lm = Date.parse(r.headers.get('Last-Modified') || ''), et = r.headers.get('ETag') || '';
          if (isFinite(lm) && this.base) { if (lm > this.base + 2000) this.found(String(lm)); return; }
          if (et) { if (!this.etag) this.etag = et; else if (et !== this.etag) this.found(et.replace(/[^0-9a-zA-Z-]/g, '').slice(0, 40)); }
        })
        .catch(() => {}).finally(() => { this.checking = false; });
    },
    tried() { try { return JSON.parse(sessionStorage.getItem(KEY + ':upd') || '{}'); } catch (e) { return {}; } },
    found(v) {
      if (this.pending && v === this.target) return;
      if ((this.tried()[v] || 0) >= 2) return; // 같은 새 버전으로 두 번 바꿔도 안 되면 그만(무한 새로고침 방지)
      this.pending = true; this.target = v; this.waitFrom = 0; this.safeSince = 0;
      const bar = $('#updBar'); bar.hidden = false;
      bar.innerHTML = '<b>새 버전이 나왔어요!</b><span>하던 것을 마치면 저절로 바뀌어요. 기록은 그대로예요.</span>';
    },
    safe() {
      if (mode === 'play') return !ui.modal && !ui.dialog;
      if (mode === 'title') return !ui.modal && !draftTouched && !$('#inName').value && !$('#inCls').value && !$('#inNum').value;
      if (mode === 'teacher') return ui.modal === 'teacher' && !T.drafting() && !T.busy;
      return false;
    },
    // 2.5초 동안 계속 '쉬는 순간'일 때만 바꿈(퀴즈 끝 → 다음 대화 사이에 끼어들지 않게)
    tick() {
      if (!this.pending) return;
      if (!this.safe()) { this.safeSince = 0; return; }
      if (!this.safeSince) { this.safeSince = Date.now(); return; }
      if (Date.now() - this.safeSince >= 2500) this.go();
    },
    go() {
      // 시트로 보내던 기록이 끝날 때까지 잠깐 기다림(최대 6초)
      if (API.inflight > 0) { if (!this.waitFrom) this.waitFrom = Date.now(); if (Date.now() - this.waitFrom < 6000) return; }
      const t = this.tried(); t[this.target] = (t[this.target] || 0) + 1;
      try {
        sessionStorage.setItem(KEY + ':upd', JSON.stringify(t));
        if (st && mode === 'play') { save(); sessionStorage.setItem(KEY + ':resume', st.key); }
        if (mode === 'teacher' && T.pin) sessionStorage.setItem(KEY + ':tpin', JSON.stringify({ pin: T.pin, tab: T.tab, cls: T.cls, target: T.target, minutes: T.minutes }));
      } catch (e) { /* 무시 */ }
      this.pending = false;
      const q = new URLSearchParams(location.search); q.set('v', this.target);
      location.replace(location.pathname + '?' + q.toString() + location.hash);
    }
  };
  // 다른 창에 있다가 돌아오면 바로 확인

        if (r && r.ok) { toast(`${esc(who)} 학생을 삭제했어요.`, 'good'); T.students = (T.students || []).filter((x) => x.key !== key); }
        else if (teacherFail(r)) return;
        else toast((r && r.error) || '삭제하지 못했어요.');
        openTeacher(); loadOverview(); loadStatus();
      }).catch(() => { toast('서버에 연결하지 못했어요.'); openTeacher(); });
    }, () => openTeacher());
  }
  function exitTeacher() {
    clearInterval(T.timer); T.pin = ''; T.students = null; T.draft = ''; T.busy = false;
    ui.modal = null; $('#modal').hidden = true; $('#sheet').innerHTML = ''; $('#sheet').classList.remove('wide');
    st = null; mode = 'title'; toTitle();
  }
  $('#teacherBtn').addEventListener('click', () => { if (mode === 'title' && !ui.modal) openTeacherLogin(); });

  /* ===================== 시작 화면 ===================== */
  let draftLook = null;
  function randomLook() { return { skin: pick(SKIN), hair: pick(HAIR.slice(0, 4)), style: pick(HAIR_STYLES.map((x) => x[0])), shirt: pick(SHIRT), pants: pick(PANTS), hat: 'none' }; }
  let draftTouched = false;
  function setErr(html) { $('#tErr').innerHTML = html || ''; ['#inCls', '#inNum', '#inName'].forEach((x) => $(x).classList.remove('bad')); }
  function fail(sel, msg) { setErr(msg); $(sel).classList.add('bad'); try { $(sel).focus(); } catch (e) { /* 무시 */ } return false; }
  function toTitle() {
    if (st && mode === 'play') save();
    Poll.stop();
    mode = 'title'; ui.near = null;
    ['#hud', '#toolbar', '#minimap', '#questTrack', '#joy', '#actBtn', '#prompt', '#dialog'].forEach((x) => { $(x).hidden = true; });
    $('#title').hidden = false;
    draftLook = randomLook(); draftTouched = false;
    bindMaker($('#maker'), draftLook, () => { draftTouched = true; });
    $('#inName').value = ''; $('#inCls').value = ''; $('#inNum').value = ''; setErr('');
    const list = (LS.get(KEY + ':players') || []).filter((x) => x.cls && x.num).sort((a, b) => b.updated - a.updated).slice(0, 8);
    $('#savedBox').hidden = !list.length;
    $('#savedList').innerHTML = list.map((x) => `<button class="btn small" data-key="${esc(x.key)}">${esc(x.cls)}반 ${esc(x.num)}번 ${esc(x.name)} <small>메달 ${x.medals || 0}</small></button>`).join('');
    $('#savedList').querySelectorAll('[data-key]').forEach((b) => b.addEventListener('click', () => { const sv = LS.get(KEY + ':p:' + b.dataset.key); if (sv) begin(sv); else setErr('저장된 기록을 찾지 못했어요.'); }));
  }
  function startGame() {
    Snd.init();
    const clsRaw = $('#inCls').value.trim(), numRaw = $('#inNum').value.trim();
    const name = $('#inName').value.trim().replace(/[<>"'&]/g, '').replace(/\s+/g, ' ');
    if (!clsRaw) return fail('#inCls', '반을 써 주세요.');
    if (!/^\d{1,2}$/.test(clsRaw) || +clsRaw < 1 || +clsRaw > 20) return fail('#inCls', '반은 1부터 20까지 숫자로만 써 주세요.');
    if (!numRaw) return fail('#inNum', '번호를 써 주세요.');
    if (!/^\d{1,2}$/.test(numRaw) || +numRaw < 1 || +numRaw > 50) return fail('#inNum', '번호는 1부터 50까지 숫자로만 써 주세요.');
    if (!name) return fail('#inName', '이름을 써 주세요.');
    const cls = +clsRaw, num = +numRaw, old = LS.get(KEY + ':p:' + playerKey(cls, num));
    const keepLook = (sv) => { if (draftTouched) sv.look = Object.assign({}, sv.look, draftLook, { hat: (sv.look && sv.look.hat) || 'none' }); };
    if (old && old.name !== name) {
      setErr(`<div class="tconfirm">6학년 ${cls}반 ${num}번은 이 기기에 <b>${esc(old.name)}</b> 이름으로 저장되어 있어요. 번호를 잘못 쓰지 않았는지 확인해 주세요.<div class="tcbtns"><button class="btn small ghost" id="tcNo">번호 다시 쓰기</button><button class="btn small primary" id="tcYes">${esc(name)}${ro(name)} 이어서 하기</button></div></div>`);
      $('#tcNo').addEventListener('click', () => { setErr(''); $('#inNum').focus(); $('#inNum').select(); });
      $('#tcYes').addEventListener('click', () => { old.name = name; keepLook(old); begin(old); toast(`${esc(name)}의 기록을 이어서 해요!`, 'good'); });
      return false;
    }
    if (old) { keepLook(old); begin(old); toast(`${esc(name)}의 기록을 이어서 해요!`, 'good'); return true; }
    begin(newState(name, cls, num, draftLook));
    return true;
  }
  $('#startBtn').addEventListener('click', startGame);
  ['#inCls', '#inNum', '#inName'].forEach((x) => $(x).addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); startGame(); } }));
  ['#inCls', '#inNum'].forEach((x) => $(x).addEventListener('input', (e) => { const v = e.target.value.replace(/[^0-9]/g, '').slice(0, 2); if (v !== e.target.value) e.target.value = v; }));
  function begin(sv) {
    st = Object.assign(newState(sv.name, sv.cls, sv.num, sv.look || randomLook()), sv);
    if (!sv.created) st.created = 1;
    if (st.graduated && !st.gradCount) st.gradCount = 1; // 예전에 졸업한 학생은 1회부터
    st.key = playerKey(st.cls, st.num);
    st.stats = Object.assign({ a: 0, c: 0, pools: {} }, st.stats || {}); st.stats.pools = st.stats.pools || {};
    if (st.earned == null) st.earned = st.coins || 0;
    if (st.pet && !PMAP[st.pet]) st.pet = null;
    if (st.pos && !blockedAt(st.pos.x, st.pos.y)) { player.x = st.pos.x; player.y = st.pos.y; } else { player.x = 35.5 * TS; player.y = 31.7 * TS; }
    player.path = null; player.dir = 'down'; player.idle = 0; autoTrack = null;
    resetPet();
    mode = 'play';
    $('#title').hidden = true;
    ['#hud', '#toolbar', '#minimap'].forEach((x) => { $(x).hidden = false; });
    if (ui.touch) $('#joy').hidden = false;
    if (!mmBase) mmBase = buildMiniBase(mm.width / W);
    cam.x = player.x - vw / cam.z / 2; cam.y = player.y - vh / cam.z / 2;
    loadGlyphs(st.name + Object.values(st.petNames || {}).join(''));
    save(); refreshHud();
    API.send('login');
    Poll.start();
    if (!LS_OK) setTimeout(() => toast('이 화면에서는 진행 상황이 저장되지 않아요. 창을 닫으면 처음부터 시작해요.'), 900);
    if (!st.met) setTimeout(() => { if (mode === 'play' && !busy()) talkPrincipal(); }, 400);
  }

  /* ===================== 시작 ===================== */
  let last = 0, mmTick = 0, frameErrs = 0;
  function frame(ms) {
    requestAnimationFrame(frame); // 다음 화면을 먼저 예약 → 이번 화면에서 오류가 나도 게임이 멈추지 않음
    const t = ms / 1000, dt = Math.min(0.05, last ? t - last : 0.016); last = t;
    try {
      update(dt, t); render(t);
      if (mode === 'play' && mmBase && ++mmTick % 6 === 0) drawMini(mmg, mmBase, mm.width / W, t, false);
      if (Upd.pending && mmTick % 20 === 0) Upd.tick();
      if (mode !== 'play') mmTick++;
    } catch (err) {
      if (frameErrs++ < 5) console.error('[지식의 섬] 화면 그리기 중 오류(게임은 계속돼요)', err);
      player.path = null; player.onArrive = null; // 이동 상태를 정리해서 같은 오류가 되풀이되지 않게
      try { if (typeof ctx.reset === 'function') ctx.reset(); else cv.width = cv.width; } catch (e2) { /* 무시 */ } // 그리다 만 캔버스 상태(잘라내기 등) 초기화
    }
  }
  // 캔버스 글자는 글꼴 조각이 받아진 뒤에 그려야 깨지지 않는다
  function canvasText() {
    const parts = ['지식의 섬 수학 왕국 ○○ 기업 은행 공장 화산 졸업의 문 명예의 전당 꾸미기 상점 지식 0123456789 +-−×!✓·,.()~?'];
    for (const q of QUESTS) parts.push(q.bld.label || '', q.npc.name);
    parts.push(PRINCIPAL.name, SHOPKEEPER.name);
    for (const z of ZONES) parts.push(z.name);
    for (const x of PETS) parts.push(x.name);
    return Array.from(new Set(parts.join(''))).join('');
  }
  function loadGlyphs(text) {
    try { if (!text || !document.fonts || !document.fonts.load) return Promise.resolve(); return document.fonts.load('16px Jua', text).catch(() => {}); } catch (e) { return Promise.resolve(); }
  }
  try { if (document.fonts && document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', () => { for (const k in SPR) delete SPR[k]; }); } catch (e) { /* 무시 */ }
  let booted = false;
  function boot(data) {
    if (booted) return; booted = true;
    resize(); buildWorld();
    const go = () => {
      toTitle();
      const sv = data && data.st && data.st.v === 2 && data.st.name && data.st.cls && data.st.num ? data.st : null;
      let resume = null, tv = null;
      try {
        resume = sessionStorage.getItem(KEY + ':resume'); sessionStorage.removeItem(KEY + ':resume');
        tv = JSON.parse(sessionStorage.getItem(KEY + ':tpin') || 'null'); sessionStorage.removeItem(KEY + ':tpin');
      } catch (e) { /* 무시 */ }
      if (sv) begin(sv);
      else if (resume && LS.get(KEY + ':p:' + resume)) { begin(LS.get(KEY + ':p:' + resume)); setTimeout(() => toast('새 버전으로 바뀌었어요!', 'good'), 700); }
      else if (tv && tv.pin && API.on()) {
        Object.assign(T, { tab: tv.tab === 'status' ? 'status' : 'notice', cls: +tv.cls || 0, target: tv.target || 'all', minutes: tv.minutes || 60 });
        enterTeacher(tv.pin, null, true); setTimeout(() => toast('새 버전으로 바뀌었어요!', 'good'), 700);
      }
      Upd.init();
      requestAnimationFrame(frame);
    };
    const fontsReady = Promise.race([Promise.all([document.fonts && document.fonts.ready ? document.fonts.ready : null, loadGlyphs(canvasText())]), new Promise((r) => setTimeout(r, 2500))]);
    fontsReady.then(() => { for (const k in SPR) delete SPR[k]; go(); });
  }
  // 화면이 새 버전으로 바뀌어도 진행 상황을 이어 가기
  const hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) { try { hot.snapshot(() => { if (st && mode === 'play') { try { save(); } catch (e) { /* 무시 */ } } return { st: st && mode === 'play' ? st : null }; }); } catch (e) { /* 무시 */ } }
  if (hot && hot.ready) { try { hot.ready(boot); } catch (e) { boot({}); } setTimeout(() => boot({}), 3000); }
  else boot((hot && hot.data) || {});
  // 시험용 창구: 주소 끝에 ?debug=1 을 붙였을 때만 열려요
  let dbg = false; try { dbg = /[?&]debug=1\b/.test(location.search); } catch (e) { /* 무시 */ }
  if (dbg) window.__game = { todayOf, dayKST, drawChar, portrait, SKIN, HAIR, SHIRT, PANTS, Upd, Poll, T, API, enterTeacher, openTeacherLogin, openTeacher, accountReset, showNotices, render, update, drawGround, pet, PETS, scoreOf, buildRanks, localRanks, renamePet, startGame, canvasText, st: () => st, player, QUESTS, POOLS, interact, things, walkTo, openQuests, openWrong, openMap, openRank, openSettings, openShop, startQuest, Quiz, cam, toTitle, begin, solid, gi, W, H, TS, objs };
})();
</script>
