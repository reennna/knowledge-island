<script>window.QB_KOR={"meta":{"subject":"국어","version":1},"pools":{"kor1":{"title":"1단원 깊이 있게 감상해요","questions":[{"id":"kor1-01","type":"mc","q":"작품에 담긴 '작가의 의도'를 바르게 설명한 것은 무엇인가요?","choices":["작가가 글을 쓴 까닭, 읽는 사람이 느끼거나 생각하기를 바라는 것을 작품에 담은 것","작품에 나오는 인물들이 서로 주고받은 대화를 모아 놓은 것","작품의 줄거리를 짧게 간추려 정리한 것","작품을 읽은 독자가 자신의 느낌을 쓴 감상문"],"answer":0,"exp":"작가가 이 글을 쓴 까닭, 읽는 사람이 무엇을 느끼거나 생각하기를 바라는지 등을 작품에 담은 것을 작가의 의도라고 해요. 작가의 의도를 짐작하며 읽으면 작품을 깊이 있게 감상할 수 있어요.","ref":"국어 (가) 37쪽"},{"id":"kor1-02","type":"mc","q":"작가의 의도를 짐작하는 방법으로 알맞지 않은 것은 무엇인가요?","choices":["작품에 쓰인 글자 수를 모두 세어 본다.","작품에서 반복하거나 강조한 표현을 찾아본다.","작가의 생애(삶)를 알아본다.","작품이 쓰인 시대적 배경을 알아본다."],"answer":0,"exp":"작품에서 반복·강조한 표현을 찾거나, 작가의 생애와 시대적 배경을 알아보면 작가의 의도를 짐작할 수 있어요. 짐작한 의도를 자신의 삶과 관련지어 보면 더 깊이 감상할 수 있어요.","ref":"국어 (가) 40~45쪽"},{"id":"kor1-03","type":"mc","q":"이준관의 「별 하나」에서 말하는 이는 깊은 밤 혼자 바라본 별을 무엇에 빗대어 표현했나요?","choices":["하늘 아이들이 사는 집의 작은 초인종","어두운 바다를 비추는 등대","엄마의 반짝이는 눈동자","밤하늘에 핀 작은 꽃"],"answer":0,"exp":"말하는 이는 별을 하늘 아이들이 사는 집의 작은 초인종에 빗대고, 그 초인종을 가만히 누르고 싶다고 했어요. 홀로 있는 외로움이나 누군가와 함께하고 싶은 마음을 짐작할 수 있어요.","ref":"국어 (가) 35~37쪽"},{"id":"kor1-04","type":"input","q":"고려 말부터 발달해 온 우리 고유의 시로, 주로 정해진 글자 수에 맞추어 세 줄로 지은 시를 무엇이라고 하나요?","hint":"초성: ㅅㅈ","answer":["시조"],"exp":"시조는 고려 말부터 발달해 온 우리 고유의 시로, 주로 정해진 글자 수에 맞추어 세 줄로 지어요. 「하여가」와 「단심가」도 시조예요.","ref":"국어 (가) 39쪽"},{"id":"kor1-05","type":"mc","ctx":"이 몸이 죽고 죽어 일백 번 고쳐 죽어\n백골이 진토 되어 넋이라도 있고 없고\n임 향한 일편단심이야 가실 줄이 있으랴","q":"이 시조를 지은 사람과 시조에 담긴 마음을 바르게 짝지은 것은 무엇인가요?","choices":["정몽주 – 고려에 대한 변함없는 충성","이방원 – 고려에 대한 변함없는 충성","정몽주 – 상대를 자기편으로 끌어들이려는 마음","이방원 – 백 년 동안 함께 누리자는 설득"],"answer":0,"exp":"「단심가」는 정몽주가 지은 시조로, 몸이 백 번 죽어도 임(고려)을 향한 일편단심은 변하지 않는다며 고려에 대한 충성을 나타냈어요.","ref":"국어 (가) 38~39쪽"},{"id":"kor1-06","type":"mc","ctx":"이런들 어떠하며 저런들 어떠하리\n만수산 드렁칡이 얽혀진들 어떠하리\n우리도 이같이 얽혀져 백 년까지 누리리라","q":"이방원이 이 시조를 읊으며 정몽주에게 바란 것으로 알맞은 것은 무엇인가요?","choices":["칡덩굴처럼 서로 얽혀 자기편이 되어 함께 지내는 것","끝까지 고려를 지키며 충성하는 것","벼슬을 버리고 만수산에 들어가 사는 것","칡덩굴을 모두 걷어 내고 산을 가꾸는 것"],"answer":0,"exp":"이방원은 「하여가」로 이렇든 저렇든 어떠하냐, 칡덩굴처럼 얽혀 함께 누리자며 정몽주를 자기편으로 끌어들이려(설득하려) 했다고 전해져요.","ref":"국어 (가) 38쪽, 41쪽"},{"id":"kor1-07","type":"ox","q":"고려 말에 정몽주는 고려를 무너뜨리고 새로운 왕조를 세워야 한다고 생각했다.","answer":false,"exp":"정몽주는 고려를 유지하면서 개혁해야 한다고 생각했어요. 고려를 무너뜨리고 새로운 왕조를 세우고자 한 사람은 이성계예요. 이성계의 아들 이방원은 훗날 조선의 왕(태종)이 되었어요.","ref":"국어 (가) 38쪽, 40쪽"},{"id":"kor1-08","type":"mc","q":"「하여가」에 나오는 낱말 '드렁칡'의 뜻으로 알맞은 것은 무엇인가요?","choices":["언덕진 곳에 얽혀 있는 칡덩굴","티끌과 흙을 통틀어 이르는 말","개성 북쪽에 있는 산","늦가을에 처음 내리는 묽은 서리"],"answer":0,"exp":"'드렁칡'은 언덕진 곳에 얽혀 있는 칡덩굴이에요. '진토'는 티끌과 흙을 통틀어 이르는 말, '만수산'은 개성 북쪽에 있는 산(송악산의 다른 이름)이에요.","ref":"국어 (가) 38~39쪽"},{"id":"kor1-09","type":"mc","q":"윤동주의 「길」에 나오는 '돌', '담', '쇠문', '그림자' 같은 표현에서 느껴지는 분위기로 알맞은 것은 무엇인가요?","choices":["가로막힌 듯 답답하고 어두운 현실","친구들과 함께하는 즐거운 소풍","봄날의 밝고 따뜻한 풍경","모험을 떠나는 신나는 설렘"],"answer":0,"exp":"담과 쇠문으로 가로막힌 길, 길 위에 드리운 긴 그림자에서 답답하고 어둡고 우울한 느낌이 들어요. 일제 강점기의 암울한 현실과 관련지어 짐작할 수 있어요.","ref":"국어 (가) 44~46쪽"},{"id":"kor1-10","type":"ox","q":"윤동주는 일제 강점기에 활동한 시인이자 독립운동가로, 대표적인 시로 「서시」, 「별 헤는 밤」, 「반딧불」이 있다.","answer":true,"exp":"윤동주(1917~1945)는 일제 강점기(1910~1945)에 활동한 시인이자 독립운동가예요. 그의 시에서는 지식인으로서의 부끄러움과 슬픔, 독립 의지를 느낄 수 있어요.","ref":"국어 (가) 45쪽"},{"id":"kor1-11","type":"input","q":"이야기 구조에서 긴장감이 높아지거나 갈등이 두드러지는 부분을 무엇이라고 하나요?","hint":"초성: ㅈㅈ","answer":["절정"],"exp":"이야기 구조는 발단(이야기가 시작) → 전개(사건이 본격적으로 발생) → 절정(긴장감이 높아지거나 갈등이 두드러짐) → 결말(이야기가 마무리) 순서로 이루어져요.","ref":"국어 (가) 57쪽"},{"id":"kor1-12","type":"mc","q":"「원숭이 꽃신」에서 오소리가 처음에 원숭이에게 꽃신을 공짜로 선물한 진짜 목적은 무엇인가요?","choices":["원숭이의 먹이를 빼앗으려고","원숭이와 진심으로 사이좋게 지내려고","원숭이에게 신 삼는 법을 가르쳐 주려고","남은 꽃신을 버리기 아까워서"],"answer":0,"exp":"오소리는 먹을 것이 많은 원숭잇골의 먹이를 빼앗을 생각으로, 꽃신을 공짜로 주어 원숭이가 꽃신에 길들게 만들었어요.","ref":"국어 (가) 48~49쪽"},{"id":"kor1-13","type":"ox","q":"「원숭이 꽃신」에서 원숭이가 꽃신 없이 걸을 수 없게 된 것은, 꽃신을 신는 동안 발바닥의 굳은살이 다 없어졌기 때문이다.","answer":true,"exp":"꽃신을 오래 신은 원숭이는 발바닥의 굳은살이 없어져 맨발로 개울을 건너뛰다 아파서 쓰러졌어요. 이때부터 오소리의 태도가 거만하게 바뀌고 꽃신값이 계속 올랐어요.","ref":"국어 (가) 51쪽"},{"id":"kor1-14","type":"mc","q":"「원숭이 꽃신」의 마지막 장면에서 원숭이가 속으로 '내 손으로'를 되풀이하며 다짐한 뜻으로 알맞은 것은 무엇인가요?","choices":["직접 꽃신을 만들어 오소리에게 기대지 않겠다.","오소리에게 받은 꽃신을 더 소중히 아끼겠다.","오소리의 굴을 더 깨끗하게 청소하겠다.","잣을 더 많이 따서 오소리에게 바치겠다."],"answer":0,"exp":"잣이 떨어져 오소리의 집을 청소하고 개울에서 업어 주게 된 원숭이는, 자기 손으로 꽃신을 만들어 오소리에게 의지하지 않겠다고 다짐했어요. 이 장면이 이야기의 결말이에요.","ref":"국어 (가) 54~56쪽, 58쪽"},{"id":"kor1-15","type":"mc","q":"「아빠의 희망 마라톤」에서 엄마와 필립이 아빠가 뉴욕 마라톤에 나가지 못할 것이라고 생각한 까닭은 무엇인가요?","choices":["아빠가 전쟁에서 두 다리를 잃은 장애인이어서","아빠가 마라톤 참가 신청서를 내지 않아서","아빠가 이미 나이가 너무 많아서","뉴욕 마라톤 대회가 취소되어서"],"answer":0,"exp":"아빠는 젊은 시절 베트남 전쟁에서 포탄을 맞아 두 다리를 잃은 1급 장애인이었기 때문에, 가족은 아빠의 말을 농담으로 여겼어요.","ref":"국어 (가) 60쪽"},{"id":"kor1-16","type":"ox","q":"「아빠의 희망 마라톤」에서 아빠는 집을 비운 4일 동안 마이클 아저씨와 호수로 낚시 여행을 다녀왔다.","answer":false,"exp":"아빠는 4일 동안 양팔의 힘으로 뉴욕 마라톤을 계속 달리고 있었어요. 기록은 4일 12시간 17분 18초였고, 아빠는 가족에게 한 약속을 지켰어요.","ref":"국어 (가) 62~64쪽"},{"id":"kor1-17","type":"mc","q":"「아빠의 희망 마라톤」에서 결승점에 들어온 아빠가 기자에게 한 말에 담긴 생각으로 알맞은 것은 무엇인가요?","choices":["어디서 출발했는지보다 어디서 끝마쳤는지가 더 중요하다.","빨리 달리는 것이 무엇보다 가장 중요하다.","혼자 달리는 것보다 함께 달리는 것이 중요하다.","기록을 세우지 못하면 달린 의미가 없다."],"answer":0,"exp":"아빠는 인생은 어디서 출발했느냐보다 어디서 끝마쳤느냐가 더 중요하다고 말했어요. 끝까지 포기하지 않는 마음이 이 이야기의 주제와 이어져요.","ref":"국어 (가) 64쪽, 69쪽"},{"id":"kor1-18","type":"mc","q":"「아빠의 희망 마라톤」에 나온 낱말과 그 뜻을 바르게 짝지은 것은 무엇인가요?","choices":["맞장구 – 남의 말에 덩달아 호응하거나 동의하는 일","중계 – 한 선수가 한 경기에 세 골 이상을 넣는 일","상급생 – 방송국 밖의 실제 상황을 연결하여 방송하는 일","해트 트릭 – 보다 높은 학년에 있는 학생"],"answer":0,"exp":"'중계'는 경기장 등 방송국 밖의 실제 상황을 방송국이 중간에서 연결하여 방송하는 일, '상급생'은 보다 높은 학년에 있는 학생, '해트 트릭'은 한 선수가 한 경기에 세 골 이상을 넣는 일이에요.","ref":"국어 (가) 60쪽, 65쪽"},{"id":"kor1-19","type":"mc","ctx":"어제 나는 도서관에서 동화책을 읽었다.","q":"이 문장에서 지나간 과거를 나타내는 시간 표현을 바르게 찾은 것은 무엇인가요?","choices":["'어제'와 '-었-'","'나는'과 '도서관에서'","'동화책을'과 '-다'","'도서관'과 '읽-'"],"answer":0,"exp":"'어제'처럼 때를 나타내는 말과 '읽었다'의 '-었-'은 과거를 나타내요. 교과서의 '2년 전', '다녀온 적이 있었다'도 과거를, '오늘'은 일이 일어나고 있는 현재를 나타내는 표현이에요.","ref":"국어 (가) 68쪽"},{"id":"kor1-20","type":"ox","q":"이야기의 줄거리를 간추릴 때에는 이야기에서 중요한 사건을 파악한 뒤, 이야기 구조에 따라 사건의 흐름을 간단히 정리한다.","answer":true,"exp":"중요한 사건을 파악하고 발단·전개·절정·결말의 이야기 구조에 따라 사건의 흐름을 간단히 정리하면 줄거리를 간추릴 수 있어요. 그러면 이야기의 흐름을 한눈에 파악할 수 있어요.","ref":"국어 (가) 58~59쪽, 73쪽"},{"id":"kor1-21","type":"mc","q":"장석주의 「대추 한 알」에서 대추를 붉게 익히고 둥글게 만든 것으로 표현되지 않은 것은 무엇인가요?","choices":["함박눈","태풍","천둥","무서리"],"answer":0,"exp":"시에서는 태풍, 천둥, 벼락, 번개, 무서리 내리는 밤, 땡볕, 초승달이 대추 안에 들어 있다고 표현했어요. 대추 한 알이 익기까지 수많은 시련과 시간을 견뎠다는 뜻을 짐작할 수 있어요. '무서리'는 늦가을에 처음 내리는 묽은 서리예요.","ref":"국어 (가) 72~73쪽"},{"id":"kor1-22","type":"mc","q":"낱말과 그 뜻을 바르게 짝지은 것은 무엇인가요?","choices":["돌 – 어린아이가 태어난 날로부터 한 해가 되는 날","경로 – 높고 험한 산의 꼭대기","인정 – 여러 가지 상 가운데 가장 큰 상","대상 – 남을 동정하는 따뜻한 마음"],"answer":0,"exp":"'돌'은 흙 따위가 굳어서 된 단단한 덩어리라는 뜻과 아이가 태어난 지 한 해가 되는 날이라는 뜻이 있어요. '경로'는 지나는 길·노인을 공경함, '인정'은 남을 동정하는 따뜻한 마음·확실히 그렇다고 여김, '대상'은 어떤 일의 상대나 목표·가장 큰 상이라는 뜻이에요.","ref":"국어 (가) 75쪽"}]},"kor2":{"title":"2단원 궁금한 점을 해결해요","questions":[{"id":"kor2-01","type":"input","q":"면담자가 특정 인물이나 주제의 정보를 수집하려고 면담 대상자와 주고받는 대화를 무엇이라고 하나요?","hint":"초성: ㅁㄷ","answer":["면담"],"exp":"면담은 특정 인물이나 주제의 정보를 수집하려고 면담 대상자와 주고받는 대화예요. 면담을 하면 대상자에게서 생생한 정보를 얻을 수 있어요.","ref":"국어 (가) 79쪽, 81쪽"},{"id":"kor2-02","type":"mc","q":"면담의 특성으로 알맞지 않은 것은 무엇인가요?","choices":["면담 대상자 없이 혼자 책을 읽으며 정보를 얻는다.","대화를 주고받는 과정에서 정보를 얻는다.","대상자를 정하고 질문을 만드는 사전 준비가 필요하다.","면담할 때에는 예의를 지키는 것이 중요하다."],"answer":0,"exp":"면담은 대화를 주고받으며 정보를 얻고, 대상자를 정하고 정보를 수집하고 질문을 만드는 사전 준비가 필요하며, 예의를 지키는 것이 중요해요.","ref":"국어 (가) 81쪽"},{"id":"kor2-03","type":"ox","q":"면담은 현장에 직접 방문하거나 전화하기, 전자 우편 보내기, 누리집에 문의하는 글 올리기 등 다양한 방법으로 요청할 수 있다.","answer":true,"exp":"면담 요청은 직접 방문, 전화, 전자 우편, 누리집 문의 글처럼 다양한 방법으로 할 수 있어요. 요청할 때에는 면담 목적을 설명하고 허락을 구해요.","ref":"국어 (가) 80쪽, 83쪽"},{"id":"kor2-04","type":"mc","q":"다음 중 '비대면 면담'에 해당하는 것은 무엇인가요?","choices":["온라인 화상 회의로 로봇 공학자와 면담하기","도서관에 찾아가 사서 선생님을 만나 면담하기","상담실에서 상담 선생님과 마주 앉아 면담하기","소방서에 방문해 소방관을 직접 만나 면담하기"],"answer":0,"exp":"대면 면담은 대상자를 직접 만나 얼굴을 마주 보고 하는 면담이고, 비대면 면담은 온라인 화상 회의, 전자 우편, 영상 통화처럼 직접 만나지 않고 하는 면담이에요.","ref":"국어 (가) 83쪽, 94쪽"},{"id":"kor2-05","type":"mc","q":"면담 준비하기 과정에서 '면담 목적 정하기' 바로 다음에 할 일로 알맞은 것은 무엇인가요?","choices":["면담 대상자 정하기","면담 보고서 쓰기","면담 결과 확인하기","녹음·녹화 동의 구하기"],"answer":0,"exp":"면담 준비는 모둠 구성 → 목적 정하기 → 대상자 정하기 → 방식 정하기 → 자료 찾기 → 질문 만들기 → 역할 정하기 → 요청하고 허락 구하기 순서로 해요. 목적이 분명해야 대상자를 정할 수 있어요.","ref":"국어 (가) 81~83쪽"},{"id":"kor2-06","type":"mc","q":"면담 진행하기의 '면담 열기' 단계에서 하는 일이 아닌 것은 무엇인가요?","choices":["면담 보고서 쓰기","인사하기","면담 목적 설명하기","녹음·녹화 동의 구하기"],"answer":0,"exp":"면담 열기에서는 인사하고, 면담 목적을 설명하고, 녹음·녹화 동의를 구해요. 면담 보고서 쓰기는 면담 정리하기 단계에서 해요.","ref":"국어 (가) 87쪽, 100쪽"},{"id":"kor2-07","type":"mc","q":"'면담 마무리하기' 단계에서 해야 할 일로 알맞은 것은 무엇인가요?","choices":["면담 결과를 확인하고 감사 인사를 한다.","면담 대상자와 면담 방식을 정한다.","면담 모둠을 구성하고 역할을 나눈다.","면담에 필요한 자료를 인터넷에서 찾는다."],"answer":0,"exp":"면담 마무리하기에서는 면담으로 알게 된 내용(면담 결과)을 확인하고 감사 인사를 드려요.","ref":"국어 (가) 86~87쪽, 100쪽"},{"id":"kor2-08","type":"ox","q":"면담 정리하기 단계에서는 면담 대상자에게 면담을 요청하고 허락을 구한다.","answer":false,"exp":"면담을 요청하고 허락을 구하는 것은 면담 준비하기 단계예요. 면담 정리하기에서는 면담 내용 정리하기, 면담 과정 성찰하기, 면담 보고서 쓰기를 해요.","ref":"국어 (가) 87쪽"},{"id":"kor2-09","type":"mc","ctx":"면담 목적: 도서관 사서라는 직업을 알리는 글을 쓰려고\n면담 대상자: 공공 도서관 사서","q":"이 면담의 목적에 맞지 않는 질문은 무엇인가요?","choices":["좋아하는 색깔은 무엇인가요?","현재 맡고 계신 일을 자세히 설명해 주실 수 있나요?","사서가 되려면 어떤 과정을 거쳐야 하나요?","사서가 되고 싶은 학생들에게 해 주고 싶은 말씀은 무엇인가요?"],"answer":0,"exp":"좋아하는 색깔은 사서라는 직업을 알리려는 면담 목적과 관계가 없어요. 면담 질문에 따라 대화의 방향과 수집하는 정보가 달라지므로 목적에 맞는 질문을 해야 해요.","ref":"국어 (가) 84~85쪽"},{"id":"kor2-10","type":"mc","ctx":"근무하시면서 가장 보람을 느꼈던 순간은 언제이고, 그 까닭은 무엇인가요?","q":"이 질문은 어떤 종류의 질문에 해당하나요?","choices":["생각이나 느낌에 대한 질문","구체적인 사실에 대한 질문","앞으로의 계획이나 당부에 대한 질문","면담 목적에서 벗어난 질문"],"answer":0,"exp":"보람을 느꼈던 순간을 묻는 것은 대상자의 생각이나 느낌을 묻는 질문이에요. 하는 일·되는 과정은 구체적인 사실, 앞으로의 목표·학생들에게 하고 싶은 말은 계획이나 당부에 대한 질문이에요.","ref":"국어 (가) 84~85쪽, 100쪽"},{"id":"kor2-11","type":"ox","q":"'상담 교사로서 앞으로 꼭 하고 싶은 일은 무엇인가요?'는 앞으로의 계획이나 당부에 대한 질문이다.","answer":true,"exp":"앞으로 하고 싶은 일이나 목표를 묻는 질문은 앞으로의 계획이나 당부에 대한 질문이에요.","ref":"국어 (가) 100쪽"},{"id":"kor2-12","type":"input","q":"면담 대상자의 대답을 듣고 더 자세히 알려고 이어서 하는 질문을 무엇이라고 하나요?","hint":"초성: ㅎㅅ ㅈㅁ","answer":["후속 질문"],"exp":"대답을 듣고 궁금한 점을 이어서 묻는 질문을 후속 질문이라고 해요. 로봇을 여러 번 시험한다는 답을 듣고 그 까닭을 다시 물어본 것이 후속 질문의 예예요.","ref":"국어 (가) 89쪽, 91쪽"},{"id":"kor2-13","type":"mc","q":"「로봇 공학자와의 면담」에서 로봇 공학자가 로봇을 만들 때 가장 먼저 해야 한다고 말한 일은 무엇인가요?","choices":["로봇이 어떤 문제를 해결해야 하는지 결정하기","필요한 부품을 가장 싼 값에 사 오기","로봇의 색깔과 이름부터 정하기","로봇을 움직일 프로그램부터 만들기"],"answer":0,"exp":"로봇 공학자는 먼저 로봇이 어떤 문제를 해결해야 하는지 결정하고, 그다음 형태와 기능을 설계하고 부품을 고른 뒤 프로그램을 만들어 여러 번 시험한다고 했어요.","ref":"국어 (가) 89쪽"},{"id":"kor2-14","type":"mc","q":"면담할 때 예의를 지키는 태도로 알맞지 않은 것은 무엇인가요?","choices":["대상자가 말하는 도중에 궁금한 점이 생기면 바로 끼어들어 묻는다.","면담에 응해 주셔서 감사하다고 표현한다.","면담 목적과 관련 있는 질문을 한다.","대상자가 곤란해할 만한 질문이나 개인 정보에 대한 질문은 하지 않는다."],"answer":0,"exp":"면담 대상자가 말하는 도중에 끼어들어 말하지 않아야 해요. 감사 표현하기, 목적에 맞는 질문하기, 곤란하거나 개인 정보에 관한 질문 피하기가 면담 예절이에요.","ref":"국어 (가) 91쪽, 98쪽, 111쪽"},{"id":"kor2-15","type":"ox","q":"면담 대상자의 동의를 얻어 녹음·녹화한 자료라면 인터넷에 올려 많은 사람과 함께 보아도 된다.","answer":false,"exp":"동의를 얻어 녹음·녹화한 자료라도 인터넷에 올리거나 다른 사람에게 퍼뜨리면 안 되고, 면담 보고서를 쓸 때에만 활용해야 해요.","ref":"국어 (가) 95쪽"},{"id":"kor2-16","type":"mc","q":"면담에서 매체를 활용할 때 주의할 점으로 알맞은 것은 무엇인가요?","choices":["녹음·녹화를 하기 전에 먼저 면담 대상자의 동의를 얻는다.","대상자가 모르게 녹화해야 자연스러운 대답을 얻을 수 있다.","인터넷에서 찾은 자료는 출처를 확인하지 않고 그대로 쓴다.","면담 목적과 관계없는 자료도 많이 모을수록 좋다."],"answer":0,"exp":"여러 매체로 면담 내용을 녹음·녹화할 때에는 먼저 대상자의 동의를 얻어야 해요. 인터넷이나 책에서 찾은 자료는 믿을 만한지, 면담 목적에 알맞은지 확인해야 해요.","ref":"국어 (가) 95쪽, 98쪽"},{"id":"kor2-17","type":"mc","q":"면담 내용을 정리하는 방법으로 알맞은 것은 무엇인가요?","choices":["불필요한 내용은 삭제하고 중요한 내용만 짧게 간추린다.","면담에서 들은 말을 하나도 빠짐없이 그대로 옮겨 적는다.","대상자의 답변보다 내 생각을 훨씬 길게 쓴다.","질문은 모두 빼고 재미있었던 부분만 적는다."],"answer":0,"exp":"면담 내용은 짧게 간추리고, 불필요한 내용은 삭제해 중요한 내용만 남기며, 중요한 내용을 이해할 수 있게 정리해요.","ref":"국어 (가) 101쪽"},{"id":"kor2-18","type":"mc","q":"면담 보고서의 뒷부분에 들어갈 내용으로 알맞은 것은 무엇인가요?","choices":["면담을 마친 뒤 깨달은 점과 달라진 생각","면담을 시작하며 세웠던 계획과 준비 상황","면담 대상자가 알려 준 새로운 사실","면담 대상자의 집 주소와 전화번호"],"answer":0,"exp":"면담 보고서의 앞부분에는 계획과 준비 상황, 가운데 부분에는 면담 대상자가 알려 준 내용(새롭게 안 점), 뒷부분에는 깨달은 점과 달라진 생각을 정리해요.","ref":"국어 (가) 104~105쪽"},{"id":"kor2-19","type":"mc","q":"면담 보고서 「상담 교사, 마음의 길을 밝히는 사람들」에 나온 '내담자'의 뜻으로 알맞은 것은 무엇인가요?","choices":["상담실에 찾아와서 이야기하는 사람","면담을 진행하며 질문하는 사람","상담실을 관리하는 선생님","면담 내용을 녹화하는 사람"],"answer":0,"exp":"'내담자'는 상담실에 찾아와서 이야기하는 사람이에요. 상담 교사는 내담자의 고민을 경청하고 해결 방법을 함께 찾도록 노력하는 자세가 필요하다고 했어요.","ref":"국어 (가) 104쪽"},{"id":"kor2-20","type":"mc","q":"모둠 면담에서 '면담 대상자에게 예의를 갖추어 면담 약속(날짜, 시간, 장소)을 잡고 모둠원에게 알리는' 일을 맡은 역할은 무엇인가요?","choices":["약속 담당","진행 담당","매체(녹음·녹화) 담당","정리 담당"],"answer":0,"exp":"약속 담당은 면담 약속을 잡아 모둠원에게 알리고, 진행 담당은 시간을 조정하며 면담을 이끌고, 매체 담당은 녹음·녹화를 하고, 정리 담당은 핵심 내용을 메모해 보고서 자료를 정리해요.","ref":"국어 (가) 99쪽, 104쪽"},{"id":"kor2-21","type":"mc","q":"낱말의 발음이 바른 것은 무엇인가요?","choices":["값이[갑씨]","닭이[다기]","흙이[흐기]","앉아서[안아서]"],"answer":0,"exp":"겹받침 뒤에 모음으로 시작하는 말이 오면 뒤의 받침이 다음 음절로 넘어가 소리 나요. 값이[갑씨], 닭이[달기], 흙이[흘기], 앉아서[안자서]로 발음해요.","ref":"국어 (가) 113쪽"},{"id":"kor2-22","type":"ox","q":"'삶이'는 [살ː미]로, '없어'는 [업ː써]로 발음한다.","answer":true,"exp":"겹받침 'ㄻ', 'ㅄ' 뒤에 모음이 오면 뒤의 자음이 다음 음절로 넘어가 삶이[살ː미], 없어[업ː써]로 발음해요.","ref":"국어 (가) 113쪽"}]},"kor3":{"title":"3단원 보거나 듣고 판단해요","questions":[{"id":"kor3-01","type":"mc","q":"주장하는 말에서 '근거'를 바르게 설명한 것은 무엇인가요?","choices":["이유를 뒷받침하는 자료나 사실","어떤 주제에 대한 자신의 의견을 드러내는 말","왜 그렇게 주장하는지를 설명하는 말","듣는 사람의 기분을 좋게 하려고 덧붙이는 말"],"answer":0,"exp":"주장은 어떤 주제에 대한 자신의 의견을 드러내는 말, 이유는 왜 그렇게 주장하는지 설명하는 말, 근거는 이유를 뒷받침하는 자료나 사실이에요.","ref":"국어 (가) 118쪽"},{"id":"kor3-02","type":"input","q":"어떤 주제에 대한 자신의 의견을 드러내는 말을 무엇이라고 하나요?","hint":"초성: ㅈㅈ","answer":["주장"],"exp":"자신의 의견을 드러내는 말은 주장이에요. 주장을 받아들이기 전에 이유와 근거가 타당한지 판단해야 해요.","ref":"국어 (가) 118쪽"},{"id":"kor3-03","type":"mc","q":"주장하는 말의 '타당성을 평가한다'는 것의 뜻으로 알맞은 것은 무엇인가요?","choices":["제시된 이유와 근거가 주장과 잘 맞고 설득력이 있는지 판단하는 것","말하는 사람의 목소리가 크고 분명한지 판단하는 것","주장하는 말이 얼마나 긴지 재어 보는 것","말하는 사람이 나와 친한 사람인지 생각해 보는 것"],"answer":0,"exp":"타당성을 평가한다는 것은 제시된 이유와 근거가 주장과 잘 맞고 설득력이 있는지 판단하는 것이에요.","ref":"국어 (가) 120쪽"},{"id":"kor3-04","type":"mc","q":"주장하는 말의 내용이 타당한지 평가할 때 필요한 기준이 아닌 것은 무엇인가요?","choices":["주장의 길이가 적당한가?","주장은 가치 있고 중요한가?","이유는 주장을 적절하게 뒷받침하는가?","근거는 이유를 적절하게 뒷받침하는가?"],"answer":0,"exp":"타당성은 주장이 가치 있고 중요한지, 이유가 주장을, 근거가 이유를 적절하게 뒷받침하는지로 평가해요. 주장의 길이, 듣는 사람의 기분, 근거 종류의 수는 기준이 아니에요.","ref":"국어 (가) 121쪽, 144쪽"},{"id":"kor3-05","type":"ox","q":"'듣는 사람을 기분 좋게 만드는 이유인가?'는 이유의 타당성을 판단하는 기준이다.","answer":false,"exp":"이유는 주장과 관련 있는지, 많은 사람이 받아들일 만한 타당한 이유인지를 기준으로 판단해요.","ref":"국어 (가) 121쪽, 144쪽"},{"id":"kor3-06","type":"mc","q":"근거가 이유를 적절하게 뒷받침하는지 판단하는 기준으로 알맞은 것은 무엇인가요?","choices":["근거로 객관적인 사실이나 정보를 활용하고 있는가?","근거가 말하는 사람의 개인적인 바람인가?","근거가 듣는 사람에게 재미있는 이야기인가?","근거가 주장보다 길게 쓰여 있는가?"],"answer":0,"exp":"근거는 이유와 관련 있는지, 객관적인 사실이나 정보를 활용하고 있는지를 살펴 판단해요.","ref":"국어 (가) 121쪽"},{"id":"kor3-07","type":"ox","q":"주장이 가치 있고 중요한지 판단할 때에는 문제를 해결하거나 생활하는 데 도움이 되는지, 실천 가능한지를 살펴본다.","answer":true,"exp":"주장이 문제 해결이나 생활에 도움이 되는지, 실천할 수 있는지를 살펴 주장이 가치 있고 중요한지 판단해요.","ref":"국어 (가) 120쪽"},{"id":"kor3-08","type":"mc","q":"「실수에서 배워요」에서 알렉산더 플레밍이 실수를 계기로 발견한 것은 무엇인가요?","choices":["페니실린","전구","전화기","증기 기관"],"answer":0,"exp":"플레밍은 실수를 계기로 세균을 없애는 약인 페니실린을 발견했어요. 이 사례는 실수를 배움의 기회로 삼을 수 있다는 주장을 뒷받침하는 근거가 돼요.","ref":"국어 (가) 118~119쪽"},{"id":"kor3-09","type":"mc","q":"「용기초등학교 어린이 생각 발표회」에서 윤정이와 현우가 공통으로 바꾸고 싶어 한 것은 무엇인가요?","choices":["학교 급식","운동장 쓰레기통","도서관 이용 시간","교실 청소 방법"],"answer":0,"exp":"두 친구 모두 학교 급식 개선을 주장했어요. 윤정이는 채소 위주의 식사를 늘리자고, 현우는 질 좋은 고기반찬이 포함된 든든한 급식이 필요하다고 했어요.","ref":"국어 (가) 123쪽, 125쪽"},{"id":"kor3-10","type":"ox","q":"「용기초등학교 어린이 생각 발표회」에서 윤정이는 질 좋은 고기반찬이 포함된 든든한 급식이 필요하다고 주장했다.","answer":false,"exp":"윤정이는 고기보다 채소 위주의 식사를 조금 더 늘려 보자고 주장했어요. 질 좋은 고기반찬이 포함된 든든한 급식이 필요하다고 주장한 사람은 현우예요.","ref":"국어 (가) 123쪽"},{"id":"kor3-11","type":"mc","q":"'생물체가 양분 따위를 몸속에 빨아들이다'라는 뜻의 낱말은 무엇인가요?","choices":["섭취하다","제공하다","대항하다","가속하다"],"answer":0,"exp":"'섭취하다'는 양분을 몸속에 빨아들이다, '제공하다'는 무엇을 내주거나 갖다 바치다, '대항하다'는 지지 않으려고 맞서서 버티다, '가속하다'는 점점 속도를 더하다라는 뜻이에요.","ref":"국어 (가) 125쪽"},{"id":"kor3-12","type":"mc","q":"영상을 보고 영상의 주장을 파악하는 방법으로 알맞지 않은 것은 무엇인가요?","choices":["영상에 나오는 사람의 옷 색깔을 살펴본다.","영상의 제목을 살펴보고 그렇게 정한 까닭을 생각해 본다.","영상에서 제시한 자료의 내용을 파악한다.","영상에서 강조하는 장면이나 표현을 찾고 그 까닭을 생각해 본다."],"answer":0,"exp":"영상의 주장은 제목과 그렇게 정한 까닭, 제시한 자료의 내용, 강조하는 장면이나 표현(굵은 글자, 배경 음악, 자막 등)을 살펴보며 파악해요.","ref":"국어 (가) 129쪽, 133쪽"},{"id":"kor3-13","type":"mc","q":"「낭독의 재발견」에서 '입, 몸, 마음'이라는 낱말을 굵은 글자로 나타낸 까닭으로 알맞은 것은 무엇인가요?","choices":["낭독의 긍정적인 효과를 강조하려고","낭독이 건강에 해롭다는 것을 알리려고","영상의 길이를 길게 늘리려고","소리 내지 않고 읽는 것이 더 좋다는 것을 보여 주려고"],"answer":0,"exp":"영상은 '입, 몸, 마음'을 굵은 글자로 보여 주어 낭독의 긍정적인 효과를 강조했어요. 제목 '낭독의 재발견'은 오래된 방법이라고 생각했던 낭독의 효과를 다시 알려 주려는 뜻이에요.","ref":"국어 (가) 130쪽"},{"id":"kor3-14","type":"mc","q":"「나를 성장시키는 기록법」에서 열심히 받아 적었는데도 뒤돌아서면 기억하지 못한 까닭으로 알맞은 것은 무엇인가요?","choices":["내용을 이해하거나 생각하지 않고 있는 그대로 받아 적었기 때문","너무 천천히 받아 적었기 때문","받아 적은 공책을 잃어버렸기 때문","글씨를 너무 작게 썼기 때문"],"answer":0,"exp":"이해하지 않고, 생각하지 않고 오로지 적기만 했기 때문에 기억에 남지 않았다고 했어요. 내 생각을 반영한 기록이 쌓여야 나를 성장시킬 수 있어요.","ref":"국어 (가) 131~132쪽"},{"id":"kor3-15","type":"mc","q":"「나를 성장시키는 기록법」에서 '적자! 생존'이라는 표현을 강조한 까닭으로 알맞은 것은 무엇인가요?","choices":["'잘 적는 사람이 성장할 수 있다'는 뜻을 재미있게 전하려고","힘센 동물만 살아남는다는 것을 알리려고","글씨를 예쁘게 쓰는 방법을 알려 주려고","기록은 시간 낭비라는 것을 보여 주려고"],"answer":0,"exp":"'적자생존'이라는 사자성어의 원래 뜻 대신 '잘 적는 사람이 성장할 수 있다'는 뜻으로 표현해 기록의 중요성을 강조했어요.","ref":"국어 (가) 131쪽, 133쪽"},{"id":"kor3-16","type":"mc","q":"카드 뉴스 「무분별한 혐오·차별 표현은 이제 그만!」에서 설명한 '혐오·차별 표현'으로 알맞은 것은 무엇인가요?","choices":["성별·장애·종교·나이·출신 지역 등으로 편견을 조장하거나 멸시·모욕·폭력을 선동하는 행위","서로 다른 의견을 예의 바르게 주고받는 행위","다른 사람의 좋은 점을 찾아 칭찬하는 행위","자신의 잘못을 솔직하게 인정하는 행위"],"answer":0,"exp":"혐오·차별 표현은 성별, 장애, 종교, 나이, 출신 지역, 인종 같은 것으로 개인이나 집단에 대해 편견을 조장하거나 멸시, 모욕, 위협, 폭력을 선동하는 행위예요. 말, 글, 행동, 복장, 상징물로 나타나요.","ref":"국어 (가) 134쪽"},{"id":"kor3-17","type":"ox","q":"'살색'이라는 표현을 '살구색'으로 바꾸어 쓰는 까닭은, '살색'이 사람의 피부색은 모두 같다는 편견을 심어 줄 수 있기 때문이다.","answer":true,"exp":"'살색'은 그럴 의도가 없더라도 피부색이 모두 같다는 편견을 심어 피부색에 대한 차별이 생길 수 있어, 지금은 '살구색'으로 바꾸어 쓰고 있어요.","ref":"국어 (가) 135쪽"},{"id":"kor3-18","type":"mc","q":"카드 뉴스에서 혐오·차별 표현을 멈추어야 한다고 제시한 까닭이 아닌 것은 무엇인가요?","choices":["혐오·차별 표현을 쓰면 말을 더 짧게 할 수 있기 때문","특정 집단에 대한 부정적 인식을 강화할 수 있기 때문","인간의 존엄성을 침해하고 사회적 갈등을 초래하기 때문","많은 사람이 혐오·차별 표현을 겪고 있기 때문"],"answer":0,"exp":"카드 뉴스는 혐오·차별 표현이 부정적 인식을 강화하고, 인간의 존엄성을 침해하며 사회적 갈등을 초래하고, 많은 사람이 겪고 있기 때문에 멈추어야 한다고 했어요. 국가인권위원회 조사에서는 참여자의 70.3퍼센트가 경험했다고 답했어요.","ref":"국어 (가) 135~136쪽"},{"id":"kor3-19","type":"input","ctx":"도서관에서는 조용한 환경을 위해 큰 소리를 내는 것을 (    )한다.","q":"빈칸에 들어갈 알맞은 낱말을 쓰세요. (보기: 강화, 규제, 조장, 침해)","hint":"초성: ㄱㅈ","answer":["규제"],"exp":"'규제'는 규칙이나 규정에 의하여 일정한 한도를 정하거나 정한 한도를 넘지 못하게 막는 것이에요. '침해'는 침범하여 해를 끼침, '조장'은 바람직하지 않은 일을 더 심해지도록 부추김, '강화'는 더 강하고 튼튼하게 함이에요.","ref":"국어 (가) 137~138쪽"},{"id":"kor3-20","type":"mc","q":"「비규격 농산물을 소비하자」에서 주장을 뒷받침하는 이유로 타당하지 않은 것은 무엇인가요?","choices":["모양이 예쁜 농산물을 만들 수 있다.","농산물을 저렴하게 구입할 수 있다.","자연환경을 보호할 수 있다.","버려지는 농산물을 줄일 수 있다."],"answer":0,"exp":"비규격 농산물을 많이 소비한다고 모양이 예쁜 농산물이 만들어지는 것은 아니어서 주장과 맞지 않는 이유예요. 비규격 농산물은 맛과 영양은 차이가 없지만 크기가 작거나 상처가 나서 제값을 받지 못하는 농산물이에요.","ref":"국어 (가) 145쪽"},{"id":"kor3-21","type":"mc","q":"받침 'ㅎ'이 들어간 낱말의 발음이 바른 것은 무엇인가요?","choices":["동그랗게[동그라케]","놓다[녿따]","쌓다[싿따]","어떻게[어떧께]"],"answer":0,"exp":"받침 'ㅎ' 뒤에 'ㄱ, ㄷ, ㅈ'이 오면 합쳐서 [ㅋ, ㅌ, ㅊ]으로 발음해요. 놓다[노타], 쌓다[싸타], 어떻게[어떠케], 동그랗게[동그라케]예요.","ref":"국어 (가) 147쪽"},{"id":"kor3-22","type":"ox","q":"'놓는'은 [논는]으로, '쌓는'은 [싼는]으로 발음한다.","answer":true,"exp":"받침 'ㅎ' 뒤에 'ㄴ'이 오면 'ㅎ'은 [ㄴ]으로 발음해요. 그래서 놓는[논는], 쌓는[싼는]이 돼요.","ref":"국어 (가) 147쪽"}]},"kor4":{"title":"4단원 소중한 우리말","questions":[{"id":"kor4-01","type":"mc","q":"'고유어'에 대한 설명으로 알맞은 것은 무엇인가요?","choices":["우리말에 처음부터 있던 낱말이나 그것을 바탕으로 만들어진 낱말","한자로 이루어진 낱말","외국에서 들어와 우리 생활에서 널리 쓰이는 낱말","특정 지역에서만 주로 쓰는 낱말"],"answer":0,"exp":"고유어는 우리말에 처음부터 있던 낱말이나 그것을 바탕으로 만들어진 낱말이에요. 한자로 이루어진 낱말은 한자어, 외국에서 들어와 널리 쓰이는 낱말은 외래어예요.","ref":"국어 (나) 183~184쪽"},{"id":"kor4-02","type":"mc","q":"낱말과 그 종류를 바르게 짝지은 것은 무엇인가요?","choices":["미술 – 한자어","벤치 – 고유어","시나브로 – 외래어","군침 – 한자어"],"answer":0,"exp":"'미술'은 사전에 '美術'이라는 한자가 붙어 있는 한자어, '벤치'는 'bench'에서 온 외래어, '시나브로'와 '군침'은 한글 표기만 있는 고유어예요.","ref":"국어 (나) 183쪽"},{"id":"kor4-03","type":"mc","q":"다음 중 고유어는 무엇인가요?","choices":["줄넘기","수업","피자","친구"],"answer":0,"exp":"'줄넘기'는 고유어예요. '수업(授業)'과 '친구(親舊)'는 한자어, '피자'는 외래어예요.","ref":"국어 (나) 183쪽"},{"id":"kor4-04","type":"ox","q":"국어사전에서 낱말을 찾았을 때 한자나 외국어 없이 한글 표기만 있는 낱말은 고유어이다.","answer":true,"exp":"예를 들어 '하늘'을 국어사전에서 찾으면 한글 표기만 볼 수 있어요. 이렇게 한글 표기만 있는 낱말이 고유어예요.","ref":"국어 (나) 184쪽"},{"id":"kor4-05","type":"mc","q":"고유어와 그 뜻을 바르게 짝지은 것은 무엇인가요?","choices":["시나브로 – 모르는 사이에 조금씩 조금씩","뒤쓰레질 – 음식이 먹고 싶어서 입안에 도는 침","군침 – 어떤 일을 마친 뒤에 그 자리의 쓰레기를 쓸어 내는 일","새우잠 – 비가 올 때 비에 맞으면 안 되는 물건을 치우는 일"],"answer":0,"exp":"'뒤쓰레질'은 어떤 일을 마친 뒤에 그 자리의 쓰레기를 쓸어 내는 일, '군침'은 음식이 먹고 싶어서 입안에 도는 침이에요. '새우잠'은 새우처럼 등을 구부리고 자는 잠이에요.","ref":"국어 (나) 182~184쪽"},{"id":"kor4-06","type":"mc","q":"'얼른 비설거지를 해야겠다.'에서 '비설거지'의 뜻으로 알맞은 것은 무엇인가요?","choices":["비가 오려고 하거나 올 때, 비에 맞으면 안 되는 물건을 치우거나 덮는 일","비가 그친 뒤에 그릇을 깨끗이 씻는 일","빗물을 모아 두었다가 설거지하는 일","비 오는 날 집 안을 쓸고 닦는 일"],"answer":0,"exp":"'비설거지'는 비가 오려고 하거나 올 때 비에 맞으면 안 되는 물건을 치우거나 덮는 일을 뜻하는 고유어예요.","ref":"국어 (나) 179쪽"},{"id":"kor4-07","type":"mc","q":"'어떤 물건이 매우 빠르게 팔려 나가다'라는 뜻을 가진, 고유어로 이루어진 관용 표현은 무엇인가요?","choices":["날개 돋치다","눈도 깜짝 안 하다","발이 넓다","손이 크다"],"answer":0,"exp":"'날개 돋치다'는 물건이 매우 빠르게 팔려 나간다는 뜻이에요. 고유어로 이루어진 관용 표현은 우리 고유의 문화와 정서를 잘 보여 줘요.","ref":"국어 (나) 184쪽, 186쪽"},{"id":"kor4-08","type":"ox","q":"관용 표현 '눈도 깜짝 안 하다'는 '몹시 놀라서 어찌할 바를 모르다'라는 뜻이다.","answer":false,"exp":"'눈도 깜짝 안 하다'는 '조금도 놀라지 않고 태연하다'라는 뜻이에요. 치과 치료를 받을 때 하나도 놀라지 않았다면 눈도 깜짝 안 했다고 말할 수 있어요.","ref":"국어 (나) 184쪽, 186쪽"},{"id":"kor4-09","type":"mc","q":"외래어나 한자어를 고유어로 바르게 다듬은 것은 무엇인가요?","choices":["스티커 → 붙임딱지","리플 → 동아리","서클 → 댓글","계주 → 줄넘기"],"answer":0,"exp":"리플은 댓글, 계주는 이어달리기, 스티커는 붙임딱지, 서클은 동아리로 다듬어 쓸 수 있어요.","ref":"국어 (나) 186쪽"},{"id":"kor4-10","type":"input","q":"운동회의 '계주'를 고유어를 살려 다듬은 말은 무엇인가요?","hint":"초성: ㅇㅇㄷㄹㄱ","answer":["이어달리기"],"exp":"'계주'는 '이어달리기'로 다듬어 쓸 수 있어요. 고유어를 살려 다듬은 말에는 댓글(리플), 붙임딱지(스티커), 동아리(서클)도 있어요.","ref":"국어 (나) 186쪽"},{"id":"kor4-11","type":"mc","q":"「큰사전이 필요하다」에서 주시경이 '보퉁이 선생님'으로 불린 까닭은 무엇인가요?","choices":["보자기에 싼 조선어책 꾸러미를 늘 들고 다녀서","늘 보라색 두루마기를 입고 다녀서","학생들에게 보물을 나누어 주어서","보통 사람들과 똑같이 생활해서"],"answer":0,"exp":"주시경은 조선어책을 보자기에 싸서 늘 들고 다녀 '보퉁이 선생님'으로 불렸어요. '보퉁이'는 물건을 보자기에 싸서 꾸려 놓은 것이에요. 그는 근대 한국어 연구의 아버지로 불려요.","ref":"국어 (나) 195쪽"},{"id":"kor4-12","type":"mc","q":"주시경이 지은 '한글'이라는 이름에 담긴 뜻이 아닌 것은 무엇인가요?","choices":["한자로 쓴 글","크고 바른 글","첫째가는 글","우리 겨레의 글"],"answer":0,"exp":"'한'에는 '크고 바르다'는 뜻이 있고 숫자 1과도 통하며, 대한 제국의 '한'을 따서 '우리 겨레의 글'이라는 뜻도 담았어요. 우리글은 '언문' → '국문'을 거쳐 '한글'로 불리게 되었어요.","ref":"국어 (나) 196쪽"},{"id":"kor4-13","type":"ox","q":"조선어학회의 목표는 글을 알지 못하는 민중에게 한글을 가르치는 문맹 퇴치 운동과 한글 사전 편찬이었다.","answer":true,"exp":"조선어학회는 문맹 퇴치 운동과 한글 사전 편찬이라는 두 가지 목표로 활동했어요. 이때 편찬을 시작한 사전이 훗날 『큰사전』으로 불려요.","ref":"국어 (나) 198쪽"},{"id":"kor4-14","type":"mc","q":"「큰사전이 필요하다」에 나온 단체와 사건을 일어난 순서대로 바르게 나열한 것은 무엇인가요?","choices":["국어연구학회 → 조선어연구회 → 조선어학회 → 『큰사전』 원고 발견","조선어학회 → 국어연구학회 → 『큰사전』 원고 발견 → 조선어연구회","조선어연구회 → 국어연구학회 → 『큰사전』 원고 발견 → 조선어학회","『큰사전』 원고 발견 → 조선어학회 → 조선어연구회 → 국어연구학회"],"answer":0,"exp":"1908년 국어연구학회 → 1921년 조선어연구회 → 1931년 조선어학회로 이름 변경 → 1942년 원고 압수 → 1945년 9월 8일 원고 발견 → 1957년 『조선말 큰사전』 완간 순서예요.","ref":"국어 (나) 196~200쪽, 202쪽"},{"id":"kor4-15","type":"ox","q":"광복 뒤 잃어버렸던 『큰사전』 원고는 1945년 9월 8일 서울역 창고에서 발견되었다.","answer":true,"exp":"1942년 일본 경찰에 압수되었던 『큰사전』 원고 수만 장이 1945년 9월 8일 서울역 창고의 상자에서 발견되었어요. 이 원고로 1947년 1권이 나오고, 1957년 6권으로 『조선말 큰사전』이 완간되었어요.","ref":"국어 (나) 199~200쪽"},{"id":"kor4-16","type":"mc","q":"'배우지 못하여 글을 읽거나 쓸 줄을 모름. 또는 그런 사람'을 뜻하는 낱말은 무엇인가요?","choices":["문맹","절호","천금","상흔"],"answer":0,"exp":"'문맹'은 글을 읽거나 쓸 줄 모름, '절호'는 기회나 시기가 더할 수 없이 좋음, '천금'은 많은 돈이나 아주 귀중한 것, '상흔'은 상처를 입은 자리에 남은 흔적이에요.","ref":"국어 (나) 200~201쪽"},{"id":"kor4-17","type":"mc","q":"'정구지', '세우리'는 어떤 표준어의 방언인가요?","choices":["부추","가위","구멍","부침개"],"answer":0,"exp":"부추의 방언으로 정구지, 세우리가 있어요. 구멍은 구먹·구녕, 가위는 가새·가시개, 부침개는 지지미·찌짐 같은 방언이 있어요.","ref":"국어 (나) 204~205쪽"},{"id":"kor4-18","type":"ox","q":"방언은 특정 지역에서만 쓰는 말이어서 우리말 사전을 만드는 데에는 전혀 쓸모가 없었다.","answer":false,"exp":"학자들은 각 지역의 개성이 담긴 방언도 우리 민족의 소중한 보물이라고 생각했어요. '시골말 캐기'로 모은 말들은 『큰사전』을 만드는 든든한 뿌리가 되었어요.","ref":"국어 (나) 204쪽"},{"id":"kor4-19","type":"input","q":"우리나라 사람들이 공통으로 사용하도록 정한 말을 무엇이라고 하나요?","hint":"초성: ㅍㅈㅇ","answer":["표준어"],"exp":"공통으로 사용하도록 정한 말은 표준어, 특정 지역에서 주로 사용하며 표준어가 아닌 말은 방언이에요.","ref":"국어 (나) 204쪽"},{"id":"kor4-20","type":"mc","q":"1908년 주시경이 '국어연구학회'를 만들어 제자들과 함께 만들기 시작한 사전의 이름은 무엇인가요?","choices":["말모이","큰사전","훈민정음","한글 맞춤법"],"answer":0,"exp":"사전의 이름은 '말을 모아 놓았다'는 뜻에서 『말모이』라고 정했어요. 하지만 1914년 주시경이 세상을 떠나 『말모이』는 빛을 보지 못했고, 그 뜻을 제자들과 조선어학회가 이어받았어요.","ref":"국어 (나) 196~197쪽"},{"id":"kor4-21","type":"mc","q":"「야, 겨울 온다」에 나오는 고유어 '방그레'의 뜻으로 알맞은 것은 무엇인가요?","choices":["입만 예쁘게 조금 벌리고 소리 없이 보드랍게 웃는 모양","입을 크게 벌리고 소리 내어 시원하게 웃는 모양","눈물을 글썽이며 소리 없이 우는 모양","화가 나서 입을 삐죽 내미는 모양"],"answer":0,"exp":"'방그레'는 입만 예쁘게 조금 벌리고 소리 없이 보드랍게 웃는 모양을 나타내는 고유어예요.","ref":"국어 (나) 214~215쪽"},{"id":"kor4-22","type":"mc","q":"'비, 눈, 우박, 안개 따위로 일정 기간 일정한 곳에 내린 물의 양'을 뜻하는 낱말은 무엇인가요?","choices":["강수량","기후","교류","연소"],"answer":0,"exp":"'강수량'은 일정 기간 일정한 곳에 내린 물의 양이에요. '기후'는 기온, 비, 눈, 바람 따위의 대기 상태, '교류'는 문화나 사상 따위가 서로 통함, '연소'는 물질이 공기 중의 산소와 빠르게 반응해 열과 빛을 내며 타는 현상이에요.","ref":"국어 (나) 217쪽"}]}},"signs":[{"pool":"kor1","title":"작가의 의도","text":"작가가 글을 쓴 까닭과 독자가 느끼길 바라는 것을 작품에 담은 것. 반복·강조 표현, 작가의 생애와 시대적 배경으로 짐작해요."},{"pool":"kor1","title":"시조","text":"고려 말부터 발달한 우리 고유의 시. 정해진 글자 수에 맞춰 세 줄로 지어요. 「하여가」는 이방원, 「단심가」는 정몽주!"},{"pool":"kor1","title":"이야기 구조","text":"발단(시작) → 전개(사건 발생) → 절정(갈등 최고) → 결말(마무리). 중요한 사건을 이 순서로 정리하면 줄거리가 돼요."},{"pool":"kor2","title":"면담이란?","text":"특정 인물이나 주제의 정보를 얻으려고 면담 대상자와 주고받는 대화. 사전 준비와 예의가 꼭 필요해요."},{"pool":"kor2","title":"면담의 절차","text":"준비하기(목적·대상자·방식·자료·질문·역할·요청) → 진행하기(열기·질문하기·마무리) → 정리하기(정리·성찰·보고서)"},{"pool":"kor2","title":"질문의 종류","text":"구체적인 사실 / 생각이나 느낌 / 앞으로의 계획이나 당부. 대답을 듣고 더 자세히 묻는 질문은 후속 질문!"},{"pool":"kor3","title":"주장·이유·근거","text":"주장: 자신의 의견을 드러내는 말 / 이유: 왜 그렇게 주장하는지 설명하는 말 / 근거: 이유를 뒷받침하는 자료나 사실"},{"pool":"kor3","title":"타당성 판단 기준","text":"주장은 가치 있고 중요한가? 이유는 주장과 관련 있고 받아들일 만한가? 근거는 이유와 관련 있는 객관적 사실인가?"},{"pool":"kor3","title":"받침 ㅎ 발음","text":"ㅎ+ㄱ·ㄷ·ㅈ → [ㅋ·ㅌ·ㅊ]: 놓다[노타], 동그랗게[동그라케] / ㅎ+ㄴ → [ㄴ]: 놓는[논는], 쌓는[싼는]"},{"pool":"kor4","title":"고유어·한자어·외래어","text":"고유어: 우리말에 처음부터 있던 말(하늘, 시나브로) / 한자어: 한자로 된 말(미술) / 외래어: 외국에서 온 말(벤치)"},{"pool":"kor4","title":"큰사전 이야기","text":"1908 국어연구학회(말모이) → 1921 조선어연구회 → 1931 조선어학회 → 1945 원고 발견 → 1957 조선말 큰사전 완간"},{"pool":"kor4","title":"표준어와 방언","text":"표준어: 모두가 공통으로 쓰도록 정한 말 / 방언: 특정 지역에서 쓰는 말. 부추 → 정구지·세우리, 가위 → 가새·가시개"}]};
window.QB_SOC={"meta":{"subject":"사회","version":1},"pools":{"soc1a":{"title":"세계의 지형 경관과 생활","questions":[{"id":"soc1a-01","type":"mc","q":"사하라 사막(리비아)에서 볼 수 있는 지형 경관으로 알맞은 것은 무엇인가요?","choices":["용암이 흐르는 화산","바다 위에 우뚝 솟은 아치 모양의 바위","광활하게 펼쳐진 모래 언덕","황토가 섞여 누런 강물이 굽이쳐 흐르는 강"],"answer":2,"exp":"사하라 사막에서는 광활하게 펼쳐진 모래 언덕을 볼 수 있어요. 용암이 흐르는 화산은 마우나로아(미국), 아치 모양 바위는 엘 아르코(멕시코), 누런 강물은 황허강(중국)이에요.","ref":"사회 13~14쪽"},{"id":"soc1a-02","type":"mc","q":"빙하에 의해 침식된 U자 모양의 계곡에 바닷물이 들어와 만들어진 해안선을 무엇이라고 하나요?","choices":["피오르","갯벌","고원","오아시스"],"answer":0,"exp":"노르웨이의 송네 피오르처럼, 빙하가 깎아 만든 U자 모양 계곡에 바닷물이 들어와 만들어진 좁고 긴 해안선을 피오르라고 해요.","ref":"사회 13~14쪽"},{"id":"soc1a-03","type":"ox","q":"울루루(오스트레일리아)에서는 하나의 거대한 암석으로 이루어진 바위산이 드넓은 평지에 솟아 있는 모습을 볼 수 있습니다.","answer":true,"exp":"울루루는 하나의 거대한 암석으로 이루어진 바위산이 드넓은 평지에 솟아 있는 지형 경관이에요.","ref":"사회 13~14쪽"},{"id":"soc1a-04","type":"input","q":"빈칸에 들어갈 알맞은 말을 쓰세요.\n(          )은/는 그곳에서 살아가는 사람들의 생활 모습에 영향을 줍니다.","hint":"초성 힌트: ㅈㅎ ㄱㄱ","answer":["지형경관"],"exp":"세계에는 산지, 하천, 해안, 사막 등 다양한 지형이 있고, 지형 경관은 그곳 사람들의 생활 모습에 영향을 줘요.","ref":"사회 13~14쪽"},{"id":"soc1a-05","type":"mc","q":"산지 지형의 특징으로 알맞은 것은 무엇인가요?","choices":["바다와 육지가 만나는 곳에 나타난다","해발 고도가 높고 대체로 경사가 급하다","하천이 운반한 퇴적물이 쌓여 만들어진다","일 년 내내 바닷물에 잠겨 있다"],"answer":1,"exp":"산지 지형은 해발 고도가 높고 대체로 경사가 급해요. 하지만 고원처럼 비교적 넓고 평평한 곳이나 화산도 있어요.","ref":"사회 15쪽"},{"id":"soc1a-06","type":"mc","q":"‘해발 고도’의 뜻으로 알맞은 것은 무엇인가요?","choices":["적도로부터 떨어진 거리","땅속으로 들어간 깊이","산 정상에서 하늘까지의 높이","바다 표면으로부터 잰 육지의 높이"],"answer":3,"exp":"해발 고도는 바다 표면으로부터 잰 육지의 높이예요. 히말라야산맥의 에베레스트산(8,848 m)은 세계에서 가장 높은 산이에요.","ref":"사회 15~16쪽"},{"id":"soc1a-07","type":"mc","q":"필리핀 바나우에 사람들은 경사가 가파른 산지를 어떻게 이용하고 있나요?","choices":["대형 농기계와 비행기로 대규모 농사를 짓는다","배 위에서 물건을 사고파는 시장을 연다","계단식 농사를 짓는다","갯벌을 이용해 소금을 만든다"],"answer":2,"exp":"산지의 경사가 가파른 곳에서는 계단식 농사를 짓기도 해요. 바나우에의 논두렁을 모두 이으면 지구 반 바퀴 길이에 달한다고 해요.","ref":"사회 15~16쪽"},{"id":"soc1a-08","type":"ox","q":"산지 지형에는 고원과 같이 비교적 넓고 평평한 곳도 있어, 타지키스탄의 파미르고원처럼 가축을 기르기도 합니다.","answer":true,"exp":"파미르고원은 땅이 비교적 평탄하고 풀이 잘 자라 양을 키워요. 산지의 비교적 평탄한 곳에서는 가축을 기르기도 해요.","ref":"사회 15~16쪽"},{"id":"soc1a-09","type":"mc","q":"칠레 추키카마타에서 광업이 발달한 까닭은 무엇인가요?","choices":["아름다운 모래사장이 있어서","구리 매장량이 많아서","강 주변에 넓은 평야가 있어서","화산 분출을 볼 수 있어서"],"answer":1,"exp":"지하자원이 풍부한 산지에서는 광업이 발달하기도 해요. 칠레 추키카마타는 구리 매장량이 많아 광업이 발달했어요.","ref":"사회 17쪽"},{"id":"soc1a-10","type":"ox","q":"지하자원이 풍부한 산지에는 스키장, 휴양림 등 관광 산업이 발달합니다.","answer":false,"exp":"지하자원이 풍부한 산지에는 광업이 발달해요. 스키장, 휴양림은 아름다운 지형 경관을 이용한 관광지예요.","ref":"사회 15~17쪽"},{"id":"soc1a-11","type":"mc","q":"관광객이 버린 쓰레기로 에베레스트산이 몸살을 앓자 네팔 정부가 한 노력으로 알맞은 것은 무엇인가요?","choices":["관광객에게 자기 쓰레기를 가지고 내려오도록 했다","에베레스트산을 6개월 동안 폐쇄했다","셰르파 활동을 모두 금지했다","등반길에 쓰레기장을 더 많이 만들었다"],"answer":0,"exp":"네팔 정부는 관광객에게 자기 쓰레기를 가지고 내려오도록 하거나 쓰레기 처리 비용에 해당하는 입산료를 받는 등 환경을 보호하려고 노력해요. 6개월 폐쇄는 필리핀 보라카이섬의 사례예요.","ref":"사회 18쪽"},{"id":"soc1a-12","type":"mc","q":"큰 하천 주변에 넓은 평야가 발달한 까닭은 무엇인가요?","choices":["빙하가 땅을 깎아 내서","화산에서 나온 용암이 굳어서","바닷물이 들어와 땅을 덮어서","하천이 운반한 여러 가지 퇴적물이 하천 주변에 쌓여서"],"answer":3,"exp":"하천이 운반한 여러 가지 퇴적물이 하천 주변에 쌓여 평야를 이루어요. 이런 넓은 평야를 이용해 큰 규모로 농사를 짓기도 해요.","ref":"사회 20쪽"},{"id":"soc1a-13","type":"mc","q":"깊은 계곡 사이로 강물이 말발굽 모양으로 흐르는 하천 지형은 어디인가요?","choices":["빅토리아 폭포(잠비아, 짐바브웨)","호스슈 벤드 계곡(미국)","나일강 평야(이집트)","아마존강(브라질)"],"answer":1,"exp":"호스슈 벤드 계곡은 깊은 계곡 사이로 강물이 말발굽 모양으로 흘러요. 빅토리아 폭포는 많은 물이 절벽 아래로 떨어지고, 나일강 평야에는 넓은 농경지가, 아마존강은 울창한 숲 사이를 흘러요.","ref":"사회 19쪽"},{"id":"soc1a-14","type":"mc","q":"하천을 이용하는 사람들의 생활 모습을 바르게 짝지은 것은 무엇인가요?","choices":["콩고 민주 공화국 - 비행기를 이용해 대규모로 농사를 짓는다","미국 일리노이강 - 배 위에서 물건을 사고파는 수상 시장이 열린다","노르웨이 - 전기의 대부분을 수력 발전으로 생산한다","타이 짜오프라야강 - 독특한 도구로 물고기를 잡는다"],"answer":2,"exp":"노르웨이는 풍부한 물을 이용해 전기의 대부분을 수력 발전으로 생산해요. 콩고강 사람들은 독특한 도구로 물고기를 잡고, 일리노이강 주변은 대형 농기계·비행기로 대규모 농사를 짓고, 짜오프라야강에는 수상 시장이 있어요.","ref":"사회 20~21쪽"},{"id":"soc1a-15","type":"input","q":"타이 짜오프라야강처럼 강을 따라 배 위에서 물건을 사고파는 시장을 무엇이라고 하나요?","hint":"초성 힌트: ㅅㅅ ㅅㅈ","answer":["수상시장"],"exp":"강을 따라 배 위에서 물건을 사고파는 수상 시장이 발달하기도 해요. 하천을 따라 물건을 옮기기도 하지요.","ref":"사회 21쪽"},{"id":"soc1a-16","type":"mc","q":"해안 지역 사람들의 생활 모습을 바르게 짝지은 것은 무엇인가요?","choices":["프랑스 게랑드 - 갯벌을 이용해 질 좋은 소금을 만든다","스리랑카 - 대형 농기계로 넓은 평야에서 농사를 짓는다","네덜란드 - 배 없이 장대를 이용해 물고기를 잡는다","멕시코 해변 - 구리를 캐는 광업이 발달했다"],"answer":0,"exp":"프랑스 게랑드 지역 주민들은 갯벌을 이용해 질 좋은 소금을 만들어요. 스리랑카는 장대를 이용한 고기잡이, 네덜란드는 항구, 멕시코 해변은 관광지로 알려져 있어요.","ref":"사회 24쪽"},{"id":"soc1a-17","type":"ox","q":"배가 드나들기에 유리한 해안에는 염전이 발달합니다.","answer":false,"exp":"배가 드나들기에 유리한 해안에는 항구가 발달해요. 염전은 갯벌이 넓게 펼쳐진 해안에 발달하기도 해요.","ref":"사회 24~25쪽"},{"id":"soc1a-18","type":"mc","q":"물고기나 조개 등을 인공적으로 기르는 일을 무엇이라고 하나요?","choices":["낙농업","광업","유목","양식업"],"answer":3,"exp":"해안 지역 주민들은 주로 어업이나 양식업을 하며 살아가요. 양식업은 물고기나 조개 등을 인공적으로 기르는 일이에요.","ref":"사회 24쪽"},{"id":"soc1a-19","type":"mc","q":"필리핀 정부가 보라카이섬을 6개월간 폐쇄하기로 한 까닭은 무엇인가요?","choices":["관광객이 거의 찾아오지 않아서","관광객이 버린 쓰레기와 오염된 물로 환경 오염이 심각해져서","화산이 폭발할 위험이 커져서","주민들이 모두 다른 섬으로 이사해서"],"answer":1,"exp":"관광 산업은 주민들에게 수입을 주었지만 쓰레기와 오염된 물로 환경 오염이 심각해졌어요. 그래서 환경을 보호하려고 섬을 폐쇄했고, 주민들의 생계를 지킬 방법도 함께 찾기로 했어요.","ref":"사회 25쪽"},{"id":"soc1a-20","type":"ox","q":"강 주변의 넓은 평야에서 계단식 농사를 짓습니다.","answer":false,"exp":"계단식 농사는 경사가 가파른 산지에서 짓는 방식이에요. 강 주변의 넓은 평야에서는 대형 농기계 등을 이용해 큰 규모로 농사를 짓기도 해요.","ref":"사회 15~16, 20, 29쪽"}]},"soc1b":{"title":"기후 분포와 열대·건조 기후","questions":[{"id":"soc1b-01","type":"mc","q":"지구에서 위도에 따라 기온이 달라지는 까닭으로 알맞은 것은 무엇인가요?","choices":["위도가 높을수록 바다가 넓어서","지구는 둥글기 때문에 위도에 따라 햇볕을 받는 양이 달라서","위도에 따라 산의 높이가 달라서","위도가 낮을수록 비가 적게 내려서"],"answer":1,"exp":"지구는 둥글어서 위도에 따라 햇볕을 받는 양이 달라요. 대체로 적도 지방에서 극지방으로 갈수록 기온이 점차 낮아져요.","ref":"사회 31쪽"},{"id":"soc1b-02","type":"ox","q":"연평균 기온이 26.6℃인 아부자는 연평균 기온이 -0.5℃인 키루나보다 적도에 더 가까운 곳에 있습니다.","answer":true,"exp":"적도에 가까울수록 햇볕을 많이 받아 기온이 높아요. 그래서 연평균 기온이 높은 아부자가 키루나보다 적도에 더 가까워요.","ref":"사회 31쪽"},{"id":"soc1b-03","type":"mc","q":"세계의 기후를 구분하는 주된 기준 두 가지는 무엇인가요?","choices":["인구와 면적","바람과 구름의 양","해발 고도와 바다의 깊이","기온과 강수량"],"answer":3,"exp":"세계의 기후는 주로 기온과 강수량을 기준으로 구분해요.","ref":"사회 33쪽"},{"id":"soc1b-04","type":"mc","q":"적도 지방에서 극지방으로 가면서 나타나는 기후의 순서로 알맞은 것은 무엇인가요?","choices":["열대 → 건조 → 온대 → 냉대 → 한대","열대 → 온대 → 건조 → 한대 → 냉대","건조 → 열대 → 냉대 → 온대 → 한대","열대 → 건조 → 냉대 → 온대 → 한대"],"answer":0,"exp":"대체로 적도에서 극지방으로 가면서 열대, 건조, 온대, 냉대, 한대 기후가 차례대로 나타나고, 매우 높은 산지에서는 고산 기후가 나타나요.","ref":"사회 33쪽"},{"id":"soc1b-05","type":"mc","q":"우리나라에서 나타나는 기후를 바르게 짝지은 것은 무엇인가요?","choices":["열대 기후와 건조 기후","한대 기후와 고산 기후","온대 기후와 냉대 기후","건조 기후와 한대 기후"],"answer":2,"exp":"우리나라에서는 온대 기후와 냉대 기후가 나타나요.","ref":"사회 32쪽"},{"id":"soc1b-06","type":"ox","q":"우리나라에서는 고산 기후가 나타납니다.","answer":false,"exp":"우리나라에서는 고산 기후가 나타나지 않아요. 다만 해발 고도가 높은 곳에서는 평지와 다른 서늘한 기후가 나타나요.","ref":"사회 33쪽"},{"id":"soc1b-07","type":"input","q":"북반구에 주로 분포하는 기후는 무엇인가요?","hint":"초성 힌트: ㄴㄷ 기후","answer":["냉대","냉대기후"],"exp":"냉대 기후는 북반구의 중위도와 고위도 지역에서 널리 나타나요.","ref":"사회 32쪽"},{"id":"soc1b-08","type":"mc","q":"기후 그래프에서 막대와 선이 나타내는 것을 바르게 짝지은 것은 무엇인가요?","choices":["막대 - 기온, 선 - 강수량","막대 - 강수량, 선 - 기온","막대 - 바람의 세기, 선 - 습도","막대 - 해발 고도, 선 - 위도"],"answer":1,"exp":"기후 그래프에서 막대는 강수량을, 선은 기온을 나타내요.","ref":"사회 34쪽"},{"id":"soc1b-09","type":"mc","q":"열대 기후의 특징으로 알맞은 것은 무엇인가요?","choices":["사계절의 변화가 비교적 뚜렷하다","겨울이 길고 기온이 매우 낮아 눈과 얼음으로 덮여 있다","연중 강수량이 매우 적고 낮과 밤의 기온 차이가 크다","일 년 내내 기온이 높고 기온의 변화가 거의 없다"],"answer":3,"exp":"열대 기후는 적도 주변의 저위도 지역에 나타나며, 일 년 내내 기온이 높고 기온의 변화가 거의 없어요.","ref":"사회 34쪽"},{"id":"soc1b-10","type":"input","q":"열대 기후 지역 가운데에는 일 년 내내 비가 많이 내려 울창한 숲을 이루는 곳이 있습니다. 이 숲을 무엇이라고 하나요?","hint":"초성 힌트: ㅇㄷ ㅇㄹ","answer":["열대우림"],"exp":"일 년 내내 비가 많이 내리는 열대 기후 지역은 열대 우림을 이뤄요. 말레이시아 쿠알라룸푸르 주변이 그 예예요.","ref":"사회 34, 36쪽"},{"id":"soc1b-11","type":"mc","q":"건기와 우기가 번갈아 나타나는 열대 기후 지역에서 넓게 펼쳐지는 것은 무엇인가요?","choices":["초원","열대 우림","침엽수림","빙하"],"answer":0,"exp":"건기(일 년 중 비가 적게 내리는 시기)와 우기(비가 많이 내리는 시기)가 번갈아 나타나는 곳에는 초원이 넓게 펼쳐져요. 탄자니아 므완자 주변이 그 예예요.","ref":"사회 34쪽"},{"id":"soc1b-12","type":"mc","q":"열대 기후 지역에서 전통적으로 해 온 ‘화전 농업’에 대한 설명으로 알맞은 것은 무엇인가요?","choices":["강물을 끌어와 논에서 벼를 기르는 방식","젖소나 염소를 길러 우유와 치즈를 만드는 방식","나무와 풀을 태우고 남은 재를 거름 삼아 농사짓는 방식","경사진 산에 계단을 만들어 농사짓는 방식"],"answer":2,"exp":"화전 농업은 나무와 풀을 태우고 남은 재를 거름 삼아 농사짓는 방식으로, 카사바, 얌, 옥수수 등을 재배했어요.","ref":"사회 35쪽"},{"id":"soc1b-13","type":"mc","q":"열대 기후 지역의 전통적인 집의 모습으로 알맞은 것은 무엇인가요?","choices":["벽이 두껍고 창문이 작은 흙벽돌집","바람이 잘 통하도록 창을 크게 만들고, 기둥을 세워 바닥을 땅에서 띄운 집","가축의 털이나 가죽으로 만든 이동식 가옥","나무를 쌓아 만든 통나무집"],"answer":1,"exp":"열대 기후 지역에서는 바람이 잘 통하도록 창을 크게 만들고 기둥을 세워 바닥을 땅에서 띄워 집을 지어요. 옷도 얇고 바람이 잘 통하는 옷을 주로 입어요.","ref":"사회 35쪽"},{"id":"soc1b-14","type":"mc","q":"타이의 똠얌꿍처럼 열대 기후 지역에서 다양한 향신료를 사용한 음식이 발달한 까닭은 무엇인가요?","choices":["추운 날씨에 몸을 따뜻하게 하려고","물이 부족해서 물을 적게 쓰려고","향신료가 가장 값싼 재료라서","더운 날씨에 음식이 쉽게 상하지 않도록 하려고"],"answer":3,"exp":"열대 기후 지역은 기온이 높아 음식이 쉽게 상해요. 그래서 다양한 향신료를 넣어 맵고 새콤한 음식이 발달했어요.","ref":"사회 35쪽"},{"id":"soc1b-15","type":"ox","q":"오늘날 열대 기후 지역에서는 천연고무, 카카오, 바나나, 커피 등을 대규모로 재배하고, 사파리 관광 같은 생태 관광 산업도 이루어집니다.","answer":true,"exp":"열대 기후 지역에서는 천연고무, 카카오, 바나나, 커피 등을 대규모로 재배하며, 사파리 관광과 전통 부족 생활 체험 같은 생태 관광 산업도 이루어지고 있어요.","ref":"사회 35쪽"},{"id":"soc1b-16","type":"mc","q":"건조 기후에 대한 설명으로 알맞은 것은 무엇인가요?","choices":["일 년 내내 비가 많이 내려 울창한 숲을 이룬다","겨울이 여름보다 길고 눈이 많이 내린다","연중 강수량이 적고 낮과 밤의 기온 차이가 크다","적도 주변의 높은 산지에서 일 년 내내 서늘하다"],"answer":2,"exp":"건조 기후는 저위도와 중위도 지역의 연중 강수량이 적은 곳에 나타나며, 낮과 밤의 기온 차이가 커요. 사막이나 초원이 넓게 나타나요.","ref":"사회 36쪽"},{"id":"soc1b-17","type":"ox","q":"건조 기후는 저위도와 중위도 지역의 강수량이 많은 곳에 나타납니다.","answer":false,"exp":"건조 기후는 저위도와 중위도 지역 가운데 연중 강수량이 적은 곳에 주로 나타나요.","ref":"사회 36쪽"},{"id":"soc1b-18","type":"mc","q":"사막 지역 사람들이 온몸을 감싸는 옷을 입는 까닭은 무엇인가요?","choices":["강한 햇볕과 모래바람을 막으려고","겨울의 추위를 이겨 내려고","비에 젖지 않으려고","높은 산의 강한 바람을 막으려고"],"answer":0,"exp":"사막 지역 사람들은 강한 햇볕과 모래바람을 막으려고 온몸을 감싸는 옷을 입고, 벽이 두껍고 창문이 작은 흙벽돌집에서 생활해요.","ref":"사회 36쪽"},{"id":"soc1b-19","type":"mc","q":"사막 주변의 초원 지역에 사는 사람들의 생활 모습으로 알맞은 것은 무엇인가요?","choices":["통나무집을 짓고 목재와 펄프를 생산한다","유목 생활을 하며 가축의 털이나 가죽으로 만든 이동식 가옥에서 생활한다","순록을 기르며 오로라 관광을 안내한다","벼농사를 지으며 기와집에서 생활한다"],"answer":1,"exp":"초원 지역 사람들은 물과 풀이 있는 곳을 찾아 이동하며 가축을 기르는 유목 생활을 하고, 가축의 젖으로 만든 유제품이나 고기를 먹어요.","ref":"사회 36쪽"},{"id":"soc1b-20","type":"mc","q":"건조 기후 지역의 오아시스나 강 주변에서 주로 재배하는 것은 무엇인가요?","choices":["카사바나 얌","올리브나 포도","천연고무나 카카오","밀이나 대추야자"],"answer":3,"exp":"건조 기후 지역의 오아시스나 강 주변에서는 밀이나 대추야자를 재배해요.","ref":"사회 36쪽"}]},"soc1c":{"title":"온대·냉대·한대·고산 기후","questions":[{"id":"soc1c-01","type":"mc","q":"온대 기후에 대한 설명으로 알맞은 것은 무엇인가요?","choices":["적도 주변에 나타나며 일 년 내내 기온이 높다","남극과 북극 주변에 나타나며 일 년 내내 눈과 얼음으로 덮여 있다","중위도 지역에 주로 나타나며 사계절의 변화가 비교적 뚜렷하다","연중 강수량이 매우 적어 사막이 넓게 나타난다"],"answer":2,"exp":"온대 기후는 중위도 지역에 주로 나타나며, 사계절의 변화가 비교적 뚜렷해요.","ref":"사회 37쪽"},{"id":"soc1c-02","type":"input","q":"빈칸에 들어갈 알맞은 말을 쓰세요.\n온대 기후는 (          ) 지역에 주로 나타나며, 사계절이 비교적 뚜렷합니다.","hint":"초성 힌트: ㅈㅇㄷ","answer":["중위도"],"exp":"온대 기후는 중위도 지역에 주로 나타나요. 냉대 기후는 북반구의 중위도와 고위도 지역에서 널리 나타나요.","ref":"사회 37, 39쪽"},{"id":"soc1c-03","type":"ox","q":"서부 유럽(영국 런던 등)의 온대 기후 지역은 여름이 서늘하고 겨울이 따뜻하며, 연중 강수량이 고릅니다.","answer":true,"exp":"서부 유럽은 여름이 서늘하고 겨울이 따뜻하며 연중 강수량이 고른 온대 기후가 나타나요. 그래서 밀을 많이 재배하고 낙농업이 발달했어요.","ref":"사회 37~38쪽"},{"id":"soc1c-04","type":"mc","q":"지중해 주변(이탈리아 로마 등)의 온대 기후 특징으로 알맞은 것은 무엇인가요?","choices":["여름은 덥고 건조하며, 겨울은 따뜻하고 강수량이 많다","여름에 덥고 비가 많이 내리며, 겨울은 춥고 건조하다","여름이 서늘하고 겨울이 따뜻하며, 연중 강수량이 고르다","겨울이 여름보다 길고 몹시 추우며, 눈이 많이 내린다"],"answer":0,"exp":"지중해 주변 지역은 덥고 건조한 여름에 비해 겨울이 따뜻하고 강수량이 많아요. 여름에 덥고 비가 많이 오는 곳은 우리나라 같은 아시아 지역이에요.","ref":"사회 37쪽"},{"id":"soc1c-05","type":"mc","q":"온대 기후 지역과 그곳에서 발달한 농업을 바르게 짝지은 것은 무엇인가요?","choices":["서부 유럽 - 화전 농업","우리나라를 비롯한 아시아 - 순록 유목","지중해 주변 - 침엽수림의 목재 생산","지중해 주변 - 올리브나 포도 재배"],"answer":3,"exp":"서부 유럽은 밀 재배와 낙농업, 지중해 주변은 올리브와 포도 재배, 우리나라를 비롯한 아시아는 벼농사가 발달했어요.","ref":"사회 38쪽"},{"id":"soc1c-06","type":"mc","q":"젖소나 염소를 길러 우유, 치즈 등을 만드는 농업을 무엇이라고 하나요?","choices":["양식업","낙농업","화전 농업","광업"],"answer":1,"exp":"낙농업은 젖소나 염소를 길러 우유, 치즈 등을 만드는 농업으로, 연중 강수량이 고른 서부 유럽에서 발달했어요.","ref":"사회 38쪽"},{"id":"soc1c-07","type":"mc","q":"냉대 기후의 특징으로 알맞은 것은 무엇인가요?","choices":["일 년 내내 기온이 높고 기온의 변화가 거의 없다","연중 강수량이 적고 낮과 밤의 기온 차이가 크다","사계절이 있지만 겨울이 여름보다 길고 몹시 추우며 눈이 많이 내린다","적도 주변의 높은 곳에서 일 년 내내 서늘하다"],"answer":2,"exp":"냉대 기후는 북반구의 중위도와 고위도 지역에 널리 나타나며, 온대처럼 사계절이 있지만 겨울이 여름보다 길고 몹시 추우며 눈이 많이 내려요.","ref":"사회 39쪽"},{"id":"soc1c-08","type":"ox","q":"냉대 기후 지역은 겨울에 밀, 옥수수, 감자 등을 재배합니다.","answer":false,"exp":"냉대 기후 지역은 여름에 밀, 옥수수, 감자 등을 재배하고, 추운 겨울에는 농사를 짓기 어려워요.","ref":"사회 39쪽"},{"id":"soc1c-09","type":"mc","q":"냉대 기후 지역에서 목재와 펄프 생산이 활발한 까닭은 무엇인가요?","choices":["침엽수림이 넓게 발달해서","열대 우림이 넓게 발달해서","넓은 초원이 펼쳐져 있어서","넓은 갯벌이 펼쳐져 있어서"],"answer":0,"exp":"냉대 기후 지역은 침엽수림이 넓게 발달해 목재와 펄프(나무에서 뽑아낸 종이의 원료) 생산이 활발해요. 침엽수는 나무가 부드러워 펄프를 만들기 좋아요.","ref":"사회 39쪽"},{"id":"soc1c-10","type":"mc","q":"냉대 기후 지역 사람들의 생활 모습으로 알맞은 것은 무엇인가요?","choices":["얇고 바람이 잘 통하는 옷을 입고, 바닥을 땅에서 띄운 집에서 산다","온몸을 감싸는 옷을 입고, 흙벽돌집에서 산다","챙이 넓고 둥근 모자를 쓰고 알파카를 기른다","나무가 많아 통나무집을 짓고, 두꺼운 털옷과 털모자를 착용한다"],"answer":3,"exp":"냉대 기후 지역은 나무가 많아 주로 통나무집을 짓고, 겨울 추위를 이겨 내려고 두꺼운 털옷과 털모자를 착용해요.","ref":"사회 39쪽"},{"id":"soc1c-11","type":"ox","q":"일 년의 절반이 겨울인 핀란드는 운전면허 시험에서 눈이나 빙판 위에서 운전하는 방법을 중요하게 다룹니다.","answer":true,"exp":"핀란드는 눈이나 빙판 위를 운전하거나 순록 같은 야생 동물을 만나는 경우가 많아, 이런 상황의 운전 방법을 운전면허 시험에서 중요하게 다뤄요.","ref":"사회 40쪽"},{"id":"soc1c-12","type":"mc","q":"한대 기후 지역 사람들의 생활 모습으로 알맞지 않은 것은 무엇인가요?","choices":["사냥하여 얻은 생선과 고기를 주로 먹는다","올리브와 포도를 대규모로 재배한다","짧은 여름에 이끼가 자라는 곳에서 순록을 기르며 유목 생활을 한다","오로라와 빙하를 이용한 관광 산업이 발달하고 있다"],"answer":1,"exp":"한대 기후 지역 사람들은 사냥과 순록 유목을 하며, 최근에는 지하자원 개발, 기후 환경 연구, 오로라·빙하 관광이 활발해요. 올리브와 포도는 지중해 주변의 온대 기후 지역에서 재배해요.","ref":"사회 41쪽"},{"id":"soc1c-13","type":"mc","q":"극지방의 하늘에서 여러 가지 색깔의 빛이 나타나는 현상을 무엇이라고 하나요?","choices":["무지개","신기루","오로라","번개"],"answer":2,"exp":"오로라는 극지방의 하늘에서 여러 가지 색깔의 빛이 나타나는 현상으로, 한대 기후 지역의 관광 자원이 되고 있어요.","ref":"사회 41쪽"},{"id":"soc1c-14","type":"input","q":"빈칸에 들어갈 알맞은 말을 쓰세요.\n세계 여러 나라 사람들은 기후에 (          )하고, 이를 극복하면서 다양한 모습으로 살아갑니다.","hint":"초성 힌트: ㅈㅇ","answer":["적응"],"exp":"기후는 사람들의 생활 모습에 큰 영향을 줘요. 사람들은 기후에 적응하고, 이를 극복하면서 다양한 모습으로 살아가요.","ref":"사회 44, 46쪽"},{"id":"soc1c-15","type":"input","q":"빈칸에 들어갈 알맞은 말을 쓰세요.\n한대 기후는 남극과 북극 주변의 (          ) 지역에 주로 나타납니다.","hint":"초성 힌트: ㄱㅇㄷ","answer":["고위도"],"exp":"한대 기후는 남극과 북극 주변의 고위도 지역에 주로 나타나며, 겨울이 길고 기온이 매우 낮아 일 년 내내 눈과 얼음으로 덮인 곳이 많아요.","ref":"사회 41~42쪽"},{"id":"soc1c-16","type":"mc","q":"고산 기후에 대한 설명으로 알맞은 것은 무엇인가요?","choices":["해발 고도가 높은 지역에 나타나며, 적도 주변의 일부 지역은 일 년 내내 서늘하다","해발 고도가 낮은 평야에 나타나며 일 년 내내 무덥다","남극과 북극 주변의 고위도 지역에만 나타난다","우리나라의 높은 산에서도 뚜렷하게 나타난다"],"answer":0,"exp":"고산 기후는 해발 고도가 높은 지역에 나타나요. 적도 주변의 일부 고산 기후 지역은 일 년 내내 서늘해 사람이 많이 모여 살아요. 우리나라에는 고산 기후가 나타나지 않아요.","ref":"사회 33, 42쪽"},{"id":"soc1c-17","type":"mc","q":"고산 기후 지역(에콰도르 키토 주변 등) 사람들의 생활 모습으로 알맞은 것은 무엇인가요?","choices":["올리브와 포도를 재배한다","순록을 기르며 이끼가 자라는 곳을 찾아 이동한다","천연고무와 카카오를 대규모로 재배한다","감자와 옥수수를 재배하고 알파카와 라마를 기른다"],"answer":3,"exp":"고산 기후 지역 사람들은 감자와 옥수수 등을 주로 재배하고, 알파카와 라마 같은 동물을 길러요.","ref":"사회 42쪽"},{"id":"soc1c-18","type":"mc","q":"고산 기후 지역 사람들이 옷을 여러 겹 입고 망토를 두르는 까닭은 무엇인가요?","choices":["모래바람을 막으려고","낮과 밤의 기온 차이가 큰 기후에 적응하려고","일 년 내내 무더운 날씨를 견디려고","비가 매우 많이 내려서"],"answer":1,"exp":"고산 기후 지역은 낮과 밤의 기온 차이가 커서 옷을 여러 겹 입고 망토를 둘러요. 챙이 넓고 둥근 모자로는 강한 햇빛을 막아요.","ref":"사회 42쪽"},{"id":"soc1c-19","type":"ox","q":"온대 기후는 겨울이 여름보다 길고 몹시 추우며 눈이 많이 옵니다.","answer":false,"exp":"겨울이 여름보다 길고 몹시 추우며 눈이 많이 오는 것은 냉대 기후의 특징이에요. 온대 기후는 사계절의 변화가 비교적 뚜렷해요.","ref":"사회 37, 39, 47쪽"},{"id":"soc1c-20","type":"ox","q":"대추야자는 온대 기후 지역에서 주로 기르는 식물입니다.","answer":false,"exp":"대추야자는 건조 기후 지역의 오아시스나 강 주변에서 재배해요.","ref":"사회 36, 47쪽"}]},"soc2a":{"title":"우리나라 시장경제의 특징","questions":[{"id":"soc2a-01","type":"mc","q":"물건이나 서비스의 거래가 이루어지는 곳을 무엇이라고 하나요?","choices":["가계","시장","기업","정부"],"answer":1,"exp":"시장은 물건이나 서비스의 거래가 이루어지는 곳이에요. 대형 할인점, 전통 시장, 문구점, 온라인 쇼핑몰 등 다양한 형태가 있어요.","ref":"사회 61~62쪽"},{"id":"soc2a-02","type":"mc","q":"시장에서 경제활동을 함께하며 살림을 꾸려 가는 생활 공동체를 무엇이라고 하나요?","choices":["기업","시장","가계","은행"],"answer":2,"exp":"가계는 시장에서 경제활동을 함께하며 살림을 꾸려 가는 생활 공동체예요.","ref":"사회 61쪽"},{"id":"soc2a-03","type":"mc","q":"시장에서 이윤을 목적으로 물건이나 서비스를 생산하거나 판매하는 조직을 무엇이라고 하나요?","choices":["기업","가계","시장","근로자"],"answer":0,"exp":"기업은 이윤을 목적으로 물건이나 서비스를 생산하거나 판매하는 조직이에요.","ref":"사회 61쪽"},{"id":"soc2a-04","type":"mc","q":"‘이윤’의 뜻으로 알맞은 것은 무엇인가요?","choices":["물건을 사기 위해 가게에 내는 돈","은행에 돈을 맡기고 받는 돈","근로자가 일한 대가로 받는 돈","물건이나 서비스를 판매하여 얻은 수입에서 생산하는 데 들어간 비용을 뺀 금액"],"answer":3,"exp":"이윤은 물건이나 서비스를 판매하여 얻은 수입에서 그것을 생산하는 데 들어간 비용을 뺀 금액이에요.","ref":"사회 61쪽"},{"id":"soc2a-05","type":"mc","q":"어떤 기업이 빵을 팔아 100만 원의 수입을 얻었고, 빵을 만드는 데 70만 원의 비용이 들었습니다. 이 기업이 얻은 이윤은 얼마인가요?","choices":["70만 원","30만 원","100만 원","170만 원"],"answer":1,"exp":"이윤은 수입에서 생산 비용을 뺀 금액이므로 100만 원 - 70만 원 = 30만 원이에요.","ref":"사회 61쪽"},{"id":"soc2a-06","type":"ox","q":"중고 물품을 거래하는 온라인 쇼핑몰이나 주식을 사고파는 거래소도 시장이라고 할 수 있습니다.","answer":true,"exp":"장소와 상관없이 거래가 이루어지는 곳은 모두 시장이라고 할 수 있어요.","ref":"사회 61쪽"},{"id":"soc2a-07","type":"mc","q":"시장에서 상품의 가격은 무엇에 따라 정해지나요?","choices":["정부가 정해 준 가격표","가게 주인이 마음대로 정한 값","사람들이 필요로 하는 상품의 양과 기업에서 제공하는 상품의 양","상품을 만든 공장의 크기"],"answer":2,"exp":"시장에서는 사람들이 필요로 하는 상품의 양과 기업에서 제공하는 상품의 양에 따라 가격이 정해져요.","ref":"사회 62쪽"},{"id":"soc2a-08","type":"input","q":"시장에서 가계와 기업이 자유롭게 경쟁하며 경제활동을 하는 방식을 무엇이라고 하나요?","hint":"초성 힌트: ㅅㅈㄱㅈ","answer":["시장경제"],"exp":"우리나라에서는 시장경제의 특징에 따라 가계와 기업이 시장에서 만나 자유롭게 경쟁하며 경제활동을 해요.","ref":"사회 62쪽"},{"id":"soc2a-09","type":"mc","q":"가계의 합리적인 소비로 알맞은 것은 무엇인가요?","choices":["소득을 고려하여 적은 비용으로 가장 큰 만족을 얻을 수 있는 소비를 한다","가격과 상관없이 가장 비싼 물건을 산다","광고에 나온 물건은 무조건 바로 산다","필요 없어도 할인하는 물건은 많이 사 둔다"],"answer":0,"exp":"가계는 소득을 고려하여 적은 비용으로 가장 큰 만족을 얻을 수 있는 소비를 하려고 노력해요. 기준을 세워 비교하면 합리적으로 선택할 수 있어요.","ref":"사회 63~64쪽"},{"id":"soc2a-10","type":"ox","q":"기업은 가계의 생산 활동에 참여하고 그에 대한 대가로 소득을 얻습니다.","answer":false,"exp":"가계가 기업의 생산 활동에 참여하고 그 대가로 소득을 얻어요. 기업은 물건이나 서비스를 생산·판매하여 이윤을 얻어요.","ref":"사회 63, 67, 77쪽"},{"id":"soc2a-11","type":"mc","q":"기업이 더 많은 이윤을 얻으려고 하는 노력으로 알맞지 않은 것은 무엇인가요?","choices":["생산 시설에 투자하여 생산량을 늘린다","생산 비용을 줄일 방법을 찾는다","판매량을 늘릴 방법을 찾는다","근로자에게 급여를 지급하지 않는다"],"answer":3,"exp":"기업은 생산 시설 투자, 생산 비용 줄이기, 판매량 늘리기 등으로 이윤을 늘리려 노력하고, 이는 나라 경제 발전에 도움이 돼요. 기업은 고용한 근로자에게 급여를 지급해요.","ref":"사회 65~66쪽"},{"id":"soc2a-12","type":"mc","q":"「근로 기준법」에서 보장하는, 휴가 기간에도 급여가 지급되는 휴가를 무엇이라고 하나요?","choices":["무급 휴가","유급 휴가","최저 임금","단체 행동"],"answer":1,"exp":"유급 휴가는 휴가 기간에도 급여가 지급되는 휴가예요. 우리나라는 최저 임금 제도, 육아 휴직 제도 등 여러 제도로도 근로자의 권리를 보호해요.","ref":"사회 69, 71쪽"},{"id":"soc2a-13","type":"ox","q":"근로자는 근로 조건이나 근로 환경 등에 관해 기업과 협의할 수 없습니다.","answer":false,"exp":"근로자는 근로 조건이나 근로 환경 등에 관해 기업과 협의할 수 있어요.","ref":"사회 71쪽"},{"id":"soc2a-14","type":"mc","q":"근로자의 권리에 대한 설명으로 알맞지 않은 것은 무엇인가요?","choices":["더 나은 근로 조건을 만들기 위해 단체를 만들거나 단체에 가입할 수 있다","근로 조건이나 근로 환경 등에 관해 기업과 협의할 수 있다","기업이 정한 근로 조건에 대해 의견을 낼 수 없다","정당한 권리를 주장하며 다른 근로자들과 함께 단체로 행동할 수 있다"],"answer":2,"exp":"근로자는 단체를 만들거나 가입할 수 있고, 기업과 협의할 수 있으며, 단체로 행동할 수 있어요. 근로자와 기업은 서로 의존하는 관계라 근로자의 권리를 보호하는 것이 중요해요.","ref":"사회 70~71쪽"},{"id":"soc2a-15","type":"mc","q":"우리나라에서 기업의 자유를 보장하고 있는 법은 무엇인가요?","choices":["헌법","근로 기준법","도로 교통법","저작권법"],"answer":0,"exp":"우리나라는 헌법에서 기업의 자유를 보장하고 있어요. 그래서 기업을 설립해 다른 기업과 자유롭게 경쟁하며 경제활동에 참여할 수 있어요.","ref":"사회 72쪽"},{"id":"soc2a-16","type":"ox","q":"우리나라에서 기업은 어떤 상품을 얼마나 생산할지 자유롭게 결정할 수 없습니다.","answer":false,"exp":"기업은 더 많은 이윤을 얻으려고 어떤 상품을 얼마나 생산할지 자유롭게 결정할 수 있어요. 이때 적은 비용으로 큰 이윤을 얻도록 합리적으로 결정하려고 노력해요.","ref":"사회 73, 77쪽"},{"id":"soc2a-17","type":"mc","q":"기업이 경제활동을 하면서 발생할 수 있는 문제로 알맞지 않은 것은 무엇인가요?","choices":["제품을 생산하는 과정에서 환경을 오염한다","일부 회사들끼리 약속해서 함께 가격을 올린다","소비자에게 잘못된 정보를 제공한다","다른 기업과 공정하게 경쟁하며 좋은 일자리를 만든다"],"answer":3,"exp":"환경 오염, 회사끼리 약속해 가격 올리기, 잘못된 정보 제공, 다른 기업의 사업 방해 등은 기업 활동에서 생길 수 있는 문제예요. 공정한 경쟁은 기업이 지켜야 할 바람직한 모습이에요.","ref":"사회 74~75쪽"},{"id":"soc2a-18","type":"mc","q":"기업이 사회적 책임을 다하는 모습으로 알맞은 것은 무엇인가요?","choices":["다른 기업의 사업을 방해한다","지구의 날에 나무 심기 캠페인을 한다","제품의 문제점을 숨기고 광고한다","공장의 폐기물을 몰래 강에 버린다"],"answer":1,"exp":"기업의 경제활동은 사회에 큰 영향을 미치므로 환경 보존에 관심을 기울이고 공정하게 경쟁하는 등 사회적 책임을 다해야 해요. 지구의 날 나무 심기 캠페인이 그 예예요.","ref":"사회 75쪽"},{"id":"soc2a-19","type":"mc","q":"기업이 중요하게 여기는 ‘환경’, ‘사회’, ‘투명 경영’ 가운데 ‘투명 경영’을 위한 노력으로 알맞은 것은 무엇인가요?","choices":["공장 지붕에 태양광 패널을 설치해 친환경 에너지 사용을 늘린다","직원들이 벽화 작업을 하며 지역을 아름답게 가꾼다","시장에서 공정하게 경쟁하며 윤리적으로 기업을 운영한다","폐기물을 적극적으로 관리한다"],"answer":2,"exp":"투명 경영은 공정한 경쟁, 윤리적인 운영, 근로자와의 적극적인 의사소통으로 기업의 신뢰도를 높이는 거예요. 태양광 패널과 폐기물 관리는 ‘환경’, 벽화 작업은 ‘사회’를 위한 노력이에요.","ref":"사회 76쪽"},{"id":"soc2a-20","type":"input","q":"빈칸에 들어갈 알맞은 말을 쓰세요.\n기업의 경제활동은 사회에 큰 영향을 미치므로 사회에 대한 (          )을/를 가져야 합니다.","hint":"초성 힌트: ㅊㅇㄱ","answer":["책임감"],"exp":"기업이 사회에 대한 책임감을 갖고 사회적 책임을 다하면 경제가 성장하고 사회가 발전해요.","ref":"사회 75쪽"}]},"soc2b":{"title":"경제성장과 우리 생활","questions":[{"id":"soc2b-01","type":"input","q":"국가의 전체적인 생산 수준이나 국민 소득이 증가하여 경제 규모가 커지는 것을 무엇이라고 하나요?","hint":"초성 힌트: ㄱㅈㅅㅈ","answer":["경제성장"],"exp":"국가의 전체적인 생산 수준이나 국민 소득이 증가하여 경제 규모가 커지는 것을 경제성장이라고 해요.","ref":"사회 79쪽"},{"id":"soc2b-02","type":"mc","q":"‘1인당 국민 총소득’의 뜻으로 알맞은 것은 무엇인가요?","choices":["한 나라에서 가장 소득이 많은 사람의 소득","한 가계가 일 년 동안 쓴 돈의 합계","한 기업이 일 년 동안 얻은 이윤","한 나라의 국민이 일정 기간 국내외 생산 활동에 참여한 대가로 받은 소득의 합계를 인구수로 나눈 금액"],"answer":3,"exp":"1인당 국민 총소득은 국민이 일정 기간 국내외 생산 활동에 참여한 대가로 받은 소득의 합계를 인구수로 나눈 금액으로, 경제성장을 살펴볼 때 활용해요.","ref":"사회 79쪽"},{"id":"soc2b-03","type":"mc","q":"6·25 전쟁 이후 자본이나 자원이 거의 없는 상태에서 이루어 낸 우리나라의 빠른 경제성장을 세계는 무엇이라고 불렀나요?","choices":["낙동강의 기적","한강의 기적","한라산의 기적","남산의 기적"],"answer":1,"exp":"산업 시설이 폐허가 되고 자본과 자원도 거의 없는 상태에서 이룬 빠른 경제성장을 세계는 ‘한강의 기적’이라고 불렀어요.","ref":"사회 80쪽"},{"id":"soc2b-04","type":"mc","q":"우리나라가 빠른 경제성장을 이루기 전에 경제적으로 어려운 시기를 보낸 까닭으로 알맞은 것은 무엇인가요?","choices":["서울 올림픽 대회를 개최해서","경제 협력 개발 기구(OECD)에 가입해서","일제의 식민 통치와 6·25 전쟁을 겪어서","문화 콘텐츠 수출이 늘어나서"],"answer":2,"exp":"우리나라는 일제의 식민 통치와 6·25 전쟁을 겪으며 경제적으로 어려운 시기를 보냈어요. 이후 가계, 기업, 정부가 함께 노력해 빠르게 성장했어요.","ref":"사회 80쪽"},{"id":"soc2b-05","type":"mc","q":"1960년대 우리나라 경제의 모습으로 알맞은 것은 무엇인가요?","choices":["경제 개발 5개년 계획을 추진해 경공업 제품을 수출했다","중화학 공업이 발달하며 경제가 빠르게 성장하기 시작했다","제24회 서울 올림픽 대회를 개최했다","경제 협력 개발 기구(OECD)에 29번째로 가입했다"],"answer":0,"exp":"1960년대에는 경제 개발 5개년 계획을 추진해 경공업 제품을 수출했어요. 중화학 공업 발달은 1970년대, 서울 올림픽은 1988년, OECD 가입은 1996년이에요.","ref":"사회 80쪽"},{"id":"soc2b-06","type":"mc","q":"우리나라의 경제성장 과정을 일어난 순서대로 바르게 나열한 것은 무엇인가요?","choices":["중화학 공업 발달 → 경공업 제품 수출 → OECD 가입 → 서울 올림픽 개최","서울 올림픽 개최 → 경공업 제품 수출 → 중화학 공업 발달 → OECD 가입","경공업 제품 수출 → OECD 가입 → 중화학 공업 발달 → 서울 올림픽 개최","경공업 제품 수출 → 중화학 공업 발달 → 서울 올림픽 개최 → OECD 가입"],"answer":3,"exp":"1960년대 경공업 제품 수출 → 1970년대 중화학 공업 발달 → 1988년 서울 올림픽 개최 → 1996년 OECD 가입 순서예요.","ref":"사회 80쪽"},{"id":"soc2b-07","type":"ox","q":"우리나라는 1996년 12월 경제 협력 개발 기구(OECD)에 세계에서 29번째로 가입하며 선진국으로 인정받게 되었습니다.","answer":true,"exp":"1988년 서울 올림픽으로 선진국에 진입하는 계기를 마련했고, 1996년 12월 OECD에 세계에서 29번째로 가입하며 선진국으로 인정받았어요.","ref":"사회 80쪽"},{"id":"soc2b-08","type":"ox","q":"우리나라는 가계와 기업, 정부가 함께 노력하여 빠른 경제성장을 이루었습니다.","answer":true,"exp":"우리나라는 가계와 기업, 정부가 함께 노력하여 세계에서 손꼽힐 만큼 빠른 경제성장을 이루었어요.","ref":"사회 80쪽"},{"id":"soc2b-09","type":"mc","q":"이야기, 영상, 음악, 미술 작품 등 새로운 콘텐츠를 만들어 내는 인공지능을 무엇이라고 하나요?","choices":["자율 주행","생성형 인공지능","로봇 자동화","드론"],"answer":1,"exp":"생성형 인공지능은 새로운 콘텐츠를 생성하는 인공지능이에요. 경제성장에 따라 첨단 기술이 발전하면서 생산 속도가 빨라지고 생산량이 늘어났어요.","ref":"사회 81쪽"},{"id":"soc2b-10","type":"mc","q":"콘텐츠 산업에 포함되는 부문이 아닌 것은 무엇인가요?","choices":["게임","애니메이션","철강","캐릭터"],"answer":2,"exp":"콘텐츠 산업은 게임, 영화, 방송, 출판, 만화, 음악, 애니메이션, 광고, 캐릭터 등을 포함해요. 철강은 우리나라가 세계적인 경쟁력을 갖춘 제조 분야예요.","ref":"사회 80, 82쪽"},{"id":"soc2b-11","type":"ox","q":"콘텐츠 수출이 증가하면 화장품, 식품 등의 수출은 줄어드는 것으로 분석되었습니다.","answer":false,"exp":"콘텐츠 수출이 증가할 때 화장품, 식품 등의 수출도 함께 증가하는 것으로 분석됐어요. 2022년 콘텐츠 산업 수출액은 132억 4,000만 달러로 역대 최고치였어요.","ref":"사회 82쪽"},{"id":"soc2b-12","type":"mc","q":"교육에 인공지능, 빅데이터 등의 첨단 기술을 적용해 교육 서비스를 개선하거나 새로운 서비스를 제공하는 교육을 무엇이라고 하나요?","choices":["에듀 테크","자율 주행","생성형 인공지능","로봇 자동화"],"answer":0,"exp":"에듀 테크는 교육에 첨단 기술을 적용한 교육이에요. 경제가 성장하면서 교육의 질이 높아지고 수준 높은 의료 혜택도 받을 수 있게 됐어요.","ref":"사회 83쪽"},{"id":"soc2b-13","type":"mc","q":"경제성장이 우리 생활에 미친 영향으로 알맞지 않은 것은 무엇인가요?","choices":["의료 기술이 발달하면서 기대 수명이 늘어났다","새로운 일자리가 많이 생기고 국민의 소득이 증가했다","교육의 질이 높아졌다","사람들의 삶의 질이 낮아졌다"],"answer":3,"exp":"경제가 성장하면 새로운 일자리와 소득이 늘고, 교육의 질과 의료 혜택이 좋아져 사람들의 삶의 질이 높아져요.","ref":"사회 82~83쪽"},{"id":"soc2b-14","type":"input","q":"빈칸에 들어갈 알맞은 말을 쓰세요.\n경제성장에 따라 사람들의 생활이 풍족해지면서 (          )와/과 관련한 산업이 발달했습니다.","hint":"초성 힌트: ㅁㅎ","answer":["문화"],"exp":"경제가 성장해 생활이 풍족해지면서 영화, 음악, 방송, 만화 같은 문화와 관련한 산업이 발달했어요.","ref":"사회 82~83쪽"},{"id":"soc2b-15","type":"mc","q":"빠른 경제성장 과정에서 자연의 무분별한 개발, 오염 물질과 쓰레기 증가 때문에 생긴 문제는 무엇인가요?","choices":["과소비 문제","환경 문제","노사 갈등 문제","빈부 격차 문제"],"answer":1,"exp":"자연의 무분별한 개발, 산업 시설과 가정에서 배출하는 오염 물질과 쓰레기가 늘어나 환경 문제가 발생했어요.","ref":"사회 85, 87쪽"},{"id":"soc2b-16","type":"mc","q":"‘빈부 격차’의 뜻으로 알맞은 것은 무엇인가요?","choices":["필요한 것보다 더 많은 돈을 쓰는 것","임금을 두고 근로자와 기업 사이에 갈등이 생기는 것","경제적으로 부유한 사람과 가난한 사람의 소득 차이가 커지는 것","나라 전체의 생산 수준이 높아지는 것"],"answer":2,"exp":"빈부 격차는 경제적으로 부유한 사람과 가난한 사람의 소득 차이가 커지는 것으로, 경제가 성장하며 사람들의 소득에 차이가 생기면서 나타났어요.","ref":"사회 86쪽"},{"id":"soc2b-17","type":"mc","q":"‘상대적 빈곤율’에 대한 설명으로 알맞은 것은 무엇인가요?","choices":["전체 인구 중 빈곤 위험에 처한 인구의 비율로, 높을수록 빈부 격차가 크다는 뜻이다","높을수록 빈부 격차가 작다는 뜻이다","한 나라의 1인당 국민 총소득을 나타낸다","높을수록 경제가 더 쉽게 성장한다"],"answer":0,"exp":"상대적 빈곤율은 전체 인구 중 빈곤 위험에 처한 인구 비율이에요. 높으면 빈부 격차가 크고 경제성장이 어려워지므로 줄여야 해요. 우리나라는 OECD 국가 중 높은 편이에요.","ref":"사회 86쪽"},{"id":"soc2b-18","type":"mc","q":"경제성장으로 소득이 늘어나면서 나타난, 필요한 것보다 더 많은 돈을 쓰는 문제를 무엇이라고 하나요?","choices":["노사 갈등","빈부 격차","공유지의 비극","과소비"],"answer":3,"exp":"과소비는 필요한 것보다 더 많은 돈을 쓰는 문제예요. 임금이나 복지 혜택을 두고 근로자와 기업 간에 생기는 갈등은 노사 갈등이에요.","ref":"사회 87쪽"},{"id":"soc2b-19","type":"ox","q":"빠른 경제성장으로 발생한 여러 가지 문제를 해결하지 않아도 경제는 지속적으로 성장할 수 있습니다.","answer":false,"exp":"문제를 해결하지 않으면 경제는 지속적으로 성장하기 어려워요. 그래서 정부는 제도와 정책을 만들고, 기업과 근로자는 소통하며, 시민 단체와 개인도 함께 노력해요.","ref":"사회 88, 91쪽"},{"id":"soc2b-20","type":"mc","q":"다음 이야기와 같은 현상을 무엇이라고 하나요?","ctx":"마을 사람들이 함께 쓰는 공동 어장에서 각자 자기 이익만 생각하며 물고기를 더 많이 잡았더니, 몇 달 뒤 물고기가 하나도 남지 않게 되었습니다.","choices":["한강의 기적","공유지의 비극","빈부 격차","합리적 소비"],"answer":1,"exp":"공유하는 자원을 자신의 이익만 생각하며 사용하여 결국 공동체 전체가 피해를 보는 현상을 공유지의 비극이라고 해요. 자원을 소중히 여기고 공동의 이익을 추구하는 태도가 필요해요.","ref":"사회 92쪽"}]}},"signs":[{"pool":"soc1a","title":"지형 경관과 생활","text":"세계에는 산지·하천·해안·사막 등 다양한 지형이 있어요. 지형 경관은 그곳 사람들의 생활 모습에 영향을 줘요."},{"pool":"soc1a","title":"산지에서의 생활","text":"가파른 곳은 계단식 농사, 평탄한 고원은 가축 기르기, 지하자원이 많으면 광업, 화산과 아름다운 경관은 관광지!"},{"pool":"soc1a","title":"하천과 해안의 생활","text":"하천: 어업·대규모 농사·수력 발전·수상 시장 / 해안: 어업·양식업, 항구, 관광지, 넓은 갯벌에는 염전"},{"pool":"soc1b","title":"세계의 기후 순서","text":"적도 → 극지방: 열대·건조·온대·냉대·한대 기후! 매우 높은 산지는 고산 기후. 구분 기준은 기온과 강수량이에요."},{"pool":"soc1b","title":"열대 기후","text":"일 년 내내 덥고 기온 변화가 거의 없어요. 열대 우림 또는 초원(건기·우기), 화전 농업, 바닥을 띄운 집, 향신료 음식"},{"pool":"soc1b","title":"건조 기후","text":"강수량이 적고 낮과 밤의 기온 차이가 커요. 사막: 흙벽돌집·온몸 감싸는 옷 / 초원: 유목·이동식 가옥 / 오아시스: 대추야자"},{"pool":"soc1c","title":"온대 기후 3가지","text":"서부 유럽: 여름 서늘·연중 고른 비(밀·낙농업) / 지중해: 여름 덥고 건조(올리브·포도) / 아시아: 여름에 비 많음(벼농사)"},{"pool":"soc1c","title":"냉대·한대 기후","text":"냉대: 겨울이 길고 몹시 추움, 침엽수림 → 목재·펄프, 통나무집 / 한대: 고위도 극지방, 순록 유목, 오로라·빙하 관광"},{"pool":"soc1c","title":"고산 기후","text":"해발 고도가 높은 곳(예: 에콰도르 키토)! 일 년 내내 서늘, 감자·옥수수, 알파카·라마, 챙 넓은 모자와 망토"},{"pool":"soc2a","title":"시장·가계·기업","text":"시장: 거래가 이루어지는 곳 / 가계: 생산 활동에 참여해 소득을 얻고 소비 / 기업: 이윤을 목적으로 생산·판매"},{"pool":"soc2a","title":"시장경제","text":"가계와 기업이 시장에서 자유롭게 경쟁하며 경제활동을 하는 방식. 가격은 필요로 하는 양과 제공되는 양에 따라 정해져요."},{"pool":"soc2a","title":"근로자와 기업","text":"근로자: 단체 만들기·기업과 협의·단체 행동(법과 제도로 보호) / 기업: 헌법이 자유를 보장, 사회적 책임도 다해야 해요."},{"pool":"soc2b","title":"한강의 기적","text":"1960년대 경공업 수출 → 1970년대 중화학 공업 → 1988 서울 올림픽 → 1996 OECD 가입(29번째)"},{"pool":"soc2b","title":"경제성장의 그늘","text":"환경 문제, 빈부 격차(상대적 빈곤율), 과소비, 노사 갈등 → 정부·기업·근로자·시민 단체·개인이 함께 해결해요."},{"pool":"soc2b","title":"공유지의 비극","text":"함께 쓰는 자원을 자기 이익만 생각하며 쓰면 결국 모두가 피해를 봐요. 자원을 아끼고 공동의 이익을 생각해요!"}]};</script>
<script>/* =====================================================================
   수학 6-2 (천재교과서) 1~4단원 문제
   - 교과서에 나온 문제(고정 문제)
   - 숫자를 바꿔 매번 새로 만드는 문제(자동 생성 문제)
   분수 표기: [[3/4]] = 4분의 3, [[2 1/3]] = 2와 3분의 1
   ===================================================================== */
window.MATH = (function () {
  'use strict';
  const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  const shuffled = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a; };
  const lcm = (a, b) => a / gcd(a, b) * b;
  function F(n, d) { if (d < 0) { n = -n; d = -d; } const g = gcd(n, d) || 1; return { n: n / g, d: d / g }; }
  const fdiv = (a, b) => F(a.n * b.d, a.d * b.n);
  const fmul = (a, b) => F(a.n * b.n, a.d * b.d);
  const fadd = (a, b) => F(a.n * b.d + b.n * a.d, a.d * b.d);
  function fs(f) { // 기약분수, 가분수는 대분수로
    if (f.d === 1) return String(f.n);
    if (f.n > f.d) { const w = Math.floor(f.n / f.d); return `[[${w} ${f.n - w * f.d}/${f.d}]]`; }
    return `[[${f.n}/${f.d}]]`;
  }
  const fr = (n, d) => `[[${n}/${d}]]`;
  const mx = (w, n, d) => `[[${w} ${n}/${d}]]`;
  function fmtD(v, s) { // 정수 v를 s(10, 100…)로 나눈 소수 문자열
    const neg = v < 0; v = Math.abs(v);
    const ip = Math.floor(v / s), fp = v - ip * s;
    if (!fp) return (neg ? '-' : '') + ip;
    const digits = String(s).length - 1;
    return (neg ? '-' : '') + ip + '.' + String(fp).padStart(digits, '0').replace(/0+$/, '');
  }
  // 받침에 따른 조사: 숫자·분수·한글 끝소리를 보고 고른다
  function lastSound(x) {
    const t = String(x).replace(/<[^>]*>/g, '').trim();
    const fm = t.match(/\[\[(?:\d+ )?(\d+)\/\d+\]\]$/);
    const ch = fm ? fm[1].slice(-1) : t.slice(-1);
    if (/[0-9]/.test(ch)) return { batchim: '013678'.includes(ch), rieul: '178'.includes(ch) };
    const c = ch.charCodeAt(0);
    if (c >= 0xac00 && c <= 0xd7a3) { const j = (c - 0xac00) % 28; return { batchim: j !== 0, rieul: j === 8 }; }
    return { batchim: false, rieul: false };
  }
  const iy = (x) => x + (lastSound(x).batchim ? '이에요' : '예요');
  const ro = (x) => { const s = lastSound(x); return x + (s.batchim && !s.rieul ? '으로' : '로'); };
  const eul = (x) => x + (lastSound(x).batchim ? '을' : '를');
  const sum = (h) => h.flat().reduce((a, b) => a + b, 0);
  const cells = (h) => h.flat().filter((v) => v > 0).length;
  let uid = 0;
  const gid = (p) => `g-${p}-${Date.now().toString(36)}${(uid++).toString(36)}`;

  function mcQ(pool, q, correct, wrongs, exp, ref, ctx) {
    const out = [];
    for (const w of wrongs) { if (w != null && w !== correct && !out.includes(w)) out.push(w); if (out.length === 3) break; }
    if (out.length < 3) return null;
    const o = { id: gid(pool), gen: true, type: 'mc', q, choices: [correct, ...out], answer: 0, exp, ref };
    if (ctx) o.ctx = ctx;
    return o;
  }
  function uniqNums(ans, list) {
    const out = [];
    for (const v of shuffled(list)) { if (Number.isInteger(v) && v > 0 && v !== ans && !out.includes(v)) out.push(v); }
    for (let k = 1; out.length < 3 && k < 20; k++) { for (const v of [ans + k, ans - k]) if (v > 0 && v !== ans && !out.includes(v) && out.length < 3) out.push(v); }
    return out.slice(0, 3);
  }
  function fw(ans, cands) { // 분수 오답 후보
    const seen = new Set([fs(ans)]), out = [];
    const add = (f) => { if (!f || !(f.n > 0) || !(f.d > 0)) return; const s = fs(f); if (!seen.has(s)) { seen.add(s); out.push(s); } };
    shuffled(cands).forEach(add);
    for (let k = 1; out.length < 3 && k < 30; k++) { add(F(ans.n + k * ans.d, ans.d)); add(F(ans.n + k, ans.d)); add(F(ans.n, ans.d + k)); }
    return out.slice(0, 3);
  }
  const coprime = (lo, hi, d) => { let a; do { a = ri(lo, hi); } while (gcd(a, d) !== 1); return a; };

  function g1Same() {
    const n = ri(5, 13); let a = ri(2, n - 1), b = ri(1, n - 1); if (a === b) b = a > 1 ? a - 1 : a + 1;
    const ans = F(a, b);
    return mcQ('math1', `${fr(a, n)} ÷ ${fr(b, n)}의 값은 무엇인가요?`, fs(ans),
      fw(ans, [F(a * b, n * n), F(b, a), F(Math.abs(a - b) || 1, n), F(a, b * n), F(a + b, n)]),
      `분모가 같은 분수끼리의 나눗셈은 분자끼리 나누면 돼요. ${fr(a, n)} ÷ ${fr(b, n)} = ${a} ÷ ${b} = ${fs(ans)}`, '수학 14~17쪽');
  }
  function g1Diff() {
    let b, d; do { b = ri(2, 9); d = ri(2, 9); } while (b === d);
    const a = coprime(1, b - 1, b), c = coprime(1, d - 1, d);
    const A = F(a, b), C = F(c, d), ans = fdiv(A, C), step = fr(a * d, b * c);
    return mcQ('math1', `${fr(a, b)} ÷ ${fr(c, d)}의 값은 무엇인가요?`, fs(ans),
      fw(ans, [fmul(A, C), fdiv(C, A), F(a * c, b * d + 1), F(a * d, b * c * 2), F(a * d + b * c, b * c)]),
      `나누는 분수의 분모와 분자를 바꾸어 곱해요. ${fr(a, b)} ÷ ${fr(c, d)} = ${fr(a, b)} × ${fr(d, c)} = ${step}${fs(ans) !== step ? ' = ' + fs(ans) : ''}`, '수학 18~19·24~25쪽');
  }
  function g1NatUnit() {
    const n = ri(2, 9), k = ri(2, 9), ans = n * k;
    const wr = uniqNums(ans, [n + k, n * k + k, (n + 1) * k, n * (k + 1)]).map(String).slice(0, 2);
    wr.push(fs(F(n, k)));
    return mcQ('math1', `${n} ÷ ${fr(1, k)}의 값은 무엇인가요?`, String(ans), shuffled(wr),
      `${n}에는 ${fr(1, k)}이 ${n} × ${k} = ${ans}번 들어가요. (자연수) ÷ (단위분수)는 자연수에 단위분수의 분모를 곱하면 돼요.`, '수학 20~21쪽');
  }
  function g1NatFrac() {
    const c = ri(3, 9), b = coprime(2, c - 1, c), n = ri(2, 12), ans = F(n * c, b);
    return mcQ('math1', `${n} ÷ ${fr(b, c)}의 값은 무엇인가요?`, fs(ans),
      fw(ans, [F(n * b, c), F(n * c, 1), F(c, n * b), F(n, b * c), F(n * c + b, b)]),
      `${n} ÷ ${fr(b, c)} = ${n} × ${fr(c, b)} = ${fr(n * c, b)}${fs(ans) !== fr(n * c, b) ? ' = ' + fs(ans) : ''}`, '수학 22~23쪽');
  }
  function g1Mixed() {
    const b = ri(2, 5), a = coprime(1, b - 1, b), d = ri(2, 5), c = coprime(1, d - 1, d);
    const w1 = ri(1, 3), w2 = ri(1, 2);
    const A = F(w1 * b + a, b), C = F(w2 * d + c, d), ans = fdiv(A, C);
    const wrongWay = fadd(F(w1, w2), fdiv(F(a, b), F(c, d)));
    return mcQ('math1', `${mx(w1, a, b)} ÷ ${mx(w2, c, d)}의 값은 무엇인가요?`, fs(ans),
      fw(ans, [fmul(A, C), fdiv(C, A), wrongWay, F(w1 * a, w2 * c)]),
      `대분수를 가분수로 바꾸어 계산해요. ${mx(w1, a, b)} ÷ ${mx(w2, c, d)} = ${fr(A.n, A.d)} ÷ ${fr(C.n, C.d)} = ${fr(A.n, A.d)} × ${fr(C.d, C.n)} = ${fs(ans)}`, '수학 26~27쪽');
  }
  function g1Word() {
    const t = ri(0, 3);
    if (t === 0) {
      const d = ri(3, 9), c = coprime(1, d - 1, d), k = ri(3, 9), total = F(c * k, d);
      return mcQ('math1', `리본 ${fs(total)} m를 한 도막에 ${fr(c, d)} m씩 자르면 모두 몇 도막이 되나요?`, k + '도막',
        uniqNums(k, [k + 1, k - 1, k * 2, c * k]).map((x) => x + '도막'),
        `${fs(total)} ÷ ${fr(c, d)} = ${fr(c * k, d)} ÷ ${fr(c, d)} = ${c * k} ÷ ${c} = ${k}(도막)`, '수학 14~15쪽');
    }
    if (t === 1) {
      const b = ri(2, 6), a = coprime(1, b - 1, b), d = ri(2, 9), c = coprime(1, d - 1, d);
      const ans = fdiv(F(c, d), F(a, b));
      return mcQ('math1', `민서가 ${fr(a, b)}시간 동안 ${fr(c, d)} km를 걸었습니다. 같은 빠르기로 1시간 동안 걸을 수 있는 거리는 몇 km인가요?`, fs(ans) + ' km',
        fw(ans, [fmul(F(c, d), F(a, b)), fdiv(F(a, b), F(c, d)), F(c * a, d)]).map((s) => s + ' km'),
        `(1시간 동안 간 거리) = (간 거리) ÷ (걸린 시간) = ${fr(c, d)} ÷ ${fr(a, b)} = ${fr(c, d)} × ${fr(b, a)} = ${fs(ans)} (km)`, '수학 24~25쪽');
    }
    if (t === 2) {
      const b = ri(2, 9), a = coprime(1, b - 1, b), d = ri(2, 9), c = coprime(1, d - 1, d);
      const ans = fdiv(F(c, d), F(a, b));
      return mcQ('math1', `넓이가 ${fr(c, d)} m²인 직사각형 모양 화단의 가로가 ${fr(a, b)} m입니다. 세로는 몇 m인가요?`, fs(ans) + ' m',
        fw(ans, [fmul(F(c, d), F(a, b)), fdiv(F(a, b), F(c, d)), F(c + a, d + b)]).map((s) => s + ' m'),
        `(세로) = (넓이) ÷ (가로) = ${fr(c, d)} ÷ ${fr(a, b)} = ${fr(c, d)} × ${fr(b, a)} = ${fs(ans)} (m)`, '수학 26·33쪽');
    }
    const den = ri(5, 12); let x, y; do { x = ri(1, den - 1); y = ri(1, den - 1); } while (x === y);
    const ans = F(x, y);
    return mcQ('math1', `재활용 종이를 지수는 ${fr(x, den)} kg, 현우는 ${fr(y, den)} kg 모았습니다. 지수가 모은 양은 현우가 모은 양의 몇 배인가요?`, fs(ans) + '배',
      fw(ans, [F(y, x), F(x * y, den * den), F(Math.abs(x - y), den)]).map((s) => s + '배'),
      `${fr(x, den)} ÷ ${fr(y, den)} = ${x} ÷ ${y} = ${fs(ans)}(배)`, '수학 17쪽');
  }

  function validGrid(h) {
    const R = h.length, C = h[0].length;
    for (let r = 0; r < R; r++) if (!h[r].some((v) => v > 0)) return false;
    for (let c = 0; c < C; c++) if (!h.some((row) => row[c] > 0)) return false;

    for (const q of QUESTS) { const x = (q.npc.x + 0.5) * scale, y = (q.npc.y + 0.5) * scale, done = st && st.badges[q.id]; g.beginPath(); g.arc(x, y, big ? 7 : 4.5, 0, 7); g.fillStyle = done ? '#18a88f' : '#ffc23d'; g.fill(); g.lineWidth = big ? 2 : 1.4; g.strokeStyle = OUT; g.stroke(); if (big) { g.font = '13px Jua, sans-serif'; g.fillStyle = OUT; g.textAlign = 'center'; g.fillText(q.npc.name, x, y - 11); } }
    const gx = 40 * scale, gy = 23 * scale; g.fillStyle = '#ff6b4a'; g.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + (i * Math.PI) / 5, r = i % 2 ? (big ? 4 : 2.6) : big ? 9 : 6; g.lineTo(gx + Math.cos(a) * r, gy + Math.sin(a) * r); } g.closePath(); g.fill(); g.strokeStyle = OUT; g.lineWidth = 1.2; g.stroke();
    if (mode === 'play') { const px = (player.x / TS) * scale, py = (player.y / TS) * scale; g.beginPath(); g.arc(px, py, big ? 8 : 5 + Math.sin(t * 6), 0, 7); g.fillStyle = '#e2434b'; g.fill(); g.lineWidth = 2; g.strokeStyle = '#fff'; g.stroke(); }
    if (!big) { g.strokeStyle = 'rgba(255,255,255,.9)'; g.lineWidth = 1.5; g.strokeRect((cam.x / TS) * scale, (cam.y / TS) * scale, (vw / cam.z / TS) * scale, (vh / cam.z / TS) * scale); }
    if (big) { g.font = '18px Jua, sans-serif'; g.textAlign = 'center'; g.lineWidth = 4; for (const zn of ZONES) { g.strokeStyle = '#fff'; g.strokeText(zn.name, zn.cx * scale, zn.cy * scale); g.fillStyle = OUT; g.fillText(zn.name, zn.cx * scale, zn.cy * scale); } }
  }

  /* ===================== 상호작용 ===================== */
  function interact(th) {
    if (!th || busy()) return;
    Snd.init(); Snd.play('talk');
    face(th);
    if (th.type === 'npc') { const n = th.npc; if (n.quest) talkQuest(QMAP[n.quest]); else if (n.role === 'principal') talkPrincipal(); else if (n.role === 'shop') openShop(); }
    else if (th.type === 'chest') openChest(th);
    else if (th.type === 'sign') readSign(th);
    else if (th.type === 'gate') talkGate();
    else if (th.type === 'board') openRank();
  }
  function face(th) { const dx = (th.x + 0.5) * TS - player.x, dy = (th.y + 0.6) * TS - player.y; setDir(dx, dy); }

  function talkQuest(q) {
    const done = st.badges[q.id], qs = st.quests[q.id];
    if (!done) {
      const lines = q.intro.slice();
      if (qs && qs.tries) lines.splice(0, 1, `다시 왔구나! 지난번엔 ${qs.best}문제 맞혔어. 이번엔 꼭 통과해 보자!`);
      lines[lines.length - 1] += `<span class="dnote">${BOOK}참고할 교과서: <b>${q.pages}</b></span>`;
      Dlg.open(q.npc, lines, { buttons: [{ label: '나중에', cls: 'ghost' }, { label: `도전하기 (${CFG.QUESTIONS_PER_QUEST}문제)`, cls: 'primary', fn: () => startQuest(q, false) }] });
    } else {
      Dlg.open(q.npc, [q.win[0], `복습하고 싶으면 언제든 다시 풀어도 좋아. 복습할 때는 맞힐 때마다 코인 2개를 줄게!<span class="dnote">${BOOK}참고할 교과서: <b>${q.pages}</b></span>`], { buttons: [{ label: '닫기', cls: 'ghost' }, { label: '복습하기', cls: 'sun', fn: () => startQuest(q, true) }] });
    }
  }
  function talkPrincipal() {
    const n = PRINCIPAL;
    if (!st.met) {
      st.met = true; save();
      Dlg.open(n, [`지식의 섬에 온 걸 환영해요, ${esc(st.name)} 학생!`, '섬 곳곳의 선생님들이 <b>국어·수학·사회</b> 퀘스트를 내 줄 거예요. 머리 위에 노란 <b>!</b> 표시가 있는 사람에게 말을 걸어 보세요.', '퀘스트 13개를 통과해 메달을 모두 모으면 광장의 <b>졸업의 문</b>이 열려요.', ui.touch ? '왼쪽 아래 조이스틱으로 움직이고, 노란 버튼으로 말을 걸어요. 가고 싶은 곳을 눌러도 걸어가요.' : '방향키나 WASD로 움직이고, 스페이스바로 말을 걸어요. 가고 싶은 곳을 마우스로 눌러도 걸어가요.', '보물상자와 <b>지식 표지판</b>도 찾아보세요. 노란 화살표가 다음 목적지를 알려 줄 거예요. 그럼 출발!'], { buttons: [{ label: '출발!', cls: 'primary' }] });
      return;
    }
    const left = QUESTS.length - badgeCount();
    const lines = left ? [`지금까지 메달 ${badgeCount()}개를 모았네요. 앞으로 ${left}개 남았어요!`, '틀린 문제는 오른쪽 위 <b>오답</b> 노트에서 다시 풀 수 있어요. 시험 전에 꼭 복습하세요.'] : st.graduated ? ['졸업을 축하해요! 학사모가 정말 잘 어울리네요.', '복습은 계속할 수 있어요. 오답 노트도 한번 살펴보세요.'] : ['메달을 모두 모았군요! 광장의 <b>졸업의 문</b>으로 가 보세요.'];
    Dlg.open(n, lines, { buttons: [{ label: '고맙습니다', cls: 'primary' }] });
  }
  function talkGate() {
    const n = { name: '졸업의 문', look: null };
    if (badgeCount() < QUESTS.length) {
      const miss = QUESTS.filter((q) => !st.badges[q.id]).map((q) => q.npc.name);
      Dlg.open(n, [`굳게 잠긴 문이에요. 메달 ${QUESTS.length}개가 모두 있어야 열려요. (지금 ${badgeCount()}개)`, `아직 만나지 못한 선생님: ${miss.slice(0, 6).join(', ')}${miss.length > 6 ? ' 외 ' + (miss.length - 6) + '명' : ''}`], { buttons: [{ label: '닫기', cls: 'primary' }] });
      return;
    }
    Dlg.open(n, [st.graduated ? `다시 졸업 시험에 도전할 수 있어요. 최고 기록은 ${st.finalBest}점이에요.` : '메달 13개가 반짝이며 문이 열렸어요!', `<b>졸업 시험</b>: 국어·수학·사회 ${CFG.FINAL_QUESTIONS}문제 중 ${CFG.FINAL_PASS}문제 이상 맞히면 졸업장을 받아요.`], { buttons: [{ label: '나중에', cls: 'ghost' }, { label: '졸업 시험 시작', cls: 'primary', fn: startFinal }] });
  }

  /* ===================== 문제 뽑기 ===================== */
  function findQ(pool, id) { const P = POOLS[pool]; return P ? P.list.find((x) => x.id === id) || null : null; }
  function wq(w) { return w.q || findQ(w.pool, w.id); }
  function markSeen(pool, id) { const s = st.seen[pool] || (st.seen[pool] = []); if (!s.includes(id)) s.push(id); }
  function drawFrom(pool, n) {
    const P = POOLS[pool]; const out = [];
    const fixedN = P.gen ? Math.min(n, Math.max(1, Math.round(n * 0.4))) : n;
    const seen = new Set(st.seen[pool] || []);
    let fresh = shuffle(P.list.filter((q) => !seen.has(q.id)));
    if (fresh.length < fixedN) { st.seen[pool] = []; fresh = fresh.concat(shuffle(P.list.filter((q) => !fresh.includes(q)))); }
    for (const q of fresh.slice(0, fixedN)) out.push({ q, pool });
    if (P.gen) for (const q of window.MATH.make(pool, n - out.length)) out.push({ q, pool });
    return shuffle(out);
  }

  function startQuest(q, practice) {
    Quiz.start({ title: `${q.npc.name}의 퀘스트`, sub: `${q.unit} · ${q.title}`, look: q.npc.look, items: drawFrom(q.pool, CFG.QUESTIONS_PER_QUEST), coin: practice ? 2 : 10, questId: q.id, retry: () => startQuest(q, practice), onEnd: (ok, total, log) => endQuest(q, practice, ok, total, log) });
  }
  function endQuest(q, practice, ok, total, log) {
    const qs = st.quests[q.id] || (st.quests[q.id] = { tries: 0, best: 0 });
    qs.tries++; qs.best = Math.max(qs.best, ok);
    const pass = ok >= CFG.PASS_SCORE, first = pass && !st.badges[q.id];
    if (first) { st.badges[q.id] = true; today().m++; addCoins(30, false); Snd.play('badge'); confetti(); if (st.track === q.id) st.track = null; }
    API.send('quest', { quest: q.id, subj: q.subj, got: ok, of: total, pass, practice: !!practice, wrong: log.filter((l) => !l.ok).map((l) => ({ id: l.q.gen ? l.pool + ':자동' : l.q.id, t: plain(l.q.q).slice(0, 70) })) });
    save(); refreshHud();
    return { pass, first };
  }
  function startFinal() {
    const n = CFG.FINAL_QUESTIONS, per = Math.floor(n / 3), extra = n - per * 3, items = [];
    const subjects = shuffle(['국어', '수학', '사회']);
    subjects.forEach((s, i) => { const k = per + (i < extra ? 1 : 0); const pools = shuffle(SUBJ_POOLS[s]); for (let j = 0; j < k; j++) items.push(drawFrom(pools[j % pools.length], 1)[0]); });
    Quiz.start({ title: '졸업 시험', sub: `국어·수학·사회 ${n}문제 · ${CFG.FINAL_PASS}문제 이상 통과`, look: PRINCIPAL.look, items: shuffle(items), coin: 10, final: true, retry: startFinal, onEnd: (ok, total, log) => endFinal(ok, total, log) });
  }
  function endFinal(ok, total, log) {
    st.finalBest = Math.max(st.finalBest || 0, ok);
    const pass = ok >= CFG.FINAL_PASS, first = pass && !st.graduated;
    if (pass) { st.gradCount = (st.gradCount || 0) + 1; today().g++; } // 졸업 횟수: 졸업 시험에 통과할 때마다 1회
    if (first) {
      st.graduated = true; if (!st.owned.includes('grad')) st.owned.push('grad'); st.look.hat = 'grad';
      if (!st.pets.includes('owl')) st.pets.push('owl');
      if (!st.pet) { st.pet = 'owl'; resetPet(); }
      addCoins(100, false); Snd.play('badge'); confetti(); confetti();
    }
    API.send('final', { got: ok, of: total, pass, wrong: log.filter((l) => !l.ok).map((l) => ({ id: l.q.gen ? l.pool + ':자동' : l.q.id, t: plain(l.q.q).slice(0, 70) })) });
    save(); refreshHud();
    return { pass, first };
  }

  /* ===================== 퀴즈 ===================== */
  const Quiz = {
    start(cfg) { this.cfg = cfg; this.items = cfg.items; this.i = 0; this.ok = 0; this.log = []; this.done = false; openSheet('quiz'); this.render(); },
    render() {
      const it = this.items[this.i], q = it.q, n = this.items.length;
      if (q.type === 'mc' && !it.order) it.order = shuffle([0, 1, 2, 3]);
      this.answered = false;
      const dots = this.items.map((x, k) => `<i class="${k < this.log.length ? (this.log[k].ok ? 'ok' : 'no') : k === this.i ? 'on' : ''}"></i>`).join('');
      let body = `<div class="qnum">${POOLS[it.pool].subj} · 문제 ${this.i + 1} / ${n}</div>${q.ref ? `<div class="qref">${BOOK}<span>교과서 <b>${esc(q.ref)}</b></span></div>` : ''}<div class="qtext">${rich(q.q)}</div>`;
      if (q.ctx) body += `<div class="qctx${/<svg/.test(q.ctx) ? ' fig' : ''}">${rich(q.ctx)}</div>`;
      if (q.type === 'mc') {
        const long = it.order.some((k) => plain(q.choices[k]).length > 16 && !/<svg/.test(q.choices[k]));
        body += `<div class="choices${long ? ' long' : ''}">${it.order.map((k, d) => `<button class="choice" data-d="${d}"><span class="no">${d + 1}</span><span class="ct">${rich(q.choices[k])}</span></button>`).join('')}</div>`;
      } else if (q.type === 'ox') {
        body += `<div class="ox"><button class="choice" data-v="1"><span class="ct o">O</span></button><button class="choice" data-v="0"><span class="ct x">X</span></button></div>`;
      } else {
        body += `<div class="inrow"><input id="qIn" autocomplete="off" placeholder="답을 쓰세요"><button class="btn primary" id="qGo">확인</button></div>${q.hint ? `<div class="hint">힌트: ${esc(q.hint)}</div>` : ''}`;
      }
      body += `<div id="qFeed"></div>`;
      $('#sheet').innerHTML = `<div class="shead"><canvas width="108" height="108" id="qFace"></canvas><div><h2>${esc(this.cfg.title)}</h2><p>${esc(this.cfg.sub)}</p></div><div class="qdots">${dots}</div></div><div class="sbody">${body}</div><div class="sfoot"><button class="btn ghost small" id="qQuit">그만하기</button><button class="btn primary" id="qNext" hidden>${this.i + 1 < n ? '다음 문제' : '결과 보기'}</button></div>`;
      portrait($('#qFace'), this.cfg.look || st.look);
      $('#sheet').scrollTop = 0;
      $('#sheet').querySelectorAll('.choice').forEach((b) => b.addEventListener('click', () => this.pick(b)));
      const inp = $('#qIn');
      if (inp) { $('#qGo').addEventListener('click', () => this.pickInput()); inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); if (!this.answered) this.pickInput(); else this.next(); } }); setTimeout(() => { try { inp.focus(); } catch (e) { /* 무시 */ } }, 60); }
      $('#qNext').addEventListener('click', () => this.next());
      $('#qQuit').addEventListener('click', () => this.quit());
    },
    pick(btn) {
      if (this.answered) return;
      const it = this.items[this.i], q = it.q; let ok, given;
      if (q.type === 'mc') { const d = +btn.dataset.d, k = it.order[d]; ok = k === q.answer; given = q.choices[k]; }
      else { const v = btn.dataset.v === '1'; ok = v === q.answer; given = v ? 'O' : 'X'; }
      this.resolve(ok, given, btn);
    },
    pickInput() {
      if (this.answered) return;
      const v = ($('#qIn').value || '').trim(); if (!v) { $('#qIn').focus(); return; }
      const q = this.items[this.i].q, ok = q.answer.some((a) => norm(a) === norm(v));
      $('#qIn').disabled = true; $('#qGo').disabled = true;
      this.resolve(ok, v, null);
    },
    resolve(ok, given, btn) {
      this.answered = true;
      const it = this.items[this.i], q = it.q;
      this.log.push({ ok, q, pool: it.pool, given });
      if (ok) this.ok++;
      record(q, it.pool, ok, given, this.cfg);
      const btns = $('#sheet').querySelectorAll('.choice');
      btns.forEach((b) => { b.disabled = true; });
      if (q.type === 'mc') btns.forEach((b) => { const k = it.order[+b.dataset.d]; if (k === q.answer) b.classList.add('ok'); });
      if (q.type === 'ox') btns.forEach((b) => { if ((b.dataset.v === '1') === q.answer) b.classList.add('ok'); });
      if (!ok && btn) btn.classList.add('no-pick');
      let right = '';
      if (q.type === 'mc') right = rich(q.choices[q.answer]); else if (q.type === 'ox') right = q.answer ? 'O' : 'X'; else right = esc(q.answer[0]);
      const head = ok ? pick(['정답이에요!', '딩동댕!', '맞았어요!', '훌륭해요!']) : '아쉬워요!';
      const coin = ok && this.cfg.coin ? ` <small>+${this.cfg.coin} 코인</small>` : '';
      $('#qFeed').innerHTML = `<div class="feed ${ok ? 'good' : 'bad'}"><span class="ft">${head}${coin}</span>${ok ? '' : `정답: <b>${right}</b><br>`}${rich(q.exp)}</div>`;
      Snd.play(ok ? 'ok' : 'no');
      const dots = $('#sheet').querySelectorAll('.qdots i'); if (dots[this.i]) dots[this.i].className = ok ? 'ok' : 'no';
      const nx = $('#qNext'); nx.hidden = false; setTimeout(() => { try { nx.focus({ preventScroll: true }); } catch (e) { /* 무시 */ } }, 30);
      $('#qFeed').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    },
    next() { if (!this.answered) return; this.i++; if (this.i >= this.items.length) this.finish(); else this.render(); },
    quit() {
      if (!this.log.length) { closeSheet(); return; }
      confirmBox('그만할까요?', '지금까지 푼 문제는 기록되지만, 퀘스트는 통과하지 못해요.', '그만하기', () => { this.done = true; closeSheet(); }, () => this.render());
    },
    finish() {
      this.done = true;
      const ok = this.ok, total = this.items.length, res = this.cfg.onEnd ? this.cfg.onEnd(ok, total, this.log) || {} : {};
      const isFinal = this.cfg.final, chest = this.cfg.chest;
      let big = `${ok} / ${total}`, msg = '', extra = '';
      if (chest) { msg = ok ? '보물상자가 열렸어요! <b>+15 코인</b>' : '상자가 꿈쩍도 안 해요. 다른 문제로 다시 도전해 보세요!'; }
      else if (isFinal) {
        msg = res.pass ? (res.first ? '졸업 시험 통과! <b>학사모</b>와 졸업장, 그리고 졸업 기념 펫 <b>황금 부엉이</b>를 받았어요.' : '이번에도 통과! 실력이 탄탄하네요.') : `${CFG.FINAL_PASS}문제 이상 맞혀야 통과예요. 오답 노트로 복습하고 다시 도전해요!`;
      } else if (this.cfg.wrongReview) msg = `오답 ${ok}문제를 바로잡았어요!`;
      else {
        const q = QMAP[this.cfg.questId] || null;
        msg = res.first ? `퀘스트 통과! 메달을 받았어요. <b>+30 코인</b>` : res.pass ? '통과! 복습 완료예요.' : `${CFG.PASS_SCORE}문제 이상 맞혀야 통과예요. 다시 도전해 보세요!`;
        if (res.first && q) extra = `<div class="badge-big">${badgeSVG(q, true)}</div><p class="msg"><b>${esc(q.badge)}</b></p>`;
      }
      if (isFinal && res.first) extra = `<div class="badge-big gradset">${hatPreviewSVG()}<canvas width="168" height="168" id="owlPrev"></canvas></div>`;
      const wrongN = this.log.filter((l) => !l.ok).length;
      $('#sheet').innerHTML = `<div class="shead"><canvas width="108" height="108" id="qFace"></canvas><div><h2>${esc(this.cfg.title)}</h2><p>${esc(this.cfg.sub)}</p></div></div><div class="sbody result"><div class="big">${big}</div>${extra}<p class="msg">${msg}</p>${wrongN && !chest ? `<p class="msg" style="font-size:15px;color:var(--ink-soft)">틀린 ${wrongN}문제는 오답 노트에 담겼어요.</p>` : ''}</div><div class="sfoot">${wrongN && !chest ? '<button class="btn small" id="rWrong">오답 노트 보기</button>' : ''}${!res.pass && this.cfg.retry ? '<button class="btn sun" id="rRetry">다시 도전</button>' : ''}${isFinal && res.pass ? '<button class="btn sun" id="rCert">졸업장 보기</button>' : ''}<button class="btn primary" id="rClose">닫기</button></div>`;
      portrait($('#qFace'), this.cfg.look || st.look);
      if ($('#owlPrev')) drawPetPreview($('#owlPrev'), 'owl', 0.7);
      $('#rClose').addEventListener('click', closeSheet);
      if ($('#rWrong')) $('#rWrong').addEventListener('click', () => openWrong());
      if ($('#rRetry')) $('#rRetry').addEventListener('click', () => this.cfg.retry());
      if ($('#rCert')) $('#rCert').addEventListener('click', () => openCert());
    }
  };
  function record(q, pool, ok, given, cfg) {
    st.stats.a++; if (ok) st.stats.c++;
    const td = today(); td.a++;
    if (ok) { td.c++; if (q.gen) td.gu[pool] = (td.gu[pool] || 0) + 1; else td.u[q.id] = 1; }
    const ps = st.stats.pools[pool] || (st.stats.pools[pool] = { a: 0, c: 0 }); ps.a++; if (ok) ps.c++;
    if (!q.gen) markSeen(pool, q.id);
    if (ok) { if (q.gen) st.genOk[pool] = (st.genOk[pool] || 0) + 1; else st.mastered[q.id] = 1; }
    const i = st.wrong.findIndex((w) => (w.id || (w.q && w.q.id)) === q.id);
    if (ok) { if (i >= 0) st.wrong.splice(i, 1); if (cfg.coin) addCoins(cfg.coin, true); }
    else {
      const e = { id: q.id, pool, at: Date.now() };
      if (q.gen) e.q = q; // 자동으로 만든 문제만 통째로 저장
      if (q.type === 'mc') e.gk = q.choices.indexOf(given); else e.given = String(given);
      if (i >= 0) st.wrong.splice(i, 1);
      st.wrong.unshift(e);
      let g = 0; st.wrong = st.wrong.filter((w) => !(w.q && w.q.gen) || ++g <= 15).slice(0, 60);
    }
    refreshHud();
