<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>지식의 섬 졸업 대모험</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%233e9fd6'/%3E%3Cellipse cx='32' cy='44' rx='21' ry='9' fill='%23f2d48b' stroke='%231d2b45' stroke-width='3'/%3E%3Cpath d='M31 43c0-11 2-19 6-25' stroke='%237a4c28' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3Cpath d='M37 18c-9-3-16 1-19 7 7-3 13-3 19-7zm0 0c9-3 16 1 19 7-7-3-13-3-19-7zm0 0c-1-7 3-11 8-13-1 6-4 10-8 13z' fill='%2339a85a' stroke='%231d2b45' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
<script>
/* =========================================================
   선생님 설정 (필요한 곳만 바꾸세요)
   API_URL: 구글 앱스스크립트 웹 앱 주소(https://script.google.com/macros/s/…/exec)를
            붙여 넣으면 반 학생들의 기록이 구글 시트에 모이고 '명예의 전당'에 순위가 보입니다.
            비워 두면 기록은 학생 기기에만 저장됩니다.
   선생님 모드 비밀번호는 여기가 아니라 앱스스크립트 Code.gs 맨 위(TEACHER_PIN)에 적어요.
   (이 파일은 누구나 볼 수 있어서 비밀번호를 두면 안 돼요)
   ========================================================= */
window.GAME_CONFIG = {
  API_URL: "https://script.google.com/macros/s/AKfycbw8FIFuOAf7b-QHK9AJoKLL7fNKGSQpxRnP9AOnS9jaWvUST4at_RQ2DiFtUcm2FcjFmg/exec",
  QUESTIONS_PER_QUEST: 5,   // 퀘스트 한 번에 푸는 문제 수
  PASS_SCORE: 4,            // 퀘스트 통과에 필요한 정답 수
  FINAL_QUESTIONS: 15,      // 졸업 시험 문제 수
  FINAL_PASS: 12,           // 졸업 시험 통과에 필요한 정답 수
  UPDATE_CHECK_SEC: 60,     // 깃허브에 새 파일이 올라왔는지 확인하는 간격(초) → 새 버전이면 학생 화면이 저절로 바뀜
  NOTICE_CHECK_SEC: 30,     // 선생님 공지·계정 삭제를 확인하는 간격(초)
  RANK_REFRESH_SEC: 30      // 명예의 전당·반 현황을 새로 불러오는 간격(초)
};
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
/* 지식의 섬: 하늘빛 바다 위 초록 섬. 그림책처럼 진한 남색 테두리와 아래로 떨어지는 단색 그림자,
   크림색 종이 패널, 노랑은 퀘스트·보상에만 아껴 쓴다. 레이아웃: 화면 전체가 게임 세계, 네 귀퉁이에 떠 있는 섬 모양 UI */
:root {
  --ink: #1d2b45;
  --ink-soft: #55627d;
  --paper: #fffaf0;
  --paper-2: #fff1d6;
  --line: #e7d9bd;
  --sun: #ffc23d;
  --coral: #ff6b4a;
  --mint: #18a88f;
  --berry: #e2434b;
  --sea: #2f8fd0;
  --font-display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --font-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; background: #3e9fd6; color: var(--ink); font-family: var(--font-body); -webkit-tap-highlight-color: transparent; }
body { touch-action: none; user-select: none; -webkit-user-select: none; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--sea); outline-offset: 2px; }
[hidden] { display: none !important; }
#world { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

/* ---------- 공용 스티커 스타일 ---------- */
.sticker { background: var(--paper); border: 2.5px solid var(--ink); border-radius: 18px; box-shadow: 0 4px 0 var(--ink); }
.btn { font-family: var(--font-display); font-size: 18px; border: 2.5px solid var(--ink); border-radius: 14px; padding: 10px 18px; background: var(--paper); box-shadow: 0 4px 0 var(--ink); transition: transform .08s, box-shadow .08s; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn.primary { background: var(--coral); color: #fff; }
.btn.sun { background: var(--sun); }
.btn.mint { background: var(--mint); color: #fff; }
.btn.ghost { background: transparent; box-shadow: none; border-color: transparent; color: var(--ink-soft); }
.btn.small { font-size: 15px; padding: 6px 12px; border-radius: 11px; box-shadow: 0 3px 0 var(--ink); }
.btn[disabled] { opacity: .45; cursor: default; }

/* ---------- HUD ---------- */
#hud { position: fixed; left: 12px; top: 12px; z-index: 5; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; max-width: calc(100% - 24px); pointer-events: none; }
.chip { pointer-events: auto; display: flex; align-items: center; gap: 7px; padding: 5px 12px 5px 5px; background: var(--paper); border: 2.5px solid var(--ink); border-radius: 999px; box-shadow: 0 3px 0 var(--ink); font-family: var(--font-display); font-size: 17px; line-height: 1; white-space: nowrap; }
.chip .ico { width: 28px; height: 28px; flex: none; }
.chip.name canvas { width: 30px; height: 30px; border-radius: 50%; background: #bfe6ff; border: 2px solid var(--ink); }
.chip small { font-family: var(--font-body); font-size: 12px; color: var(--ink-soft); }
#toolbar { position: fixed; right: 12px; top: 12px; z-index: 5; display: flex; gap: 6px; }
.tool { width: 52px; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; background: var(--paper); border: 2.5px solid var(--ink); border-radius: 15px; box-shadow: 0 3px 0 var(--ink); font-family: var(--font-display); font-size: 12px; padding: 2px; }
.tool svg { width: 26px; height: 26px; }
.tool:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.tool .dot { position: absolute; transform: translate(16px, -20px); width: 12px; height: 12px; border-radius: 50%; background: var(--berry); border: 2px solid var(--ink); }
.tool { position: relative; }
#minimap { position: fixed; right: 12px; top: 80px; z-index: 4; width: 172px; height: 134px; border: 2.5px solid var(--ink); border-radius: 14px; box-shadow: 0 3px 0 var(--ink); background: #3e9fd6; cursor: pointer; }
#questTrack { position: fixed; right: 12px; top: 222px; z-index: 4; width: 172px; padding: 8px 10px; font-size: 13px; line-height: 1.35; pointer-events: auto; cursor: pointer; }
#questTrack b { font-family: var(--font-display); font-weight: 400; font-size: 14px; display: block; }

#prompt { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 6; display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 8px; font-size: 16px; white-space: nowrap; }
#prompt kbd { font-family: var(--font-display); background: var(--sun); border: 2px solid var(--ink); border-radius: 8px; padding: 3px 9px; font-size: 15px; box-shadow: 0 2px 0 var(--ink); }
#joy { position: fixed; left: 22px; bottom: 26px; width: 128px; height: 128px; border-radius: 50%; z-index: 6; background: rgba(255,250,240,.35); border: 2.5px solid rgba(29,43,69,.55); touch-action: none; }
#joyKnob { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: var(--paper); border: 2.5px solid var(--ink); box-shadow: 0 3px 0 var(--ink); }
#actBtn { position: fixed; right: 22px; bottom: 30px; z-index: 6; width: 86px; height: 86px; border-radius: 50%; font-size: 17px; line-height: 1.1; background: var(--sun); }

/* ---------- 토스트 ---------- */
#toasts { position: fixed; left: 50%; top: 76px; transform: translateX(-50%); z-index: 30; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast { background: var(--paper); border: 2.5px solid var(--ink); border-radius: 14px; box-shadow: 0 3px 0 var(--ink); padding: 8px 14px; font-family: var(--font-display); font-size: 17px; animation: pop .25s ease-out; }
.toast.gold { background: var(--sun); }
.toast.good { background: #d8f6ee; }
@keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- 대화창 ---------- */
#dialog { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 20; width: min(760px, calc(100% - 24px)); display: flex; gap: 14px; padding: 14px 16px; align-items: flex-start; }
#dialog .portrait { flex: none; width: 92px; height: 92px; border-radius: 50%; border: 2.5px solid var(--ink); background: radial-gradient(circle at 50% 35%, #e8f6ff, #bfe1f7); }
#dialog .dmain { flex: 1; min-width: 0; }
#dialog .dname { font-family: var(--font-display); font-size: 19px; display: inline-block; background: var(--sun); border: 2px solid var(--ink); border-radius: 9px; padding: 2px 10px; margin-bottom: 6px; }
#dialog .dtext { font-size: 18px; line-height: 1.55; min-height: 56px; }
#dialog .dtext b { font-family: var(--font-display); font-weight: 400; color: var(--coral); }
#dialog .dbtns { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 10px; }
#dialog .more { font-size: 13px; color: var(--ink-soft); text-align: right; margin-top: 4px; }

/* ---------- 모달 ---------- */
#modal { position: fixed; inset: 0; z-index: 25; display: flex; align-items: center; justify-content: center; padding: 14px; background: rgba(18, 30, 52, .45); }
#sheet { width: min(760px, 100%); max-height: 100%; overflow: auto; touch-action: pan-y; padding: 0; user-select: text; -webkit-user-select: text; }
.shead { display: flex; align-items: center; gap: 12px; padding: 14px 16px 12px; border-bottom: 2.5px dashed var(--line); position: sticky; top: 0; background: var(--paper); z-index: 1; border-radius: 16px 16px 0 0; }
.shead canvas { width: 54px; height: 54px; border-radius: 50%; border: 2.5px solid var(--ink); background: radial-gradient(circle at 50% 35%, #e8f6ff, #bfe1f7); flex: none; }
.shead h2 { font-family: var(--font-display); font-weight: 400; font-size: 22px; margin: 0; text-wrap: balance; line-height: 1.15; }
.shead p { margin: 2px 0 0; color: var(--ink-soft); font-size: 14px; }
.shead .x { margin-left: auto; width: 40px; height: 40px; border-radius: 12px; border: 2.5px solid var(--ink); background: var(--paper); box-shadow: 0 3px 0 var(--ink); font-family: var(--font-display); font-size: 20px; flex: none; }
.sbody { padding: 16px 18px 18px; }
.sfoot { display: flex; gap: 10px; justify-content: flex-end; align-items: center; flex-wrap: wrap; padding: 0 18px 18px; }

/* ---------- 퀴즈 ---------- */
.qdots { display: flex; gap: 5px; margin-left: auto; }
.qdots i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--ink); background: #fff; display: block; }
.qdots i.on { background: var(--sun); }
.qdots i.ok { background: var(--mint); }
.qdots i.no { background: var(--berry); }
.qnum { font-family: var(--font-display); font-size: 15px; color: var(--ink-soft); margin-bottom: 6px; }
.qtext { font-size: 21px; line-height: 1.6; font-weight: 700; }
.qtext b, .qctx b { color: var(--coral); }
.qctx { margin-top: 12px; padding: 12px 14px; background: var(--paper-2); border: 2px solid var(--line); border-radius: 12px; font-size: 17px; line-height: 1.7; white-space: normal; overflow-x: auto; }
.qctx.fig { display: flex; justify-content: center; background: #fffdf7; }
.qfig { display: flex; gap: 18px; align-items: flex-end; justify-content: center; flex-wrap: wrap; }
.qfig figure { margin: 0; text-align: center; }
.qfig figcaption { font-size: 13px; color: var(--ink-soft); }
.qsvg { max-width: 100%; height: auto; display: block; }
.qsvg text { font-family: var(--font-body); }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
.choices.long { grid-template-columns: 1fr; }
.choice { display: flex; align-items: center; gap: 10px; text-align: left; padding: 12px 14px; min-height: 58px; font-size: 18px; line-height: 1.45; background: #fff; border: 2.5px solid var(--ink); border-radius: 14px; box-shadow: 0 4px 0 var(--ink); }
.choice .no { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-size: 15px; background: var(--paper-2); border: 2px solid var(--ink); }
.choice .ct { flex: 1; min-width: 0; }
.choice .ct .qsvg { margin: 0 auto; }
.choice:not([disabled]):hover { background: #fff7e3; }
.choice:not([disabled]):active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.choice.ok { background: #cbf3e8; }
.choice.ok .no { background: var(--mint); color: #fff; }
.choice.no-pick { background: #ffd9d6; }
.choice.no-pick .no { background: var(--berry); color: #fff; }
.choice[disabled] { cursor: default; }
.ox { display: flex; gap: 14px; margin-top: 18px; }
.ox .choice { flex: 1; justify-content: center; font-family: var(--font-display); font-size: 44px; min-height: 96px; }
.ox .choice .ct { flex: none; }
.ox .o { color: var(--sea); }
.ox .x { color: var(--berry); }
.inrow { display: flex; gap: 10px; margin-top: 18px; }
.inrow input { flex: 1; min-width: 0; font: inherit; font-size: 20px; padding: 12px 14px; border: 2.5px solid var(--ink); border-radius: 14px; background: #fff; user-select: text; -webkit-user-select: text; }
.hint { margin-top: 8px; color: var(--ink-soft); font-size: 15px; }
.feed { margin-top: 16px; padding: 12px 14px; border-radius: 14px; border: 2.5px solid var(--ink); font-size: 17px; line-height: 1.6; animation: pop .2s ease-out; }
.feed.good { background: #d8f6ee; }
.feed.bad { background: #ffe6e2; }
.feed .ft { font-family: var(--font-display); font-size: 20px; display: block; margin-bottom: 2px; }
.feed .ref { display: inline-block; margin-top: 6px; font-size: 13px; color: var(--ink-soft); background: #fff; border: 1.5px solid var(--line); border-radius: 8px; padding: 1px 8px; }
.mx { display: inline-flex; align-items: center; gap: .12em; vertical-align: middle; }
.mx .w { font-size: 1.04em; }
.fr { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; font-size: .86em; line-height: 1.08; margin: 0 .1em; }
.fr > span:first-child { border-bottom: 2px solid currentColor; padding: 0 .2em; }
.fr > span:last-child { padding: 0 .2em; }

.result { text-align: center; padding: 6px 0 4px; }
.result .big { font-family: var(--font-display); font-size: 48px; line-height: 1.1; }
.result .msg { font-size: 18px; margin-top: 6px; line-height: 1.6; }
.badge-big { width: 120px; height: 120px; margin: 6px auto 0; animation: spinIn .7s cubic-bezier(.2,1.4,.4,1); }
@keyframes spinIn { from { transform: scale(.2) rotate(-200deg); } to { transform: none; } }

/* ---------- 패널(퀘스트·오답·지도 등) ---------- */
.qlist { display: grid; gap: 14px; }
.subj h3 { font-family: var(--font-display); font-weight: 400; font-size: 18px; margin: 0 0 8px; display: flex; align-items: center; gap: 8px; }
.subj h3 .pill { font-family: var(--font-body); font-size: 13px; color: var(--ink-soft); }
.qrow { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border: 2px solid var(--line); border-radius: 13px; background: #fff; margin-bottom: 7px; }
.qrow.track { border-color: var(--ink); box-shadow: 0 3px 0 var(--ink); }
.qrow .bdg { width: 38px; height: 38px; flex: none; }
.qrow .qi { flex: 1; min-width: 0; }
.qrow .qi b { font-family: var(--font-display); font-weight: 400; font-size: 16px; display: block; }
.qrow .qi span { font-size: 13px; color: var(--ink-soft); }
.state { font-family: var(--font-display); font-size: 13px; padding: 3px 9px; border-radius: 999px; border: 2px solid var(--ink); white-space: nowrap; }
.state.done { background: var(--mint); color: #fff; }
.state.todo { background: var(--sun); }
.bar { height: 10px; border-radius: 6px; background: #efe5cf; overflow: hidden; border: 1.5px solid var(--ink); margin-top: 4px; }
.bar > i { display: block; height: 100%; background: var(--mint); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
.stat { background: #fff; border: 2px solid var(--line); border-radius: 13px; padding: 9px 10px; }
.stat b { font-family: var(--font-display); font-weight: 400; font-size: 22px; display: block; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--ink-soft); }
.wrong { border: 2px solid var(--line); background: #fff; border-radius: 13px; padding: 10px 12px; margin-bottom: 9px; font-size: 15px; line-height: 1.55; }
.wrong .wq { font-weight: 700; }
.wrong .wa { color: var(--mint); }
.wrong .wm { color: var(--berry); }
.wrong .wt { font-size: 12px; color: var(--ink-soft); }
.wrong .qsvg { max-width: 170px; height: auto; display: inline-block; vertical-align: middle; }
.wrong .wc { margin: 6px 0; padding: 8px 10px; background: var(--paper-2); border-radius: 10px; font-size: 14px; overflow-x: auto; }
.wrong .wc .qfig { justify-content: flex-start; }
.empty { text-align: center; color: var(--ink-soft); padding: 26px 8px; font-size: 16px; line-height: 1.6; }
.rank { width: 100%; border-collapse: collapse; font-size: 15px; font-variant-numeric: tabular-nums; }
.rank th, .rank td { padding: 7px 8px; border-bottom: 1.5px solid var(--line); text-align: left; }
.rank th { font-family: var(--font-display); font-weight: 400; color: var(--ink-soft); font-size: 14px; }
.rank tr.me td { background: #fff1c2; }
.rank td.n { font-family: var(--font-display); font-size: 17px; }
.mapwrap { position: relative; }
.mapwrap canvas { width: 100%; height: auto; display: block; border: 2.5px solid var(--ink); border-radius: 14px; background: #3e9fd6; }
.warp { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.shop { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.item { background: #fff; border: 2px solid var(--line); border-radius: 14px; padding: 10px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.item canvas { width: 84px; height: 84px; border-radius: 50%; background: radial-gradient(circle at 50% 35%, #e8f6ff, #bfe1f7); border: 2px solid var(--ink); }
.item b { font-family: var(--font-display); font-weight: 400; font-size: 16px; }
.item.on { border-color: var(--ink); box-shadow: 0 3px 0 var(--ink); }
.set { display: grid; gap: 12px; }
.set .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; background: #fff; border: 2px solid var(--line); border-radius: 13px; }
.set .row b { font-family: var(--font-display); font-weight: 400; font-size: 16px; }
.set .row span { font-size: 13px; color: var(--ink-soft); display: block; }
.help { font-size: 15px; line-height: 1.7; }
.help kbd { font-family: var(--font-display); background: var(--paper-2); border: 2px solid var(--ink); border-radius: 7px; padding: 0 7px; }
.signcard { font-size: 19px; line-height: 1.7; }
.signcard h3 { font-family: var(--font-display); font-weight: 400; font-size: 24px; margin: 0 0 8px; }

/* ---------- 캐릭터 만들기 ---------- */
.maker { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.maker canvas { width: 116px; height: 116px; border-radius: 50%; border: 2.5px solid var(--ink); background: radial-gradient(circle at 50% 35%, #e8f6ff, #bfe1f7); flex: none; }
.swrow { display: flex; align-items: center; gap: 6px; margin: 4px 0; flex-wrap: wrap; }
.swrow > span { width: 52px; font-family: var(--font-display); font-size: 14px; }
.sw { width: 30px; height: 30px; border-radius: 50%; border: 2.5px solid var(--ink); padding: 0; }
.sw.on { box-shadow: 0 0 0 3px var(--paper), 0 0 0 6px var(--ink); }
.swt { font-family: var(--font-display); font-size: 14px; border: 2px solid var(--ink); border-radius: 9px; padding: 3px 9px; background: #fff; }
.swt.on { background: var(--sun); }

/* ---------- 시작 화면 ---------- */
#title { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; padding: 16px; overflow: auto; touch-action: pan-y; background: linear-gradient(180deg, rgba(20,60,110,.15), rgba(20,40,70,.55)); }
.tcard { width: min(560px, 100%); padding: 22px 22px 20px; user-select: text; -webkit-user-select: text; }
.logo { font-family: var(--font-display); font-size: clamp(48px, 10vw, 78px); line-height: .95; margin: 0; color: #fff; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 6px 0 var(--ink); letter-spacing: -1px; }
.logo span { color: var(--sun); }
.tsub { font-family: var(--font-display); font-size: 18px; margin: 10px 0 0; }
.tdesc { font-size: 15px; line-height: 1.6; color: var(--ink-soft); margin: 8px 0 14px; }
.subjects { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.subjects span { font-family: var(--font-display); font-size: 14px; border: 2px solid var(--ink); border-radius: 999px; padding: 3px 10px; background: #fff; }
.field { display: grid; gap: 6px; margin-bottom: 12px; }
.field label { font-family: var(--font-display); font-size: 15px; }
.field input { font: inherit; font-size: 18px; padding: 10px 12px; border: 2.5px solid var(--ink); border-radius: 12px; background: #fff; width: 100%; }
.frow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.saved { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 12px; }
.saved button { font-size: 14px; }
.err { color: var(--berry); font-size: 14px; min-height: 20px; }
.tfoot { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-top: 6px; }
.tfoot small { color: var(--ink-soft); font-size: 12.5px; }

/* ---------- 졸업장 ---------- */
.cert { background: #fffdf5; border: 3px double var(--ink); border-radius: 10px; margin: 4px; padding: 26px 22px; text-align: center; position: relative; }
.cert h2 { font-family: var(--font-display); font-weight: 400; font-size: 44px; margin: 0 0 4px; letter-spacing: 8px; }
.cert .who { font-family: var(--font-display); font-size: 30px; margin: 16px 0 4px; }
.cert p { font-size: 17px; line-height: 1.85; margin: 12px auto; max-width: 30em; }
.cert .sig { font-family: var(--font-display); font-size: 18px; margin-top: 18px; }
.cert .badges { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; margin-top: 10px; }
.cert .badges svg { width: 34px; height: 34px; }

/* ---------- 접속 정보 ---------- */
.idrow { display: grid; grid-template-columns: 74px 1fr 1fr 2.2fr; gap: 10px; }
.fixed { font-family: var(--font-display); font-size: 18px; white-space: nowrap; padding: 11px 6px; border: 2.5px dashed var(--line); border-radius: 12px; background: var(--paper-2); text-align: center; color: var(--ink-soft); }
.field input.bad { border-color: var(--berry); box-shadow: 0 0 0 3px rgba(226,67,75,.18); }
.tconfirm { background: #fff4e0; border: 2px solid var(--ink); border-radius: 12px; padding: 10px 12px; color: var(--ink); font-size: 14.5px; line-height: 1.55; margin: 2px 0 6px; }
.tcbtns { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 8px; }
.saved button small { font-family: var(--font-body); font-size: 12px; color: var(--ink-soft); }

/* ---------- 교과서 쪽수 ---------- */
.bk { width: 18px; height: 18px; flex: none; }
.qref { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; background: #fff6d6; border: 2px solid var(--ink); border-radius: 999px; padding: 3px 12px 3px 8px; margin: 0 0 10px; }
.qref b { font-family: var(--font-display); font-weight: 400; font-size: 15px; }
.dnote { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 14px; color: var(--ink-soft); }
#dialog .dtext .dnote b { color: var(--ink); }

/* ---------- 탭 ---------- */
.tabs { display: flex; gap: 6px; padding: 12px 18px 0; flex-wrap: wrap; }
.tab { font-family: var(--font-display); font-size: 16px; border: 2.5px solid var(--ink); border-radius: 12px; padding: 7px 14px; background: #fff; box-shadow: 0 3px 0 var(--ink); }
.tab.on { background: var(--sun); }

/* ---------- 랭킹 ---------- */
.mycard { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; background: linear-gradient(180deg, #fff7dc, #ffeebd); border: 2.5px solid var(--ink); border-radius: 16px; padding: 12px 14px; margin-bottom: 14px; }
.myscore { display: grid; gap: 2px; min-width: 140px; }
.myscore small { font-size: 13px; color: var(--ink-soft); }
.myscore b { font-family: var(--font-display); font-weight: 400; font-size: 34px; line-height: 1; }
.myscore b span { font-size: 16px; margin-left: 3px; }
.myscore em { font-style: normal; font-family: var(--font-display); font-size: 14px; color: var(--coral); }
.parts { flex: 1; display: flex; flex-wrap: wrap; gap: 6px; }
.parts span { display: inline-flex; align-items: center; gap: 5px; background: #fff; border: 2px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 13.5px; }
.parts i { font-style: normal; color: var(--ink-soft); }
.parts em { font-style: normal; font-family: var(--font-display); color: var(--mint); }
.parts em.minus { color: var(--berry); }
.rk { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--ink); font-size: 14px; }
.rk.r1 { background: #ffd34d; } .rk.r2 { background: #dfe6ee; } .rk.r3 { background: #f2b27a; }
.rankme { display: flex; align-items: baseline; justify-content: center; gap: 8px; margin-top: 12px; padding: 10px; border: 2.5px dashed var(--ink); border-radius: 14px; background: #fff1c2; font-family: var(--font-display); font-size: 18px; }
.rankme b { font-weight: 400; font-size: 26px; color: var(--coral); }
.rankme span { color: var(--ink-soft); font-size: 15px; }
.rnote { font-size: 12.5px; color: var(--ink-soft); line-height: 1.6; margin: 12px 0 0; }
.rnote.warn { color: var(--berry); }
.rank .grad { font-size: 14px; }

/* ---------- 상점·펫 ---------- */
.item .need { font-size: 12px; color: var(--ink-soft); }
.item .kind { font-size: 12px; color: var(--ink-soft); margin-top: -4px; }
.item .prow { display: flex; gap: 2px; flex-wrap: wrap; justify-content: center; }
.item .prow .btn { padding: 5px 8px; font-size: 14px; }
.item.pet canvas { background: radial-gradient(circle at 50% 78%, #d7f2bf, #a6da86 70%); }
.item.locked canvas { filter: grayscale(.35) brightness(.95); }
.namepet { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.namepet canvas { width: 100px; height: 100px; border-radius: 50%; border: 2.5px solid var(--ink); background: radial-gradient(circle at 50% 78%, #d7f2bf, #a6da86 70%); flex: none; }
.namepet .field { flex: 1; min-width: 180px; margin: 0; }
.badge-big.gradset { width: auto; height: auto; display: flex; gap: 14px; justify-content: center; align-items: center; }
.badge-big.gradset svg { width: 84px; height: 84px; flex: none; }
.badge-big.gradset canvas { width: 84px; height: 84px; border-radius: 50%; border: 2.5px solid var(--ink); background: radial-gradient(circle at 50% 78%, #fff3c4, #ffd98a 70%); }
.parts .tot { background: none; border: 1.5px dashed var(--line); color: var(--ink); }
.parts .tot i { font-style: normal; color: var(--ink-soft); margin-right: 3px; }
.myscore em.soft { color: var(--ink-soft); font-style: normal; }
.gradn { white-space: nowrap; }
.rank .dim, .tstat .dim { color: var(--ink-soft); }

/* ---------- 선생님 공지·새 버전 알림 ---------- */
#topMsgs { position: fixed; left: 12px; top: 72px; z-index: 28; width: min(540px, calc(100% - 220px)); display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
#notices:empty { display: none; }
#modal:not([hidden]) ~ #topMsgs #updBar { display: none; } /* 창이 열려 있을 땐 새 버전 알림을 가리지 않게 숨김 */
#notices { display: flex; flex-direction: column; gap: 8px; }
.notice { pointer-events: auto; display: flex; gap: 10px; align-items: flex-start; background: #fff3c9; border: 2.5px solid var(--ink); border-radius: 16px; box-shadow: 0 4px 0 var(--ink); padding: 10px 10px 10px 12px; animation: drop .35s cubic-bezier(.2, 1.3, .4, 1); }
.notice .nic { flex: none; width: 36px; height: 36px; border-radius: 50%; background: #fff; border: 2px solid var(--ink); display: grid; place-items: center; }
.notice .nic svg { width: 22px; height: 22px; }
.notice .ntx { flex: 1; min-width: 0; }
.notice .ntx b { font-family: var(--font-display); font-weight: 400; font-size: 14px; color: var(--coral); display: block; }
.notice .ntx p { margin: 2px 0 0; font-size: 17px; line-height: 1.45; word-break: keep-all; overflow-wrap: anywhere; }
.notice .nx { flex: none; width: 34px; height: 34px; border-radius: 10px; border: 2px solid var(--ink); background: var(--paper); font-family: var(--font-display); font-size: 19px; line-height: 1; padding: 0; }
#updBar { pointer-events: auto; display: flex; align-items: center; gap: 4px 10px; flex-wrap: wrap; background: #dcf1ff; border: 2.5px solid var(--ink); border-radius: 14px; box-shadow: 0 3px 0 var(--ink); padding: 8px 14px; font-size: 14px; animation: drop .35s ease-out; }
#updBar b { font-family: var(--font-display); font-weight: 400; font-size: 16px; }
#updBar span { color: var(--ink-soft); }
@keyframes drop { from { transform: translateY(-12px); opacity: 0; } to { transform: none; opacity: 1; } }
.tteach { display: flex; justify-content: center; margin-top: 12px; padding-top: 10px; border-top: 2px dashed var(--line); }
.tlink { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; color: var(--ink-soft); font-size: 13.5px; padding: 4px 8px; border-radius: 8px; }
.tlink svg { width: 20px; height: 20px; }
.tlink:hover { color: var(--ink); background: rgba(29, 43, 69, .06); }

/* ---------- 선생님 모드 ---------- */
#sheet.wide { width: min(980px, 100%); }
#modal.top { z-index: 45; }
.shead .btn { margin-left: auto; flex: none; }
.tform { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); gap: 0 14px; }
.tform .full { grid-column: 1 / -1; }
.field select, .field textarea { font: inherit; font-size: 17px; padding: 9px 12px; border: 2.5px solid var(--ink); border-radius: 12px; background: #fff; width: 100%; color: var(--ink); }
.field textarea { resize: vertical; min-height: 66px; line-height: 1.5; }
.field label small { font-family: var(--font-body); font-size: 12.5px; color: var(--ink-soft); margin-left: 6px; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg .swt, .trow .swt { font-size: 15px; padding: 7px 12px; border-radius: 11px; }
.tsend { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.tsend .rnote { margin: 0; }
.th3 { font-family: var(--font-display); font-weight: 400; font-size: 17px; margin: 18px 0 8px; }
.nlist { display: grid; gap: 8px; }
.nitem { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 10px; align-items: center; background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 8px 8px 8px 10px; }
.nitem p { margin: 0; line-height: 1.45; word-break: keep-all; overflow-wrap: anywhere; }
.nitem small { color: var(--ink-soft); white-space: nowrap; font-size: 13px; }
.nitem .pill { font-family: var(--font-display); font-size: 13px; background: var(--sun); border: 2px solid var(--ink); border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
.trow { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.trow .swt small { font-family: var(--font-body); font-size: 12px; color: var(--ink-soft); }
.trow .btn { margin-left: auto; }
.tsum { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
.tsum span { background: #fff; border: 2px solid var(--line); border-radius: 999px; padding: 3px 11px; font-size: 14px; }
.tsum span b { font-family: var(--font-display); font-weight: 400; font-size: 16px; }
.tsum .rnote { border: 0; background: none; padding: 0; margin: 0 0 0 auto; }
.twrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 2px solid var(--line); border-radius: 12px; background: #fff; }
.tstat { min-width: 720px; }
.tstat th, .tstat td { padding: 7px 9px; white-space: nowrap; }
.tstat tbody tr:last-child td { border-bottom: 0; }
.tstat td:last-child { text-align: right; }
.tstat .dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; background: #cfd5df; border: 1.5px solid var(--ink); margin-right: 7px; vertical-align: 0; }
.tstat .dot.on { background: #2fcf7d; box-shadow: 0 0 0 3px rgba(47, 207, 125, .25); }
.live { font-family: var(--font-display); color: #0f8a55; }
.btn.ghost.danger { color: var(--berry); border: 2px solid #f1b3ae; background: #fff; box-shadow: none; padding: 3px 11px; font-size: 14px; }
.btn.ghost.danger:hover { background: #ffecea; }
@media (max-width: 640px) {
  #topMsgs { left: 12px; right: 12px; top: 172px; width: auto; }
  .notice .ntx p { font-size: 16px; }
  .tform { grid-template-columns: 1fr; }
  .nitem { grid-template-columns: auto minmax(0, 1fr) auto; }
  .nitem p { grid-column: 1 / -1; grid-row: 2; }
  .tsum .rnote { margin-left: 0; width: 100%; }
}
@media (max-width: 480px) {
  .idrow { grid-template-columns: 72px 1fr 1fr; }
  .fixed { font-size: 16px; }
  .mycard { flex-direction: column; align-items: stretch; }
  .myscore { grid-template-columns: 1fr auto; align-items: end; }
  .myscore small, .myscore em { grid-column: 1 / -1; }
  .idrow .nm { grid-column: 1 / -1; }
  .mycard { gap: 10px; }
  .tabs { padding: 10px 14px 0; }
  .tab { font-size: 15px; padding: 6px 10px; }
}
#actBtn { padding: 0; white-space: nowrap; }
@media (max-width: 640px) {
  #hud { flex-direction: column; align-items: flex-start; gap: 6px; }
  .chip { font-size: 15px; padding: 4px 10px 4px 4px; }
  .chip.name span { max-width: 86px; overflow: hidden; text-overflow: ellipsis; }
  .shead { flex-wrap: wrap; gap: 8px 12px; padding: 12px 14px 10px; }
  .shead > div:not(.qdots) { flex: 1; min-width: 0; }
  .shead h2 { font-size: 19px; }
  .shead .qdots { order: 3; width: 100%; margin-left: 0; }
  .sbody { padding: 14px 14px 16px; }
  .sfoot { padding: 0 14px 14px; }
  #actBtn { width: 80px; height: 80px; font-size: 16px; }
  .chip .ico { width: 24px; height: 24px; }
  .tool { width: 44px; height: 48px; font-size: 10.5px; border-radius: 13px; }
  .tool svg { width: 22px; height: 22px; }
  #minimap { top: 70px; width: 120px; height: 94px; }
  #questTrack { display: none !important; }
  .qtext { font-size: 18px; }
  .choice { font-size: 16px; min-height: 52px; padding: 10px 11px; }
  .choices { grid-template-columns: 1fr; }
  #dialog .portrait { width: 64px; height: 64px; }
  #dialog .dtext { font-size: 16px; }
  .stats { grid-template-columns: 1fr 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  .toast, .feed, .badge-big, .notice, #updBar { animation: none; }
}

</style>
</head>
<body>
<canvas id="world" aria-label="지식의 섬 지도"></canvas>

<div id="hud" hidden>
  <div class="chip name"><canvas id="hudFace" width="60" height="60"></canvas><span id="hudName"></span></div>
  <div class="chip" title="코인"><svg class="ico" viewBox="0 0 32 32"><circle cx="16" cy="16" r="12" fill="#ffc23d" stroke="#1d2b45" stroke-width="2.5"/><circle cx="16" cy="16" r="7" fill="none" stroke="#c8871a" stroke-width="2"/><path d="M16 11v10" stroke="#c8871a" stroke-width="2.5" stroke-linecap="round"/></svg><span id="hudCoins">0</span></div>
  <div class="chip" title="모은 메달"><svg class="ico" viewBox="0 0 32 32"><path d="M10 3h5l3 9h-5zM22 3h-5l-3 9h5z" fill="#ff6b4a" stroke="#1d2b45" stroke-width="2"/><circle cx="16" cy="20" r="9" fill="#ffc23d" stroke="#1d2b45" stroke-width="2.5"/><path d="M16 15l1.6 3.3 3.6.5-2.6 2.5.6 3.6-3.2-1.7-3.2 1.7.6-3.6-2.6-2.5 3.6-.5z" fill="#fff"/></svg><span id="hudBadges">0/13</span></div>
</div>

<div id="toolbar" hidden>
  <button class="tool" id="tQuest" title="퀘스트 목록 (Q)"><svg viewBox="0 0 32 32"><rect x="7" y="4" width="18" height="24" rx="3" fill="#fff" stroke="#1d2b45" stroke-width="2.5"/><path d="M11 11h10M11 16h10M11 21h6" stroke="#1d2b45" stroke-width="2.2" stroke-linecap="round"/></svg>퀘스트</button>
  <button class="tool" id="tWrong" title="오답 노트 (N)"><svg viewBox="0 0 32 32"><path d="M6 6h9a3 3 0 0 1 3 3v17a3 3 0 0 0-3-3H6z" fill="#ffd9d6" stroke="#1d2b45" stroke-width="2.3"/><path d="M26 6h-9a3 3 0 0 0-3 3v17a3 3 0 0 1 3-3h9z" fill="#fff" stroke="#1d2b45" stroke-width="2.3"/><path d="M19 12l4 4M23 12l-4 4" stroke="#e2434b" stroke-width="2.2" stroke-linecap="round"/></svg>오답<span class="dot" id="wrongDot" hidden></span></button>
  <button class="tool" id="tMap" title="지도 (M)"><svg viewBox="0 0 32 32"><path d="M4 8l8-3 8 3 8-3v19l-8 3-8-3-8 3z" fill="#bfe6a8" stroke="#1d2b45" stroke-width="2.3" stroke-linejoin="round"/><path d="M12 5v19M20 8v19" stroke="#1d2b45" stroke-width="2"/></svg>지도</button>
  <button class="tool" id="tRank" title="명예의 전당 (L)"><svg viewBox="0 0 32 32"><path d="M10 5h12v6a6 6 0 0 1-12 0z" fill="#ffc23d" stroke="#1d2b45" stroke-width="2.3"/><path d="M10 7H6a4 4 0 0 0 4 5M22 7h4a4 4 0 0 1-4 5" fill="none" stroke="#1d2b45" stroke-width="2.2"/><path d="M16 17v5M11 27h10l-1-5h-8z" fill="#fff" stroke="#1d2b45" stroke-width="2.2" stroke-linejoin="round"/></svg>순위</button>
  <button class="tool" id="tSet" title="설정"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="5" fill="#fff" stroke="#1d2b45" stroke-width="2.4"/><path d="M16 3v5M16 24v5M3 16h5M24 16h5M6.8 6.8l3.5 3.5M21.7 21.7l3.5 3.5M6.8 25.2l3.5-3.5M21.7 10.3l3.5-3.5" stroke="#1d2b45" stroke-width="2.6" stroke-linecap="round"/></svg>설정</button>
</div>
<canvas id="minimap" width="344" height="268" hidden title="지도 크게 보기"></canvas>
<div id="questTrack" class="sticker" hidden></div>

<div id="prompt" class="sticker" hidden></div>
<div id="joy" hidden><div id="joyKnob"></div></div>
<button id="actBtn" class="btn" hidden>말 걸기</button>

<div id="dialog" class="sticker" hidden>
  <canvas class="portrait" id="dlgFace" width="184" height="184"></canvas>
  <div class="dmain">
    <div class="dname" id="dlgName"></div>
    <div class="dtext" id="dlgText"></div>
    <div class="dbtns" id="dlgBtns"></div>
  </div>
</div>

<div id="modal" hidden><div id="sheet" class="sticker" role="dialog" aria-modal="true"></div></div>
<div id="topMsgs"><div id="updBar" role="status" hidden></div><div id="notices" aria-live="polite"></div></div>
<div id="toasts" aria-live="polite"></div>

<div id="title">
  <div class="tcard sticker">
    <h1 class="logo">지식의 <span>섬</span></h1>
    <p class="tsub">6학년 2학기 졸업 대모험</p>
    <p class="tdesc">섬을 돌아다니며 선생님들의 퀘스트를 해결하고 메달 13개를 모아 <b>졸업의 문</b>을 열어 보세요.</p>
    <div class="subjects"><span>국어 1~4단원</span><span>수학 1~4단원</span><span>사회 1단원 · 2단원(1·2)</span></div>
    <div id="savedBox" hidden><div class="field"><label>이 기기에 저장된 친구</label></div><div class="saved" id="savedList"></div></div>
    <div class="idrow">
      <div class="field"><label>학년</label><div class="fixed">6학년</div></div>
      <div class="field"><label for="inCls">반</label><input id="inCls" inputmode="numeric" maxlength="2" autocomplete="off" placeholder="예: 2"></div>
      <div class="field"><label for="inNum">번호</label><input id="inNum" inputmode="numeric" maxlength="2" autocomplete="off" placeholder="예: 15"></div>
      <div class="field nm"><label for="inName">이름</label><input id="inName" maxlength="10" autocomplete="off" placeholder="예: 김00"></div>
    </div>
    <div class="maker" id="maker"></div>
